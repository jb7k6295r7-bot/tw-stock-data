name: 歷史回補（手動）

# 一次性的長工，**不排程**——只能在 Actions 頁面手動按，並填要回補的區間。
# 為什麼分開：每日流程要在兩分鐘內結束；回補一次要跑好幾小時，
# 兩者混在一起，回補塞車就等於當天沒有資料。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe 驗端點｜run 逐日回補｜inst 全市場三大法人｜esb 興櫃逐檔逐月｜audit 盤點｜purge 刪區間｜meta 重建 first/last_seen"
        type: choice
        options: [probe, run, inst, esb, audit, purge, meta]
        default: probe
      start:
        description: "起日（run 用，YYYY-MM-DD）"
        default: "2015-01-01"
      end:
        description: "迄日（run 用，YYYY-MM-DD）。建議一次一年"
        default: "2015-12-31"
      markets:
        description: "要回補的市場，逗號分隔（run 用；興櫃走 esb 模式，這裡不要填 emerging）"
        default: "twse,tpex"
      codes:
        description: "興櫃代號，逗號分隔（esb 用）"
        default: "7879,5267,6434"
      saturdays:
        description: "run 時連週六也掃（抓補行交易日）。填 yes 才開"
        default: "no"
      sleep:
        description: "每個請求間隔秒數（run 用）。TWSE 會限流，2015 實測 1.5 秒有 94% 失敗 → 用 5"
        default: "5"
      probe_date:
        description: "probe 用的測試日，必須是交易日"
        default: "2026-08-28"

permissions:
  contents: write

concurrency:
  group: backfill          # 不要兩趟回補同時跑，會互相蓋掉 coverage
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # 上限 6 小時；一年約 245 天 × 3 市場 × 1.5 秒 ≈ 20 分鐘

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 全市場三大法人（上市 T86）
        if: inputs.mode == 'inst'
        run: |
          python backfill.py --inst \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep || '5' }}" \
            ${{ inputs.saturdays == 'yes' && '--saturdays' || '' }}

      - name: 重建 stocks.csv 的 first_seen／last_seen（只讀本地檔）
        if: inputs.mode == 'meta'
        run: python backfill.py --rebuild-meta

      - name: 清除區間（刪 start~end 的日檔與 coverage 列）
        if: inputs.mode == 'purge'
        run: |
          python backfill.py --purge \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: 覆蓋率盤點（只讀本地檔，不連外）
        if: inputs.mode == 'audit'
        run: python backfill.py --audit

      - name: 探路（只驗端點，不寫資料）
        if: inputs.mode == 'probe'
        run: python backfill.py --probe --date "${{ inputs.probe_date }}"

      - name: 興櫃逐檔逐月回補
        if: inputs.mode == 'esb'
        run: |
          python backfill.py --esb \
            --codes "${{ inputs.codes }}" \
            --start "${{ inputs.start }}" \
            --end   "${{ inputs.end }}"

      - name: 回補
        if: inputs.mode == 'run'
        run: |
          python backfill.py --run \
            --start "${{ inputs.start }}" \
            --end   "${{ inputs.end }}" \
            --markets "${{ inputs.markets }}" \
            --sleep "${{ inputs.sleep || '5' }}" \
            ${{ inputs.saturdays == 'yes' && '--saturdays' || '' }}

      # 探路失敗也要 commit：偵察檔本身就是這一趟的產出
      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "backfill(${{ inputs.mode }}): ${{ inputs.start }}~${{ inputs.end }}"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              # ★ rebase 卡在衝突時，工作區會留在 unmerged 狀態，
              #   下一輪的 git pull 會直接說 "Pulling is not possible"，三次全白重試。
              #   先 abort 回到乾淨狀態，重試才有意義（2026-09-04 實測整趟回補因此全丟）。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
