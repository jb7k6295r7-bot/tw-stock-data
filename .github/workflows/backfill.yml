name: 歷史回補（手動）

# 一次性的長工，**不排程**——只能在 Actions 頁面手動按，並填要回補的區間。
# 為什麼分開：每日流程要在兩分鐘內結束；回補一次要跑好幾小時，
# 兩者混在一起，回補塞車就等於當天沒有資料。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe 驗端點｜run 逐日回補｜inst 全市場三大法人｜esb 興櫃逐檔逐月｜audit 盤點｜purge 刪區間｜meta 重建 first/last_seen"
        type: choice
        options: [probe, run, inst, esb, audit, purge, meta]
        default: probe
      start:
        description: "起日（run 用，YYYY-MM-DD）"
        default: "2015-01-01"
      end:
        description: "迄日（run 用，YYYY-MM-DD）。建議一次一年"
        default: "2015-12-31"
      markets:
        description: "要回補的市場，逗號分隔（run 用；興櫃走 esb 模式，這裡不要填 emerging）"
        default: "twse,tpex"
      codes:
        description: "興櫃代號，逗號分隔（esb 用）"
        default: "7879,5267,6434"
      saturdays:
        description: "**只對 run 有效**（inst 已改照 data/universe/daily 的交易日曆走）。run 一定要填 yes，否則會漏掉補行交易的週六"
        default: "yes"
      sleep:
        description: "每個請求間隔秒數（run 用）。TWSE 會限流，2015 實測 1.5 秒有 94% 失敗 → 用 5"
        default: "5"
      probe_date:
        description: "probe 用的測試日，必須是交易日"
        default: "2026-08-28"

permissions:
  contents: write

concurrency:
  group: backfill          # 不要兩趟回補同時跑，會互相蓋掉 coverage
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # 上限 6 小時；一年約 245 天 × 3 市場 × 1.5 秒 ≈ 20 分鐘

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★ 不帶 --saturdays：inst 改照 data/universe/daily 的交易日曆走，
      #   補行交易的週六本來就在日曆裡，比「記得勾選」可靠。
      #   （run 不能這樣做——它產生的正是那份日曆。）
      - name: 全市場三大法人（上市 T86）
        if: inputs.mode == 'inst'
        run: |
          python backfill.py --inst \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep || '5' }}"

      - name: 重建 stocks.csv 的 first_seen／last_seen（只讀本地檔）
        if: inputs.mode == 'meta'
        run: python backfill.py --rebuild-meta

      - name: 清除區間（刪 start~end 的日檔與 coverage 列）
        if: inputs.mode == 'purge'
        run: |
          python backfill.py --purge \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: 覆蓋率盤點（只讀本地檔，不連外）
        if: inputs.mode == 'audit'
        run: python backfill.py --audit

      - name: 探路（只驗端點，不寫資料）
        if: inputs.mode == 'probe'
        run: python backfill.py --probe --date "${{ inputs.probe_date }}"

      - name: 興櫃逐檔逐月回補
        if: inputs.mode == 'esb'
        run: |
          python backfill.py --esb \
            --codes "${{ inputs.codes }}" \
            --start "${{ inputs.start }}" \
            --end   "${{ inputs.end }}"

      - name: 回補
        if: inputs.mode == 'run'
        run: |
          python backfill.py --run \
            --start "${{ inputs.start }}" \
            --end   "${{ inputs.end }}" \
            --markets "${{ inputs.markets }}" \
            --sleep "${{ inputs.sleep || '5' }}" \
            ${{ inputs.saturdays == 'yes' && '--saturdays' || '' }}

      # 探路失敗也要 commit：偵察檔本身就是這一趟的產出
      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用 -A，刪除也要進暫存區（全量重建可能刪檔）
          git add -A data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "backfill(${{ inputs.mode }}): ${{ inputs.start }}~${{ inputs.end }}"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            LASTRUN="data/meta/_last_run.md"
            REGEN=" data/meta/_db_status.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt data/meta/_breakpoint_scan.md data/meta/_holes_scan.csv "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  [ "$f" = "$LASTRUN" ] && continue
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是可自動處理的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，可自動處理：$CONF"
                MERGED=1
                for f in $CONF; do
                  if [ "$f" = "$LASTRUN" ]; then
                    # ⛔ _last_run.md **不可以整份取一邊**：runlog 只覆蓋自己那一個區塊，
                    #   所以這一份是跨 workflow 累積的。整份取一邊 ⇒ 另一支剛報的 ✗
                    #   會被安靜換回上一輪的 ✓——檔案在、格式對、只有狀態悄悄變綠。
                    #   逐區塊合併，每塊留「最後執行」較新的那一份。
                    git show :3:"$f" > /tmp/lr_ours.md \
                      && git show :2:"$f" > /tmp/lr_theirs.md \
                      && python3 merge_last_run.py /tmp/lr_ours.md /tmp/lr_theirs.md > "$f" \
                      && git add -- "$f" || MERGED=0
                  else
                    git checkout --theirs -- "$f" && git add -- "$f" || MERGED=0
                  fi
                done
                if [ "$MERGED" != "1" ]; then
                  echo "⛔ 自動處理失敗，不硬推" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
