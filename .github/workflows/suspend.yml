name: 停牌／處置／注意（探針）

# 為什麼先只有探針、沒有回補：
# 上市那三條 2026-09-07 已經驗過（sources/suspend_source.md），
# **上櫃一條都還沒看到欄位名**——tpex.org.tw/openapi/ 對外部抓取回 403。
# 在看到欄位名之前寫解析式就是照猜的寫死，這個專案被咬過一次。
# 這一趟只讀不寫資料，輸出 data/meta/_suspend_probe.txt，看完再決定怎麼寫回補。
on:
  workflow_dispatch:
    inputs:
      set:
        description: "halt = 上櫃停牌的 POST 參數（第五輪）｜params = 換參數名｜round1 = 端點在不在｜names = 抓官方頁名｜suspend2 = 舊站（已證實 DNS 不存在）"
        type: choice
        options: [halt, params, round1, names, suspend2]
        default: halt
      market:
        description: "只探哪個市場（留空 = 全部；params／names 本來就只有上櫃）"
        type: choice
        options: ["", twse, tpex]
        default: ""
      sleep:
        description: "每一發之間隔幾秒（交易所會限流）"
        default: "3"

permissions:
  contents: write

concurrency:
  group: suspend
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 自測擋在探針前面。探針的失效模式是「照抄變成照猜」與
      # 「參數被無視卻判成可用」，兩個都不會報錯，只有自測抓得到。
      - name: 自測（不連網）
        run: python selftest_suspend_probe.py

      - name: 探針
        run: |
          python suspend_probe.py \
            --set "${{ inputs.set || 'halt' }}" \
            --sleep "${{ inputs.sleep || '3' }}" \
            ${{ inputs.market && format('--only {0}', inputs.market) || '' }}

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta/_suspend_probe.txt
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "suspend probe: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            REGEN=" data/meta/_db_status.md data/meta/_last_run.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是每趟重生的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，全部是每趟重生的報告檔，取本趟的版本：$CONF"
                for f in $CONF; do git checkout --theirs -- "$f" && git add -- "$f"; done
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
