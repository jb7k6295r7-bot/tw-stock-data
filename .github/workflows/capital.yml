name: 股本／發行股數（每月）

# 為什麼獨立一支、而且不是每天跑：
# 股本只有增資／減資才會動，**每天抓 1,700 次是浪費**。每月一號跑一次就夠。
on:
  schedule:
    # UTC 01:00 = 台北 09:00，每月 1 號
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = 只跑自測不碰資料；probe = 只驗端點照抄欄位名；run = 自測通過後做市場層補；finmind = 逐檔補剩下的"
        type: choice
        options: [selftest, probe, run, finmind]
        default: run
      limit:
        description: "finmind 這一趟最多處理幾檔（0 = 全部）"
        default: "400"
      sleep:
        description: "finmind 每檔間隔秒數（FinMind 約 600 次/小時）"
        default: "6"

permissions:
  contents: write

concurrency:
  group: capital
  cancel-in-progress: false

jobs:
  capital:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★ 自測擋在 --run 前面，**不是可選項**。
      #   2026-09-07 修掉的 bug（上櫃有股數、股本全空）跑起來完全正常：
      #   沒有例外、沒有錯誤訊息、_capital_missing.txt 也不會列它。
      #   這種只有自測抓得到，所以讓它失敗就把整個 job 擋下來，不要 continue-on-error。
      - name: 自測（不連網）
        if: inputs.mode == 'selftest' || inputs.mode == 'run' || inputs.mode == ''
        run: python selftest_capital.py

      - name: 探路
        if: inputs.mode == 'probe'
        run: python capital.py --probe

      # 排程觸發時 inputs.mode 是空的 → 跑 run，再自動接 finmind 補剩下的
      - name: 市場層
        if: inputs.mode == 'run' || inputs.mode == ''
        run: python capital.py --run

      - name: FinMind 逐檔補
        if: inputs.mode == 'finmind' || inputs.mode == ''
        run: |
          python capital.py --finmind \
            --limit "${{ inputs.limit || '400' }}" \
            --sleep "${{ inputs.sleep || '6' }}"

      - name: 這一趟的摘要
        if: always()
        continue-on-error: true
        run: cat data/meta/_last_run.md || true

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "capital: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            REGEN=" data/meta/_db_status.md data/meta/_last_run.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt data/meta/_breakpoint_scan.md "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是每趟重生的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，全部是每趟重生的報告檔，取本趟的版本：$CONF"
                for f in $CONF; do git checkout --theirs -- "$f" && git add -- "$f"; done
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
