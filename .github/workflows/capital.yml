name: 股本／發行股數（每月）

# 為什麼獨立一支、而且不是每天跑：
# 股本只有增資／減資才會動，**每天抓 1,700 次是浪費**。每月一號跑一次就夠。
on:
  schedule:
    # UTC 01:00 = 台北 09:00，每月 1 號
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = 只跑自測不碰資料；probe = 只驗端點照抄欄位名；run = 自測通過後做市場層補；finmind = 逐檔補剩下的"
        type: choice
        options: [selftest, probe, run, finmind]
        default: run
      limit:
        description: "finmind 這一趟最多處理幾檔（0 = 全部）"
        default: "400"
      sleep:
        description: "finmind 每檔間隔秒數（FinMind 約 600 次/小時）"
        default: "6"

permissions:
  contents: write

concurrency:
  group: capital
  cancel-in-progress: false

jobs:
  capital:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⭐ 2026-09-10：Commit 那一步改成「只搬 data」之後，
      #   **程式就不會再經由它進 main**——而排程跑的是 main 上的程式
      #   ⇒ 不同步的話 main 會永遠停在舊版，而且完全看不出來。
      #   ⇒ 在這裡同步：此刻 checkout 還是新的，rebase 幾乎不可能撞
      #     （分支上多的是程式 commit，main 上多的是資料 commit，兩邊不重疊）。
      #   ⭐ 順帶好處：rebase 之後這一趟手上的 `data/` 也是 main 的最新版。
      #   ⛔ 失敗不擋後面：撞到就跳過，資料照抓，程式下一趟再同步。
      - name: 把程式同步到 main（趁 checkout 還新）
        continue-on-error: true
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          if [ "$BR" = "main" ]; then echo "本來就在 main，不必同步"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔⛔ 2026-09-10：這一步的第一版寫成 `git rebase origin/main`，
          #   而它**跟那個丟掉 5 小時的 bug 是同一個病**：rebase 會重放分支上
          #   所有還沒進 main 的 commit，包括**很舊的那幾個**，撞上 main 現在的內容。
          #   ⇒ 實測（run 34426373917）：它 abort 了、`continue-on-error` 讓它顯示成功，
          #     而 **main 上的程式一個字都沒更新**——而排程跑的正是 main 上的程式。
          #   ⚠ 失敗的樣子：這一步是**綠的**，只是什麼都沒做。
          #
          # ⇒ 改成跟「Commit 回 repo」**對稱**的做法：
          #   把**程式路徑**（`data/` 以外的一切）搬到 main 的頭上，不 rebase。
          #   ① 不重放任何 commit ⇒ 永遠不會衝突
          #   ② `data/` 完全不碰 ⇒ 別人剛寫的資料原封不動
          #   離線模擬（scratchpad/gitsim4）三項都驗過。
          SRC=$(git rev-parse HEAD)
          git fetch origin main || { echo "⚠ fetch main 失敗，跳過同步" >&2; exit 0; }
          git checkout -q -B _sync origin/main || { echo "⚠ 切不過去" >&2; exit 0; }
          git checkout "$SRC" -- . ':(exclude)data' || {
            echo "⚠ 取程式路徑失敗，跳過同步" >&2; exit 0; }
          git add -A
          if git diff --staged --quiet; then
            echo "程式已經跟 main 一致，沒有要同步的"
          else
            git commit -q -m "sync: 把分支的程式同步到 main"
            git push origin HEAD:main && echo "✓ 程式已同步到 main"
          fi
          # ⛔ 一定要切回原本的分支：後面的步驟（回補、Commit）都靠它。
          git checkout -q "$BR" 2>/dev/null || git checkout -q "$SRC"


      # ★ 自測擋在 --run 前面，**不是可選項**。
      #   2026-09-07 修掉的 bug（上櫃有股數、股本全空）跑起來完全正常：
      #   沒有例外、沒有錯誤訊息、_capital_missing.txt 也不會列它。
      #   這種只有自測抓得到，所以讓它失敗就把整個 job 擋下來，不要 continue-on-error。
      - name: 自測（不連網）
        if: inputs.mode == 'selftest' || inputs.mode == 'run' || inputs.mode == ''
        run: python selftest_capital.py

      - name: 探路
        if: inputs.mode == 'probe'
        run: python capital.py --probe

      # 排程觸發時 inputs.mode 是空的 → 跑 run，再自動接 finmind 補剩下的
      - name: 市場層
        if: inputs.mode == 'run' || inputs.mode == ''
        run: python capital.py --run

      - name: FinMind 逐檔補
        if: inputs.mode == 'finmind' || inputs.mode == ''
        run: |
          python capital.py --finmind \
            --limit "${{ inputs.limit || '400' }}" \
            --sleep "${{ inputs.sleep || '6' }}"

      # ★ 興櫃產業別。**一定要排在 capital.py 後面**——
      #   它讀的是 capital.py 剛存下來的原始快照
      #   （`data/universe/capital/tpex-mopsfin-R/<出表日期>.csv`），
      #   排前面的話它讀到的是上一趟的名冊。
      # ⛔ 不加 continue-on-error：它的 `rl.check` 裡有「上櫃代碼與 industry.csv
      #   完全一致」，那是**名稱表可不可以共用**的前提。前提破了還繼續，
      #   等於安靜地掛上錯的產業名。
      # ★ 面額時間軸。**一定要排在 capital.py 之後**（讀它剛存的原始快照），
      #   而且**在 industry_esb 之前或之後都可以**（兩者不相干）。
      - name: 面額時間軸
        if: inputs.mode == 'run' || inputs.mode == ''
        run: python par_timeline.py

      - name: 興櫃產業別
        if: inputs.mode == 'run' || inputs.mode == ''
        run: python industry_esb.py

      - name: 這一趟的摘要
        if: always()
        continue-on-error: true
        run: cat data/meta/_last_run.md || true

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "capital: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            # ⛔⛔ 2026-09-09 花了 **5 小時**的學費，2026-09-10 又用離線 git 模擬
            #   證明「先 rebase 到分支頭」那個補丁**擋不住**，才換成現在這個做法。
            #
            #   原本：`git pull --rebase origin main && git push origin HEAD:main`
            #   ⇒ 它會把**分支上還沒進 main 的 commit 全部重放**，包括**程式 commit**。
            #     那趟融資融券回補跑完了、資料 commit 也做好了，最後撞在
            #     `.github/workflows/daily.yml`——衝突的是程式，跟抓到的資料無關，
            #     但整趟 2,846 天的資料就這樣丟掉。
            #   ⚠ 失敗的樣子最毒：回補那一步是**綠的**，只有最後一步紅。
            #
            # ⭐ 現在的做法：**只把「本趟真的改到的 data 路徑」搬到 main 的頭上。**
            #   ① 程式 commit 一個都不重放 ⇒ workflow／程式檔**永遠不會衝突**
            #   ② 別的 workflow 在這幾小時裡寫的資料**原封不動**（我們只碰自己改的檔）
            #   ③ 沒有 rebase ⇒ 沒有「衝突要挑哪一邊」的問題
            #   離線模擬三項都驗過（scratchpad/gitsim3）。
            #
            # ⚠ 唯一的例外是 `_last_run.md`：它是**跨 workflow 累積**的，
            #   `runlog` 只覆蓋自己那一區塊 ⇒ ⛔ **不可以整份取本趟的**，
            #   否則另一支剛報的 ✗ 會被安靜換回上一輪的 ✓。⇒ 逐區塊合併。
            DC=$(git rev-parse HEAD)
            BASE=$(git rev-parse HEAD~1)
            LASTRUN="data/meta/_last_run.md"
            CHANGED=$(git diff --name-only "$BASE" "$DC" -- data)
            DELETED=$(git diff --diff-filter=D --name-only "$BASE" "$DC" -- data)
            echo "本趟改到 $(printf '%s\n' "$CHANGED" | grep -cv '^$') 個 data 檔"
            ok=0
            for i in 1 2 3; do
              git fetch origin main || { sleep $((i * 5)); continue; }
              git checkout -q -B _push origin/main || break
              printf '%s\n' "$CHANGED" | grep -v '^$' | grep -vx "$LASTRUN" \
                | xargs -r git checkout "$DC" --
              printf '%s\n' "$DELETED" | grep -v '^$' \
                | xargs -r git rm -q -f --ignore-unmatch
              if printf '%s\n' "$CHANGED" | grep -qx "$LASTRUN"; then
                git show "$DC:$LASTRUN" > /tmp/lr_mine.md
                git show "origin/main:$LASTRUN" > /tmp/lr_main.md 2>/dev/null \
                  || : > /tmp/lr_main.md
                if python3 merge_last_run.py /tmp/lr_mine.md /tmp/lr_main.md > "$LASTRUN"; then
                  git add -- "$LASTRUN"
                else
                  echo "⛔ _last_run.md 逐區塊合併失敗，取本趟的（⚠ 另一支的區塊可能被回退）" >&2
                  git checkout "$DC" -- "$LASTRUN" && git add -- "$LASTRUN"
                fi
              fi
              git add -A data
              if git diff --staged --quiet; then
                echo "搬到 main 之後沒有差異（多半是別的 workflow 已經推過同樣的內容）"
                ok=1; break
              fi
              git commit -q -m "capital: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
              if git push origin HEAD:main; then ok=1; break; fi
              echo "push 失敗（第 $i 次），多半是這幾秒又有人推了 main，重來" >&2
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "連續三次 push 失敗" >&2
              exit 1
            fi
