name: 停牌／處置／注意（抓取）

# 來源與參數全部出自 2026-09-07 的五輪探針，紀錄在 sources/suspend_source.md。
# ⚠ 上櫃停牌（bulletin/sprc）**沒有歷史**，只有當日 —— 所以它只在 daily 模式抓，
#    回補模式一次都不會碰它。抓了也只會拿到今天，寫進去就變成「2015 年那天停牌」。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 近 30 天＋上櫃停牌當日快照｜backfill = 歷史回補"
        type: choice
        options: [daily, backfill]
        default: daily
      start:
        description: "回補起年（backfill 用，例如 2015）"
        default: "2015"
      end:
        description: "回補迄年（backfill 用）。建議一次一到兩年"
        default: "2016"
      sleep:
        description: "每個請求間隔秒數。交易所會限流，回補建議 3 以上"
        default: "3"

permissions:
  contents: write

concurrency:
  group: suspend-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 自測擋在抓取前面。這一支的失效模式全部是「跑起來完全正常」：
      # 日期格式寫錯時交易所回今天而不報錯、TPEx 用假資料列表示無資料、
      # 讀寫用不同的鍵造成重複列。三個都只有自測抓得到。
      - name: 自測（不連網）
        run: python selftest_suspend.py

      - name: 每日
        if: inputs.mode == 'daily' || inputs.mode == ''
        run: python suspend.py --daily --sleep "${{ inputs.sleep || '3' }}"

      - name: 回補
        if: inputs.mode == 'backfill'
        run: |
          python suspend.py --backfill \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep || '3' }}"

      # ★ 被擋下來的請求要讓人看見，不要只寫進檔案就算了
      - name: 有沒有被擋下來的請求
        if: always()
        run: |
          if [ -s data/meta/_suspend_skipped.txt ]; then
            n=$(grep -vc '^#' data/meta/_suspend_skipped.txt || true)
            echo "被防護擋下來 $n 發："
            grep -v '^#' data/meta/_suspend_skipped.txt | head -40
          fi

      # ★ 摘要印在 log 裡，不要只寫進檔案。2026-09-07 四次「跑完了」其實都有問題，
      #   全部是人工去 repo 比對才發現的。
      - name: 這一趟的摘要
        if: always()
        continue-on-error: true
        run: cat data/meta/_last_run.md || true

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "suspend: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            LASTRUN="data/meta/_last_run.md"
            REGEN=" data/meta/_db_status.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt data/meta/_breakpoint_scan.md data/meta/_holes_scan.csv "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  [ "$f" = "$LASTRUN" ] && continue
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是可自動處理的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，可自動處理：$CONF"
                MERGED=1
                for f in $CONF; do
                  if [ "$f" = "$LASTRUN" ]; then
                    # ⛔ _last_run.md **不可以整份取一邊**：runlog 只覆蓋自己那一個區塊，
                    #   所以這一份是跨 workflow 累積的。整份取一邊 ⇒ 另一支剛報的 ✗
                    #   會被安靜換回上一輪的 ✓——檔案在、格式對、只有狀態悄悄變綠。
                    #   逐區塊合併，每塊留「最後執行」較新的那一份。
                    git show :3:"$f" > /tmp/lr_ours.md \
                      && git show :2:"$f" > /tmp/lr_theirs.md \
                      && python3 merge_last_run.py /tmp/lr_ours.md /tmp/lr_theirs.md > "$f" \
                      && git add -- "$f" || MERGED=0
                  else
                    git checkout --theirs -- "$f" && git add -- "$f" || MERGED=0
                  fi
                done
                if [ "$MERGED" != "1" ]; then
                  echo "⛔ 自動處理失敗，不硬推" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
