name: 內部人事前申報（每月）

# 裁定 seq412 §六（2026-10-21）：「准接排程：每月 5 日補前一月」。
# 來源 mopsov ajax_t56sb21（月彙總，上市／上櫃／興櫃），程式在 curated/insider_predeclare/build.py。
# ⭐ 年檔是整檔覆寫 ⇒ `--recent` 一律從「上個月所在那一年」的 1 月抓到上個月（一年最多 6 發），
#   ⛔ 不可只抓上個月（會把同年其他月份洗掉）。build.py 另有「年檔只准變多」閘門。
# ⚠ GitHub 排程常晚到或漏跑 ⇒ 5 日、6 日各一班；第二班重跑同一份，內容相同就不會 commit。
on:
  schedule:
    # UTC 02:17 = 台北 10:17（5 日）；UTC 06:41 = 台北 14:41（6 日，備援）
    - cron: "17 2 5 * *"
    - cron: "41 6 6 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-monthly
  cancel-in-progress: false

jobs:
  insider:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 驗 workflow 自己（每一段 shell 的語法，零相依）
        run: python selftest_workflows.py

      - name: 掃有沒有第二份實作（零相依）
        run: python selftest_no_dup.py

      - name: 掃有沒有程式會刪掉被追蹤的 data/ 檔（零相依）
        run: python selftest_no_data_delete.py

      - name: 把程式同步到 main（趁 checkout 還新）
        run: bash sync_code.sh

      # ⛔ 不加 continue-on-error：抓少、總計不符、被擋都要紅（build.py 結束碼非 0），
      #   而年檔閘門保證抓少時不覆寫 ⇒ 紅了也不會把好資料洗掉。
      - name: 抓今年 1 月到上個月
        run: |
          mkdir -p data/meta/insider_predeclare
          python curated/insider_predeclare/build.py --recent --sleep 4 --outdir data/meta/insider_predeclare

      - name: Commit 回 repo
        if: always()
        run: |
          bash push_data.sh "insider_predeclare: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
