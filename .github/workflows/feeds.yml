name: 全市場 feed 回補（手動）

# 價格與三大法人走 backfill.yml，**這支只跑新增的 feed**：
# 本益比／殖利率／股價淨值比、除權息計算結果、融資融券、上櫃三大法人。
#
# ★ 先跑 probe。TPEx 那幾條在開發環境一律 403，只有在 Actions 上才驗得到，
#   probe 沒過就跑 run，只會累積一堆失敗紀錄。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diag 診斷｜probe 只驗端點｜run 回補（含 feed=reduce 減資）｜adjust 算還原因子｜purge 刪日檔｜industry-probe / industry 產業別｜mops-probe 重測完整性｜mops 抓月營收與財報｜otc-adj-probe 上櫃來源＋交叉驗證｜otc-adj 用 FinMind 回補上櫃事件｜otc-adj-codes 只補指定的幾檔（填 codes）｜otc-adj-official ⭐ 換供料第 2 步：官方三支為主（⛔ 不連外）｜mops-history-probe 找基本面歷史來源｜mops-history-dry 只印解析結果不寫檔｜mops-history 真的回補｜calendar-audit 用獨立來源核對交易日曆｜content-audit 核對每一天的內容齊不齊（只讀本地檔）｜official-stats 抓官方年度／月統計當價格層的外部判準（續跑）｜otc-exright-history 上櫃除權息的**歷史**官方來源（一次拿十一年）｜otc-reduce-history 上櫃**減資**的歷史，並逐筆掃我方 data/adj 缺哪些"
        type: choice
        options: [diag, probe, run, adjust, purge, industry-probe, industry, mops-probe, mops, otc-adj-probe, otc-adj, otc-adj-codes, otc-adj-official, otc-exright-history, otc-reduce-history, mops-history-probe, mops-history-dry, mops-history, calendar-audit, content-audit, official-stats]
        default: probe
      feed:
        description: "要跑哪一種。probe 可選 all。★ reduce＝減資恢復買賣參考價（上市），區間型，逐月抓"
        type: choice
        options: [all, per, exright, reduce, margin, otcinst, otcper, otcmargin, otcexright, tib, sbl, otcsbl, fulldelivery, chtm, marginratio]
        default: all
      start:
        description: "起日（run 用）。照交易日曆走，整段 2015~2026 約 2,845 天／4.4 小時，一趟跑得完"
        default: "2026-01-01"
      end:
        description: "迄日（run 用）"
        default: "2026-09-03"
      sleep:
        description: "每個請求間隔秒數。**TWSE 會限流**——2015 實測 1.5 秒有 94% 失敗，不要調低於 5"
        default: "5"
      probe_date:
        description: "probe 用的測試日，必須是交易日"
        default: "2026-09-03"
      # ★ 2026-09-09 新增。融資融券補存 `m_prev/m_ret/s_prev/s_ret` 四欄之後，
      #   **舊日檔要整批重抓**才會有那四欄——而 `run` 預設會跳過已存在的日期。
      #   ⛔ 不用 `--force`（全部重抓）：2,846 天 × 5 秒 ≈ 4 小時，
      #     job 上限 350 分鐘，被砍在半路的話下一趟又從第一天重來
      #     ⇒ **永遠補不完，而且每趟看起來都很正常**。
      #   ⇒ 填欄名（例如 `m_prev`），只重抓「表頭缺這一欄」的日期。
      #     ⭐ 進度就是資料本身，不需要另一本台帳，也就不會有台帳與資料不一致。
      #   ⚠ 重抓是安全的：`write_day` 只在真的拿到列時才寫，
      #     那一天抓失敗**不會**把既有的好資料清掉。
      # ⭐ 2026-09-10：補**已知的單一缺口**用。`reduce_check` 抓到
      #   6461 益得 2026-09-09 我方漏抓（官方 16.65 → 26.92，換股比例 618.578）
      #   ⇒ 沒有那個因子，那一檔的還原序列在那一天是 **+54.7% 的假報酬**。
      #   ⛔ 而在這之前唯一的補法是重跑整個 FinMind 全掃（1,942 發、幾個小時）
      #   ⚠ 一個「要補一檔就得跑幾小時」的補法，實際上等於不會被補。
      codes:
        description: "只補這幾檔（otc-adj-codes 用，逗號分隔）"
        default: "6461"
      need_col:
        description: "只重抓「表頭缺這一欄」的既有日期（補欄位用，可續跑；平常留空）"
        default: ""
      # ★ 2026-09-09 加回。市場情報分析線 23:55 量到：上櫃三大法人的**投信欄**
      #   在最近三個交易日與官方對不上（09-07 918→908、09-08 895→881、09-09 899→894），
      #   而 09-04 以前六天全上櫃逐檔零誤差。⇒ 假說是「官方事後修訂投信欄，我方不回補」。
      #   ⛔ 那是**假說**，要用鑑別實驗分辨：把那三天重抓，
      #     ① 值變了 ⇒ 是修訂（我方該定期回補最近幾天）
      #     ② 值沒變 ⇒ 是我方 09-07 起壞掉（要去找 09-07 改了什麼）
      #   ⭐ 重抓的 diff 就是實驗結果——**repo 自己就是 before/after**。
      #   ⛔ 預設 false：整段區間開下去會重抓好幾小時。要配小的 start/end 用。
      force:
        description: "重抓已存在的日期（⛔ 要配小的區間；補欄位請改用 need_col）"
        type: boolean
        default: false

permissions:
  contents: write

# ⛔⛔ `cancel-in-progress: false` **不代表「後來的會排隊等」**（2026-09-10 實測）
#
#   GitHub 的規則是：同一個 group **只排得下一個 pending**。
#   ⇒ 再送一趟，**前一個還在等的那趟會被直接 cancelled**。
#
#   實際發生（feeds group，同一天）：
#     run 96  margin 全庫        11:13 開始跑 ────────────────► 一直在跑
#     run 97  otc-adj-codes 6461 11:47 pending … 13:47 **cancelled**（被 98 擠掉）
#     run 98  tib 全段回補       13:47 pending … 13:56 **cancelled**（被 99 擠掉）
#     run 99  otcsbl 20 天       13:56 pending
#   ⇒ 中間那兩趟**從來沒有跑過**，而**沒有任何地方會說**。
#
# ⚠ 而 dispatch API 四次都回 `queued`／`204` ⇒ 看起來四趟都送出去了。
#   ⭐ 這正是 CLAUDE.md 第四點二：**「排進去了」不等於「會跑」**
#     ——拿 API 的回覆當結果，就是驗到中間、沒驗到終點。
#
# ⇒ 派工規矩：**一趟跑完再送下一趟**。⛔ 不可以連續送。
#   ⚠ 送出去之後要**回頭確認它真的變成 in_progress**，
#     ⛔ 「dispatch 回 204」不算數。
#
# ⚠ 那為什麼不乾脆讓它們平行跑？因為兩趟同時 push 會互相蓋掉
#   （`_coverage_*.csv` 那一族）——⇒ **序列化是對的，要修的是派工方式。**
concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⭐ 2026-09-10：Commit 那一步改成「只搬 data」之後，
      #   **程式就不會再經由它進 main**——而排程跑的是 main 上的程式
      #   ⇒ 不同步的話 main 會永遠停在舊版，而且完全看不出來。
      #   ⇒ 在這裡同步：此刻 checkout 還是新的，rebase 幾乎不可能撞
      #     （分支上多的是程式 commit，main 上多的是資料 commit，兩邊不重疊）。
      #   ⭐ 順帶好處：rebase 之後這一趟手上的 `data/` 也是 main 的最新版。
      #   ⛔ 失敗不擋後面：撞到就跳過，資料照抓，程式下一趟再同步。
      # ⛔ 這一步**不設 `continue-on-error`**。
      #   2026-09-10 的第一版設了，於是它 abort 之後顯示成 **success**，
      #   而 main 上的程式一個字都沒更新——**綠燈，但什麼都沒做**。
      #   ⭐ 現在的做法不 rebase ⇒ 不可能衝突 ⇒ 走到 push 還失敗就是**真的有問題**，
      #     該紅。可以跳過的情形（本來就在 main、fetch 不到）自己 `exit 0`。
      # ⛔ 1 小時 50 分鐘換來的一步（run 34426373917）：
      #   「回補」那一步 success 跑了 1h50m，「Commit」1 秒失敗——
      #   `syntax error: unexpected end of file`，**我的 shell 少了一個 `fi`**。
      #   ⚠ 我當時「驗過」了，但我驗的是 `yaml.safe_load()`——
      #     **YAML 合法不代表裡面的 shell 合法**（對 YAML 來說 run: 只是字串）。
      #   ⇒ 那一步從寫出來就是壞的，任何一趟都會失敗，而我讓它帶著 1h50m 去撞。
      - name: 驗 workflow 自己（每一段 shell 的語法，零相依）
        run: python selftest_workflows.py

      # ⛔ 同一件事只准有一份實作。這一族 2026-09-10 掃出**十份**，
      #   其中 `_same_day` 那一份會讓每日抓取憑空造出一個交易日。
      #   ⚠ 本機 pre-commit 也有同一道——⛔ 兩個地方都要有：
      #     hook 可以被 `--no-verify` 跳過，而這裡跳不掉。
      - name: 掃有沒有第二份實作（零相依）
        run: python selftest_no_dup.py

      # ⛔ `push_data.sh` 的累積型 CSV 逐鍵合併。這一支擋的是**已經發生過**的
      #   資料遺失：分支上的 `data/` 比 main 舊，整檔搬過去會刪掉別人剛寫的列，
      #   ⚠ 而 `git diff` 看起來只是「這一趟重算過」。
      - name: 驗累積型 CSV 的逐鍵合併（零相依）
        run: python selftest_merge_ledger.py

      - name: 把程式同步到 main（趁 checkout 還新）
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          if [ "$BR" = "main" ]; then echo "本來就在 main，不必同步"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔⛔ 2026-09-10：這一步的第一版寫成 `git rebase origin/main`，
          #   而它**跟那個丟掉 5 小時的 bug 是同一個病**：rebase 會重放分支上
          #   所有還沒進 main 的 commit，包括**很舊的那幾個**，撞上 main 現在的內容。
          #   ⇒ 實測（run 34426373917）：它 abort 了、`continue-on-error` 讓它顯示成功，
          #     而 **main 上的程式一個字都沒更新**——而排程跑的正是 main 上的程式。
          #   ⚠ 失敗的樣子：這一步是**綠的**，只是什麼都沒做。
          #
          # ⇒ 改成跟「Commit 回 repo」**對稱**的做法：
          #   把**程式路徑**（`data/` 以外的一切）搬到 main 的頭上，不 rebase。
          #   ① 不重放任何 commit ⇒ 永遠不會衝突
          #   ② `data/` 完全不碰 ⇒ 別人剛寫的資料原封不動
          #   離線模擬（scratchpad/gitsim4）三項都驗過。
          SRC=$(git rev-parse HEAD)
          git fetch origin main || { echo "⚠ fetch main 失敗，跳過同步" >&2; exit 0; }
          git checkout -q -B _sync origin/main || { echo "⚠ 切不過去" >&2; exit 0; }
          git checkout "$SRC" -- . ':(exclude)data' || {
            echo "⚠ 取程式路徑失敗，跳過同步" >&2; exit 0; }
          git add -A
          if git diff --staged --quiet; then
            echo "程式已經跟 main 一致，沒有要同步的"
          else
            git commit -q -m "sync: 把分支的程式同步到 main"
            git push origin HEAD:main && echo "✓ 程式已同步到 main"
          fi
          # ⛔ 一定要切回原本的分支：後面的步驟（回補、Commit）都靠它。
          git checkout -q "$BR" 2>/dev/null || git checkout -q "$SRC"


      # ★ 2026-09-04：--inst 回補 2015 第一個請求就 307（無 Location、body 是 meta-refresh）。
      #   同一條 URL 在別的網路環境回得到正常 JSON，所以被擋的是 runner 的請求。
      #   六種標頭／cookie 組合一次測完，不要用猜的改一個跑一趟。
      - name: 診斷 TWSE 被擋原因（只讀，不寫資料）
        if: inputs.mode == 'diag'
        run: python netdiag.py

      - name: 探路（只驗端點，不寫資料）
        if: inputs.mode == 'probe'
        run: python feeds.py --probe --feed "${{ inputs.feed }}" --date "${{ inputs.probe_date }}"

      # ★ 內容寫錯時用。2026-09-04 的 exright 事故：每個日檔都被寫進
      #   2026-09-07 的四列，長得跟正常檔一模一樣，**覆蓋救不回來**
      #   （改成逐月模式後檔名集合不同，覆蓋不到的舊檔會留在原地）。
      - name: 刪掉該 feed 的全部日檔
        if: inputs.mode == 'purge'
        run: python feeds.py --purge --feed "${{ inputs.feed }}"

      - name: 回補
        if: inputs.mode == 'run'
        run: |
          if [ "${{ inputs.feed }}" = "all" ]; then
            echo "run 模式不接受 feed=all，請指定單一 feed" >&2; exit 1
          fi
          # ★ 不需要 --saturdays：改照 data/universe/daily 的交易日曆走，
          #   補行交易的週六本來就在日曆裡，比「記得勾選」可靠。
          COMMON="--feed ${{ inputs.feed }} --sleep ${{ inputs.sleep || '5' }} ${{ inputs.need_col && format('--need-col {0}', inputs.need_col) || '' }} ${{ inputs.force && '--force' || '' }}"

          # ⭐ 長工前先實測一天，**而且連 push 那條路一起測**。
          #   ⛔ 2026-09-09：融資融券 2,846 天跑了 5 小時，「回補」那一步是綠的，
          #     掛在最後一步的 push ⇒ 整趟丟掉。只測「抓不抓得到」不夠。
          echo "══ 長工前實測：先做一天，並且真的推一次 ══"
          python feeds.py --run $COMMON --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" --limit 1
          bash push_data.sh "feeds(smoke): 長工前的一天實測 ${{ inputs.feed }}"
          echo "══ 實測通過 ⇒ 開始長工（逐年分批，每批推一次）══"

          # ⛔ 逐年分批：任何一種失敗最多賠一年，而且 --need-col 會自己接著跑。
          Y0=$(echo "${{ inputs.start }}" | cut -d- -f1)
          Y1=$(echo "${{ inputs.end }}"   | cut -d- -f1)
          for Y in $(seq "$Y0" "$Y1"); do
            A="$Y-01-01"; B="$Y-12-31"
            [ "$Y" = "$Y0" ] && A="${{ inputs.start }}"
            [ "$Y" = "$Y1" ] && B="${{ inputs.end }}"
            echo "── $Y 年（$A ~ $B）──"
            python feeds.py --run $COMMON --start "$A" --end "$B"
            bash push_data.sh "feeds(run/${{ inputs.feed }}): $A~$B"
          done

      # ★ 產業別對照表。選股規則的「排除金融保險與生技醫療」與
      #   「同一類股當日最多 2 檔」都靠它，而 meta/stocks.csv 沒有這欄。
      #   ⚠ 2026-08-29 曾判定 t187ap03_L 不可用（「查 7 個代號只回 1101」）——
      #   那是 **WebFetch 讀大 JSON 被截斷**，不是端點的問題。
      #   2026-09-05 複測：WebFetch 只回 50 筆、最後一筆 1432，確認是截斷。
      #   用 urllib 從這裡讀是完整的。**端點結論要標明是用什麼工具測的。**
      - name: 產業別對照表（只探測）
        if: inputs.mode == 'industry-probe'
        run: python industry.py --probe --date "${{ inputs.probe_date }}"

      - name: 產業別對照表
        if: inputs.mode == 'industry'
        run: python industry.py --run --date "${{ inputs.probe_date }}" --sleep "${{ inputs.sleep || '3' }}"

      # ★ 用 urllib 重測 MOPS 的全市場端點。2026-08-30 把它們判為
      #   「靜默截斷、不可用」，但 2026-09-05 證實 t187ap03_L 那次是
      #   **WebFetch 的限制**（50 筆 vs 實際 1,094 筆），不是端點的性質。
      #   月營收與財報很可能是同一種誤判——這一步就是來驗的。
      #   **只探測、不寫任何資料。**
      - name: 重測 MOPS 全市場端點的完整性
        if: inputs.mode == 'mops-probe'
        run: python mops_probe.py --sleep "${{ inputs.sleep || '2' }}"

      # ★ 全市場月營收與財報。2026-09-06 用 urllib 重測證實四條主力端點完整
      #   （上市月營收涵蓋 99.1%、財報 95.8%；上櫃 99.9%／99.1%），
      #   2026-08-30 判它「靜默截斷」是 WebFetch 的限制不是端點的性質。
      #   ⚠ 這些端點**沒有日期參數，只給最新一期**——歷史只能逐期累積。
      - name: 全市場月營收與財報
        if: inputs.mode == 'mops'
        run: python mops.py --run --sleep "${{ inputs.sleep || '2' }}"

      # ★★ 上櫃的除權息與減資：**TPEx 官方沒有歷史來源**（2026-09-06 Actions 實測）。
      #   `bulletin/revivt` 是純前瞻公告表，帶任何日期參數回的列都與不帶參數時
      #   **一模一樣**（＝參數被無視），`startDate/endDate` 直接回「參數錯誤」；
      #   舊站 `.php` 四條與 `bulletin/*` 另外六個名字全 404。
      #   ⚠ 舊的 `reduce_probe.py` 對每一條都印「★ 有歷史」——**那是判斷式壞掉**
      #     （民國七碼拿去跟 "2026" 做字串比較，永遠成立）。已由這支取代，舊檔可刪。
      #
      #   走得通的是 FinMind（含上櫃、有歷史，已驗到 8043 蜜望實 2014-10-06 減資、
      #   8299 群聯 17 筆除權息）。但**有資料不等於可信**——這支最重要的是第 C 節：
      #   拿**上市**那一半（我方有 TWSE 官方的 11,729＋302 筆）去驗 FinMind 對不對。
      #   **只探測、不寫資料。**
      #   ⚠⚠ **這一步刻意不吃 `inputs.sleep`。** 兩個理由：
      #   ① 打的是 **FinMind**，跟 TWSE 的限流機制無關，5 秒是浪費。
      #   ② GitHub Actions 的 `||` **只有左邊是空字串才取右邊**，而 `sleep` 這個
      #      input 有預設值 "5"、永遠不是空的——所以
      #      `${{ inputs.sleep || '0.4' }}` **等於 `inputs.sleep`，0.4 從來不會生效**。
      #      2026-09-06 實測：480 發 × 5 秒 = **40 分鐘**，跑到一半才發現。
      #      ※ 同樣的寫法在 industry('3')／mops('2')／舊 reduce-probe('1') 都有，
      #        那些 fallback 也都沒生效過，一律吃到 5。要改的話是另一趟。
      - name: 上櫃除權息與減資的來源
        if: inputs.mode == 'otc-adj-probe'
        run: python otc_adj_probe.py --sleep 0.4 --limit 60

      # ★★ 用 FinMind 回補**上櫃**的除權息與減資。TPEx 官方沒有歷史（實測），
      #   FinMind 已用上市那一半交叉驗證過：除權息 555/555、減資 24/24、
      #   不符 0.00%、「只有我方有」= 0。上櫃佔母體近一半，補完才有還原可言。
      #   ⚠ 逐檔抓 971 × 2 ≈ 30 分鐘。免費額度可能中途被擋——
      #   **被擋會把已拿到的寫出去並存進度**，加 --resume 續跑即可。
      #   有 FinMind token 的話設成 repo secret `FINMIND_TOKEN` 可提高額度。
      - name: 上櫃除權息與減資（FinMind 回補）
        if: inputs.mode == 'otc-adj'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        timeout-minutes: 330
        run: |
          # ★ **一定要 `--resume`，不可以是 `--fresh`。**
          #   FinMind 免費層是「每小時」上限，而這支要打 1,942 發，
          #   本來就跨得過好幾個小時。`--fresh` 會讓每一趟都從頭開始——
          #   額度用完時它永遠跑不完，而且看起來每次都「有在跑」。
          #   （`--fresh` 只在進度檔本身是錯的時候用，2026-09-06 用過一次。）
          # ★ 撞到額度會**等 15 分鐘再續**，最多等 6 次；跑滿 300 分鐘自己收工存進度。
          #   Actions 的 job timeout 砍下去的話這一趟抓到的全部消失、進度也沒存。
          # ★ 寫入是合併的（鍵＝日期＋代號），所以**直接再跑一次同一個 mode 就好**。
          python selftest_otc_adj.py
          python otc_adj.py --start 2015-01-01 --sleep 0.4 --resume \
            --limit-wait 900 --max-waits 6 --budget-min 300

      # ⭐ 只補指定的幾檔。⛔ 這一步**不帶 `--resume`**：
      #   進度檔可能已經把那一檔記成「做過了」，而我們正是因為它做得不對才要重補
      #   ——帶 `--resume` 會讓這一步安靜地什麼都不做，⚠ 而且看起來完全成功。
      - name: 上櫃除權息與減資（只補指定的幾檔）
        if: inputs.mode == 'otc-adj-codes'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        timeout-minutes: 60
        run: |
          python selftest_otc_adj.py
          python otc_adj.py --start 2015-01-01 --sleep 0.4 \
            --codes "${{ inputs.codes }}"
          # ⭐ 補完要**立刻**重算還原因子並重跑那道檢查，
          #   ⛔ 否則 `data/universe/otcreduce/` 有了、`data/adj/` 還是舊的，
          #     而 `reduce_check` 照樣紅——那會讓人以為這一趟沒用。
          python adjust.py || true
          python reduce_check.py || true

      # ⭐⭐ 換供料第 2 步（市場情報分析線 2026-09-10 23:00 裁定）。
      #   依據是雙向比對：`B=0`、`D` 只有 15 筆而且全是面額變更
      #   ⇒ 換源在「數字對不對」這一面沒有風險。
      # ⛔ 這一步**不連外**：官方那兩份判準檔是
      #   `otc_reduce_history.py`／`otc_exright_history.py` 抓的
      #   ⇒ ⛔ 這裡不重抓，避免同一份官方資料有**兩條解析路徑**（第四點五）。
      # ⚠ 順序是有意義的，⛔ 不可以調換：
      #   ① 先抓官方判準檔（它們才是這一步的輸入）
      #   ② **快照**——裁定裡指名要的，⛔ 一定要在寫入之前
      #   ③ 官方寫入 `otcexright/`／`otcreduce/`
      #   ④ `adjust.py` 重算 `data/adj/`（⛔ 不跑它，前面三步等於沒發生）
      #   ⑤ 再跑一次雙向比對 ⇒ ⭐ **換完之後 C 類應該掉下來**
      - name: 上櫃還原因子換成官方來源（第 2 步）
        if: inputs.mode == 'otc-adj-official'
        timeout-minutes: 60
        run: |
          python selftest_otc_adj_official.py
          python selftest_otc_adj_compare.py
          # ① 官方判準檔（這兩支各一發請求）
          python selftest_otc_reduce_history.py
          python otc_reduce_history.py
          python selftest_otc_exright_history.py
          python otc_exright_history.py
          # ② ⚠ 快照一定要在寫入**之前**
          python otc_adj.py --snapshot data/meta/_adj_snapshot_pre_official.csv
          # ③ 官方寫入（⛔ 不連外）
          python otc_adj.py --official
          # ④ 重算還原因子
          python adjust.py
          # ⑤ ⭐ 換完再比一次：C 類要掉下來，⛔ 而 D 類不可以變大
          python otc_adj_compare.py
          python reduce_check.py || true

      # ★ 月營收與財報的**歷史**要從哪裡來。現況是 `data/mops/` 每一項都只有一期
      #   （OpenAPI 沒有年度／季別參數，只給最新一期），所以 2015 以來補不回來。
      #   四批候選：OpenAPI 加參數／MOPS 靜態頁／MOPS 查詢表單(POST)／FinMind。
      #   ⚠ FinMind 已確認有歷史，要量的是「幾發、多久、會不會被擋」。
      #   **只探測、不寫資料。**
      # ★★ 官方年度／月統計，當**價格層的外部判準**（回測線 2026-09-09 20:14 要的）。
      #   FMNPTK 逐檔逐年的「收盤平均價」＝ 日收盤價的**簡單平均**
      #   （⛔ 不是成交金額÷股數：2330 的 114 年前者 1,163.06、後者 1,144.0）
      #   ⇒ **一列驗一整年**：收盤價對不對、有沒有缺日、有沒有多出非交易日。
      #   FMSRFK 逐檔逐月的成交金額／股數 ⇒ 驗 `amount`／`volume`。
      #   ⚠ 逐檔一個請求、2,000+ 檔 ⇒ 一趟跑不完，用 `--limit` 分批 ＋ 進度檔續跑。
      #   ⛔ 排這裡不排 daily：它是判準不是每日資料，而且它會打 4,000+ 發。
      # ⭐⭐ 上櫃除權息的**歷史**官方來源。這一支推翻了我自己寫過三次的
      #   「上櫃除權息的歷史官方來源：仍然沒有」——市場情報分析線 2026-09-10 09:41
      #   在櫃買公告區找到 `bulletin/exDailyQ`，**一次請求回完十一年半、10,232 筆**。
      #   ⛔ 必須 POST、日期必須帶斜線——兩者任一沒做到都會**靜靜回「今天～明天」**。
      #   ⛔ 這一支只寫判準檔，不碰 `data/universe/otcexright/`（單一寫入者）。
      - name: 上櫃除權息歷史（官方公告區，只寫判準檔）
        if: inputs.mode == 'otc-exright-history'
        run: |
          python selftest_twparse.py
          python selftest_otc_exright_history.py
          python otc_exright_history.py --start "2008/01/01"

      # ⭐⭐ 上櫃**減資**的官方歷史。這一支是**必要的**不是錦上添花：
      #   `exDailyQ`（除權息表）**不含減資**——59 檔的抽驗裡就少了 17 筆。
      #   拿除權息表當上櫃 adj 的完整來源會**刪掉減資因子**，那幾檔還原價整段錯。
      #   ⭐ 它同時做情報分析線 10:00 指名要我做的那一掃：
      #     他驗過「我方已有的那些對得上」（12/12），**沒驗「我方缺哪些」**。
      - name: 上櫃減資歷史（官方公告區）＋逐筆掃我方 data/adj 缺哪些
        if: inputs.mode == 'otc-reduce-history'
        run: |
          python selftest_twparse.py
          python selftest_otc_reduce_history.py
          python otc_reduce_history.py --start "2013/01/01"

      - name: 官方年度／月統計（外部判準，續跑）
        if: inputs.mode == 'official-stats'
        run: python official_stats.py --limit 400 --sleep 1

      - name: 找基本面歷史的來源
        if: inputs.mode == 'mops-history-probe'
        run: python mops_history_probe.py --sleep 2   # 同上：打 MOPS，不吃 inputs.sleep

      # ★ 月營收與財報的歷史回補。**一定要先跑 mops-history-dry**：
      #   parser 是在看不到 HTML 的情況下照 MOPS 慣例寫的（那些頁面 robots 擋 WebFetch），
      #   欄位對不對只有跑過才知道。**470 發的回補不該建立在猜出來的 parser 上。**
      # ★ `probe_date` 這個欄位在這裡當「要看哪一期」用（例如 2018Q1 或 2018-03），
      #   留空就跑預設的 104/7 與 104Q1。撞名這種問題要看**整張表的欄位**才知道，
      #   猜三次已經夠了。
      - name: 基本面歷史（乾跑，只印解析結果）
        if: inputs.mode == 'mops-history-dry'
        run: |
          python mops_history.py --sleep 3 \
            --period "${{ inputs.probe_date }}" --market sii

      - name: 基本面歷史（回補）
        if: inputs.mode == 'mops-history'
        run: |
          # ★★ `--start` **寫死 2015-01，不吃 inputs.start**。
          #   2026-09-06 實測：接 inputs.start 的結果是它拿到那個欄位的預設值
          #   `2026-01-01`，於是「歷史回補」只補了 2026 年——月營收 15 期、
          #   財報 30 檔，看起來還跑得好好的。**歷史回補的整個重點是 2015，
          #   這種事不該靠「記得改欄位」。** 要補特定區間就改這一行。
          # kind=both：月營收 282 發 ＋ 財報 188 發，sleep 3 ≈ 25 分鐘。
          # 重跑是冪等的（同名檔覆蓋），失敗的期別直接整段重跑即可。
          # ★ `--fill`：只補**還沒有產出**的期別。修完失敗清單後用它，
          #   470 發整批重跑要 25 分鐘，補幾個洞只要幾十秒。
          #   要整批重來就把 --fill 拿掉。
          python mops_history.py --run --kind both --start 2015-01 --sleep 3 --fill

      # ★★ 拿**獨立來源**核對交易日曆。目前的日曆＝`data/universe/daily/` 的檔名，
      #   那是用自己的產出當自己的判準：某天整批漏抓的話，七個 feed 會
      #   **一致地缺同一天**，覆蓋率算出來反而是 100%。
      #   獨立來源是 TWSE `FMTQIK`（大盤成交資訊），與建 daily 的個股端點不同條路。
      #   ⚠ 它會回音 `date`、沒有 strDate/endDate，**只能看標題核對**。
      #   加 --write 才會寫出 data/meta/calendar_twse.csv；有月份沒問到就不寫。
      - name: 核對交易日曆
        if: inputs.mode == 'calendar-audit'
        run: python calendar_audit.py --start 2015-01 --sleep 5 --write --replace

      # ★★ 每一天的**內容**齊不齊。`calendar-audit` 只證明「那一天有檔案」，
      #   沒有證明「那一天該有的股票都在檔案裡」。上櫃端點掛掉的那天，
      #   日檔照樣產生、照樣進 git、檔名集合照樣完整——只是裡面少了 983 檔，
      #   而半年後回測會把它讀成「上櫃股全部沒交易」。
      #   ⚠ 判準**不可以**用 `_coverage_*.csv`：那是抓取程式自己記的「我抓到幾列」，
      #     漏抓時它就記漏抓後的數字，永遠是對的。證據取自**時間軸上的鄰居**。
      #   ★ 這一步會先跑 selftest：稽核程式算錯時不會報錯，只會給一份很合理的報告，
      #     所以 2,845 天跑下去之前，先在**知道正確答案**的假資料上跑一次。
      #   只讀本地檔、不連外，幾分鐘就跑完。
      - name: 核對每一天的內容
        if: inputs.mode == 'content-audit'
        run: |
          python selftest_content.py
          python content_audit.py --write

      # ★ 只讀本地檔、不連外。要先跑過 feed=exright **與 feed=reduce** 才有事件可算。
      #   只跑 exright 的話 data/adj/ 會少掉全部減資，而那**看起來完全正常**——
      #   摘要不會抱怨，只是每一檔跨過減資日的還原都是錯的。
      - name: 算還原因子
        if: inputs.mode == 'adjust'
        run: |
          python selftest_adjust_official.py
          python adjust.py

      # probe 不寫資料，所以 commit 步驟只對 run 與 adjust 有意義。
      # ⛔⛔ 2026-09-09：這裡本來是一份**寫死的「會寫資料的 mode」白名單**。
      #   我加了新 mode `official-stats`、卻沒加進這份清單
      #   ⇒ 腳本跑了 **22 分鐘、抓了 400 檔**，然後 commit 那一步 `skipped`，
      #     **資料全部丟掉，而整趟是綠的**（run 34364668441）。
      #   ⚠ `probe.yml` 檔頭記過一模一樣的坑（守門清單加了、`git add` 忘了加），
      #     我今天還讀過那段——**兩份清單分開維護就會這樣**。
      #
      # ⇒ 結構性修法：**把條件反過來**。
      #   列的不再是「會寫的」，而是**「唯讀的」**（探針、診斷、乾跑）。
      #   ⭐ 這樣新增一個會寫資料的 mode 時，**預設就會被 commit**；
      #     忘了改這裡的代價從「資料靜默消失」變成「commit 了一個沒有變動的空 diff」
      #     ——後者會印「沒有變動，不 commit」，**無害**。
      #   ⛔ 失敗的方向要選會吵的那一邊，不是安靜的那一邊。
      - name: Commit 回 repo
        if: >-
          always() && !contains(fromJSON('["diag","probe","industry-probe","mops-probe","otc-adj-probe","mops-history-probe","mops-history-dry"]'), inputs.mode)
        run: |
          # ⛔ 這一段本來在**八支 workflow 各抄一份**。同一段邏輯抄兩份，
          #   今晚已經害過一次（`limit` 的 bug 在 fetch/backfill 各一份，
          #   修好的那份天天跑、沒修的那份只有回補才跑）。⇒ 只留一份。
          bash push_data.sh "feeds(${{ inputs.mode }}/${{ inputs.feed }}): ${{ inputs.start }}~${{ inputs.end }}"
