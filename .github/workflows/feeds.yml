name: 全市場 feed 回補（手動）

# 價格與三大法人走 backfill.yml，**這支只跑新增的 feed**：
# 本益比／殖利率／股價淨值比、除權息計算結果、融資融券、上櫃三大法人。
#
# ★ 先跑 probe。TPEx 那幾條在開發環境一律 403，只有在 Actions 上才驗得到，
#   probe 沒過就跑 run，只會累積一堆失敗紀錄。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diag 診斷｜probe 只驗端點｜run 回補（含 feed=reduce 減資）｜adjust 算還原因子｜purge 刪日檔｜industry-probe / industry 產業別｜mops-probe 重測完整性｜mops 抓月營收與財報｜reduce-probe 找上櫃減資來源"
        type: choice
        options: [diag, probe, run, adjust, purge, industry-probe, industry, mops-probe, mops, reduce-probe]
        default: probe
      feed:
        description: "要跑哪一種。probe 可選 all。★ reduce＝減資恢復買賣參考價（上市），區間型，逐月抓"
        type: choice
        options: [all, per, exright, reduce, margin, otcinst, otcper, otcmargin, otcexright]
        default: all
      start:
        description: "起日（run 用）。照交易日曆走，整段 2015~2026 約 2,845 天／4.4 小時，一趟跑得完"
        default: "2026-01-01"
      end:
        description: "迄日（run 用）"
        default: "2026-09-03"
      sleep:
        description: "每個請求間隔秒數。**TWSE 會限流**——2015 實測 1.5 秒有 94% 失敗，不要調低於 5"
        default: "5"
      probe_date:
        description: "probe 用的測試日，必須是交易日"
        default: "2026-09-03"

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★ 2026-09-04：--inst 回補 2015 第一個請求就 307（無 Location、body 是 meta-refresh）。
      #   同一條 URL 在別的網路環境回得到正常 JSON，所以被擋的是 runner 的請求。
      #   六種標頭／cookie 組合一次測完，不要用猜的改一個跑一趟。
      - name: 診斷 TWSE 被擋原因（只讀，不寫資料）
        if: inputs.mode == 'diag'
        run: python netdiag.py

      - name: 探路（只驗端點，不寫資料）
        if: inputs.mode == 'probe'
        run: python feeds.py --probe --feed "${{ inputs.feed }}" --date "${{ inputs.probe_date }}"

      # ★ 內容寫錯時用。2026-09-04 的 exright 事故：每個日檔都被寫進
      #   2026-09-07 的四列，長得跟正常檔一模一樣，**覆蓋救不回來**
      #   （改成逐月模式後檔名集合不同，覆蓋不到的舊檔會留在原地）。
      - name: 刪掉該 feed 的全部日檔
        if: inputs.mode == 'purge'
        run: python feeds.py --purge --feed "${{ inputs.feed }}"

      - name: 回補
        if: inputs.mode == 'run'
        run: |
          if [ "${{ inputs.feed }}" = "all" ]; then
            echo "run 模式不接受 feed=all，請指定單一 feed" >&2; exit 1
          fi
          # ★ 不需要 --saturdays：改照 data/universe/daily 的交易日曆走，
          #   補行交易的週六本來就在日曆裡，比「記得勾選」可靠。
          python feeds.py --run --feed "${{ inputs.feed }}" \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep || '5' }}"

      # ★ 產業別對照表。選股規則的「排除金融保險與生技醫療」與
      #   「同一類股當日最多 2 檔」都靠它，而 meta/stocks.csv 沒有這欄。
      #   ⚠ 2026-08-29 曾判定 t187ap03_L 不可用（「查 7 個代號只回 1101」）——
      #   那是 **WebFetch 讀大 JSON 被截斷**，不是端點的問題。
      #   2026-09-05 複測：WebFetch 只回 50 筆、最後一筆 1432，確認是截斷。
      #   用 urllib 從這裡讀是完整的。**端點結論要標明是用什麼工具測的。**
      - name: 產業別對照表（只探測）
        if: inputs.mode == 'industry-probe'
        run: python industry.py --probe --date "${{ inputs.probe_date }}"

      - name: 產業別對照表
        if: inputs.mode == 'industry'
        run: python industry.py --run --date "${{ inputs.probe_date }}" --sleep "${{ inputs.sleep || '3' }}"

      # ★ 用 urllib 重測 MOPS 的全市場端點。2026-08-30 把它們判為
      #   「靜默截斷、不可用」，但 2026-09-05 證實 t187ap03_L 那次是
      #   **WebFetch 的限制**（50 筆 vs 實際 1,094 筆），不是端點的性質。
      #   月營收與財報很可能是同一種誤判——這一步就是來驗的。
      #   **只探測、不寫任何資料。**
      - name: 重測 MOPS 全市場端點的完整性
        if: inputs.mode == 'mops-probe'
        run: python mops_probe.py --sleep "${{ inputs.sleep || '2' }}"

      # ★ 全市場月營收與財報。2026-09-06 用 urllib 重測證實四條主力端點完整
      #   （上市月營收涵蓋 99.1%、財報 95.8%；上櫃 99.9%／99.1%），
      #   2026-08-30 判它「靜默截斷」是 WebFetch 的限制不是端點的性質。
      #   ⚠ 這些端點**沒有日期參數，只給最新一期**——歷史只能逐期累積。
      - name: 全市場月營收與財報
        if: inputs.mode == 'mops'
        run: python mops.py --run --sleep "${{ inputs.sleep || '2' }}"

      # ★ 2026-09-06：**上市的減資來源已經找到並接上了**
      #   （TWSE `reducation/TWTAUU`，吃 startDate/endDate、2015 起有歷史），
      #   走 mode=run + feed=reduce 即可，不必再探測。
      #   這支現在只剩**上櫃**沒解決：TPEx `bulletin/revivt` 形狀對但只回未來十天，
      #   要驗的是「它吃不吃日期參數」。⚠ TPEx 在開發環境與 WebFetch 一律 403，
      #   **只有 Actions 上跑出來的結論才算數。只探測、不寫資料。**
      - name: 找上櫃減資／除權息的歷史來源
        if: inputs.mode == 'reduce-probe'
        run: python reduce_probe.py --sleep "${{ inputs.sleep || '1' }}"

      # ★ 只讀本地檔、不連外。要先跑過 feed=exright **與 feed=reduce** 才有事件可算。
      #   只跑 exright 的話 data/adj/ 會少掉全部減資，而那**看起來完全正常**——
      #   摘要不會抱怨，只是每一檔跨過減資日的還原都是錯的。
      - name: 算還原因子
        if: inputs.mode == 'adjust'
        run: python adjust.py

      # probe 不寫資料，所以 commit 步驟只對 run 與 adjust 有意義。
      - name: Commit 回 repo
        if: always() && (inputs.mode == 'run' || inputs.mode == 'adjust' || inputs.mode == 'purge' || inputs.mode == 'industry' || inputs.mode == 'mops')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 用 -A：`git add <路徑>` 在舊版 git 不會把「檔案被刪掉」記進暫存區。
          #   purge 模式產出的**就是刪除**，漏掉的話會 commit 不到任何東西、
          #   印出「沒有變動」，而那批錯的日檔原封不動留在 repo 裡——
          #   看起來成功、其實什麼都沒清掉。
          git add -A data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "feeds(${{ inputs.mode }}/${{ inputs.feed }}): ${{ inputs.start }}~${{ inputs.end }}"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
