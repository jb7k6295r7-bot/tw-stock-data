name: 全市場 feed 回補（手動）

# 價格與三大法人走 backfill.yml，**這支只跑新增的 feed**：
# 本益比／殖利率／股價淨值比、除權息計算結果、融資融券、上櫃三大法人。
#
# ★ 先跑 probe。TPEx 那幾條在開發環境一律 403，只有在 Actions 上才驗得到，
#   probe 沒過就跑 run，只會累積一堆失敗紀錄。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diag 診斷｜probe 只驗端點｜run 回補（含 feed=reduce 減資）｜adjust 算還原因子｜purge 刪日檔｜industry-probe / industry 產業別｜mops-probe 重測完整性｜mops 抓月營收與財報｜otc-adj-probe 上櫃來源＋交叉驗證｜otc-adj 用 FinMind 回補上櫃事件｜mops-history-probe 找基本面歷史來源｜mops-history-dry 只印解析結果不寫檔｜mops-history 真的回補｜calendar-audit 用獨立來源核對交易日曆｜content-audit 核對每一天的內容齊不齊（只讀本地檔）｜official-stats 抓官方年度／月統計當價格層的外部判準（續跑）"
        type: choice
        options: [diag, probe, run, adjust, purge, industry-probe, industry, mops-probe, mops, otc-adj-probe, otc-adj, mops-history-probe, mops-history-dry, mops-history, calendar-audit, content-audit, official-stats]
        default: probe
      feed:
        description: "要跑哪一種。probe 可選 all。★ reduce＝減資恢復買賣參考價（上市），區間型，逐月抓"
        type: choice
        options: [all, per, exright, reduce, margin, otcinst, otcper, otcmargin, otcexright]
        default: all
      start:
        description: "起日（run 用）。照交易日曆走，整段 2015~2026 約 2,845 天／4.4 小時，一趟跑得完"
        default: "2026-01-01"
      end:
        description: "迄日（run 用）"
        default: "2026-09-03"
      sleep:
        description: "每個請求間隔秒數。**TWSE 會限流**——2015 實測 1.5 秒有 94% 失敗，不要調低於 5"
        default: "5"
      probe_date:
        description: "probe 用的測試日，必須是交易日"
        default: "2026-09-03"
      # ★ 2026-09-09 新增。融資融券補存 `m_prev/m_ret/s_prev/s_ret` 四欄之後，
      #   **舊日檔要整批重抓**才會有那四欄——而 `run` 預設會跳過已存在的日期。
      #   ⛔ 不用 `--force`（全部重抓）：2,846 天 × 5 秒 ≈ 4 小時，
      #     job 上限 350 分鐘，被砍在半路的話下一趟又從第一天重來
      #     ⇒ **永遠補不完，而且每趟看起來都很正常**。
      #   ⇒ 填欄名（例如 `m_prev`），只重抓「表頭缺這一欄」的日期。
      #     ⭐ 進度就是資料本身，不需要另一本台帳，也就不會有台帳與資料不一致。
      #   ⚠ 重抓是安全的：`write_day` 只在真的拿到列時才寫，
      #     那一天抓失敗**不會**把既有的好資料清掉。
      need_col:
        description: "只重抓「表頭缺這一欄」的既有日期（補欄位用，可續跑；平常留空）"
        default: ""

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★ 2026-09-04：--inst 回補 2015 第一個請求就 307（無 Location、body 是 meta-refresh）。
      #   同一條 URL 在別的網路環境回得到正常 JSON，所以被擋的是 runner 的請求。
      #   六種標頭／cookie 組合一次測完，不要用猜的改一個跑一趟。
      - name: 診斷 TWSE 被擋原因（只讀，不寫資料）
        if: inputs.mode == 'diag'
        run: python netdiag.py

      - name: 探路（只驗端點，不寫資料）
        if: inputs.mode == 'probe'
        run: python feeds.py --probe --feed "${{ inputs.feed }}" --date "${{ inputs.probe_date }}"

      # ★ 內容寫錯時用。2026-09-04 的 exright 事故：每個日檔都被寫進
      #   2026-09-07 的四列，長得跟正常檔一模一樣，**覆蓋救不回來**
      #   （改成逐月模式後檔名集合不同，覆蓋不到的舊檔會留在原地）。
      - name: 刪掉該 feed 的全部日檔
        if: inputs.mode == 'purge'
        run: python feeds.py --purge --feed "${{ inputs.feed }}"

      - name: 回補
        if: inputs.mode == 'run'
        run: |
          if [ "${{ inputs.feed }}" = "all" ]; then
            echo "run 模式不接受 feed=all，請指定單一 feed" >&2; exit 1
          fi
          # ★ 不需要 --saturdays：改照 data/universe/daily 的交易日曆走，
          #   補行交易的週六本來就在日曆裡，比「記得勾選」可靠。
          python feeds.py --run --feed "${{ inputs.feed }}" \
            --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep || '5' }}" \
            ${{ inputs.need_col && format('--need-col {0}', inputs.need_col) || '' }}

      # ★ 產業別對照表。選股規則的「排除金融保險與生技醫療」與
      #   「同一類股當日最多 2 檔」都靠它，而 meta/stocks.csv 沒有這欄。
      #   ⚠ 2026-08-29 曾判定 t187ap03_L 不可用（「查 7 個代號只回 1101」）——
      #   那是 **WebFetch 讀大 JSON 被截斷**，不是端點的問題。
      #   2026-09-05 複測：WebFetch 只回 50 筆、最後一筆 1432，確認是截斷。
      #   用 urllib 從這裡讀是完整的。**端點結論要標明是用什麼工具測的。**
      - name: 產業別對照表（只探測）
        if: inputs.mode == 'industry-probe'
        run: python industry.py --probe --date "${{ inputs.probe_date }}"

      - name: 產業別對照表
        if: inputs.mode == 'industry'
        run: python industry.py --run --date "${{ inputs.probe_date }}" --sleep "${{ inputs.sleep || '3' }}"

      # ★ 用 urllib 重測 MOPS 的全市場端點。2026-08-30 把它們判為
      #   「靜默截斷、不可用」，但 2026-09-05 證實 t187ap03_L 那次是
      #   **WebFetch 的限制**（50 筆 vs 實際 1,094 筆），不是端點的性質。
      #   月營收與財報很可能是同一種誤判——這一步就是來驗的。
      #   **只探測、不寫任何資料。**
      - name: 重測 MOPS 全市場端點的完整性
        if: inputs.mode == 'mops-probe'
        run: python mops_probe.py --sleep "${{ inputs.sleep || '2' }}"

      # ★ 全市場月營收與財報。2026-09-06 用 urllib 重測證實四條主力端點完整
      #   （上市月營收涵蓋 99.1%、財報 95.8%；上櫃 99.9%／99.1%），
      #   2026-08-30 判它「靜默截斷」是 WebFetch 的限制不是端點的性質。
      #   ⚠ 這些端點**沒有日期參數，只給最新一期**——歷史只能逐期累積。
      - name: 全市場月營收與財報
        if: inputs.mode == 'mops'
        run: python mops.py --run --sleep "${{ inputs.sleep || '2' }}"

      # ★★ 上櫃的除權息與減資：**TPEx 官方沒有歷史來源**（2026-09-06 Actions 實測）。
      #   `bulletin/revivt` 是純前瞻公告表，帶任何日期參數回的列都與不帶參數時
      #   **一模一樣**（＝參數被無視），`startDate/endDate` 直接回「參數錯誤」；
      #   舊站 `.php` 四條與 `bulletin/*` 另外六個名字全 404。
      #   ⚠ 舊的 `reduce_probe.py` 對每一條都印「★ 有歷史」——**那是判斷式壞掉**
      #     （民國七碼拿去跟 "2026" 做字串比較，永遠成立）。已由這支取代，舊檔可刪。
      #
      #   走得通的是 FinMind（含上櫃、有歷史，已驗到 8043 蜜望實 2014-10-06 減資、
      #   8299 群聯 17 筆除權息）。但**有資料不等於可信**——這支最重要的是第 C 節：
      #   拿**上市**那一半（我方有 TWSE 官方的 11,729＋302 筆）去驗 FinMind 對不對。
      #   **只探測、不寫資料。**
      #   ⚠⚠ **這一步刻意不吃 `inputs.sleep`。** 兩個理由：
      #   ① 打的是 **FinMind**，跟 TWSE 的限流機制無關，5 秒是浪費。
      #   ② GitHub Actions 的 `||` **只有左邊是空字串才取右邊**，而 `sleep` 這個
      #      input 有預設值 "5"、永遠不是空的——所以
      #      `${{ inputs.sleep || '0.4' }}` **等於 `inputs.sleep`，0.4 從來不會生效**。
      #      2026-09-06 實測：480 發 × 5 秒 = **40 分鐘**，跑到一半才發現。
      #      ※ 同樣的寫法在 industry('3')／mops('2')／舊 reduce-probe('1') 都有，
      #        那些 fallback 也都沒生效過，一律吃到 5。要改的話是另一趟。
      - name: 上櫃除權息與減資的來源
        if: inputs.mode == 'otc-adj-probe'
        run: python otc_adj_probe.py --sleep 0.4 --limit 60

      # ★★ 用 FinMind 回補**上櫃**的除權息與減資。TPEx 官方沒有歷史（實測），
      #   FinMind 已用上市那一半交叉驗證過：除權息 555/555、減資 24/24、
      #   不符 0.00%、「只有我方有」= 0。上櫃佔母體近一半，補完才有還原可言。
      #   ⚠ 逐檔抓 971 × 2 ≈ 30 分鐘。免費額度可能中途被擋——
      #   **被擋會把已拿到的寫出去並存進度**，加 --resume 續跑即可。
      #   有 FinMind token 的話設成 repo secret `FINMIND_TOKEN` 可提高額度。
      - name: 上櫃除權息與減資（FinMind 回補）
        if: inputs.mode == 'otc-adj'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        timeout-minutes: 330
        run: |
          # ★ **一定要 `--resume`，不可以是 `--fresh`。**
          #   FinMind 免費層是「每小時」上限，而這支要打 1,942 發，
          #   本來就跨得過好幾個小時。`--fresh` 會讓每一趟都從頭開始——
          #   額度用完時它永遠跑不完，而且看起來每次都「有在跑」。
          #   （`--fresh` 只在進度檔本身是錯的時候用，2026-09-06 用過一次。）
          # ★ 撞到額度會**等 15 分鐘再續**，最多等 6 次；跑滿 300 分鐘自己收工存進度。
          #   Actions 的 job timeout 砍下去的話這一趟抓到的全部消失、進度也沒存。
          # ★ 寫入是合併的（鍵＝日期＋代號），所以**直接再跑一次同一個 mode 就好**。
          python otc_adj.py --start 2015-01-01 --sleep 0.4 --resume \
            --limit-wait 900 --max-waits 6 --budget-min 300

      # ★ 月營收與財報的**歷史**要從哪裡來。現況是 `data/mops/` 每一項都只有一期
      #   （OpenAPI 沒有年度／季別參數，只給最新一期），所以 2015 以來補不回來。
      #   四批候選：OpenAPI 加參數／MOPS 靜態頁／MOPS 查詢表單(POST)／FinMind。
      #   ⚠ FinMind 已確認有歷史，要量的是「幾發、多久、會不會被擋」。
      #   **只探測、不寫資料。**
      # ★★ 官方年度／月統計，當**價格層的外部判準**（回測線 2026-09-09 20:14 要的）。
      #   FMNPTK 逐檔逐年的「收盤平均價」＝ 日收盤價的**簡單平均**
      #   （⛔ 不是成交金額÷股數：2330 的 114 年前者 1,163.06、後者 1,144.0）
      #   ⇒ **一列驗一整年**：收盤價對不對、有沒有缺日、有沒有多出非交易日。
      #   FMSRFK 逐檔逐月的成交金額／股數 ⇒ 驗 `amount`／`volume`。
      #   ⚠ 逐檔一個請求、2,000+ 檔 ⇒ 一趟跑不完，用 `--limit` 分批 ＋ 進度檔續跑。
      #   ⛔ 排這裡不排 daily：它是判準不是每日資料，而且它會打 4,000+ 發。
      - name: 官方年度／月統計（外部判準，續跑）
        if: inputs.mode == 'official-stats'
        run: python official_stats.py --limit 400 --sleep 1

      - name: 找基本面歷史的來源
        if: inputs.mode == 'mops-history-probe'
        run: python mops_history_probe.py --sleep 2   # 同上：打 MOPS，不吃 inputs.sleep

      # ★ 月營收與財報的歷史回補。**一定要先跑 mops-history-dry**：
      #   parser 是在看不到 HTML 的情況下照 MOPS 慣例寫的（那些頁面 robots 擋 WebFetch），
      #   欄位對不對只有跑過才知道。**470 發的回補不該建立在猜出來的 parser 上。**
      # ★ `probe_date` 這個欄位在這裡當「要看哪一期」用（例如 2018Q1 或 2018-03），
      #   留空就跑預設的 104/7 與 104Q1。撞名這種問題要看**整張表的欄位**才知道，
      #   猜三次已經夠了。
      - name: 基本面歷史（乾跑，只印解析結果）
        if: inputs.mode == 'mops-history-dry'
        run: |
          python mops_history.py --sleep 3 \
            --period "${{ inputs.probe_date }}" --market sii

      - name: 基本面歷史（回補）
        if: inputs.mode == 'mops-history'
        run: |
          # ★★ `--start` **寫死 2015-01，不吃 inputs.start**。
          #   2026-09-06 實測：接 inputs.start 的結果是它拿到那個欄位的預設值
          #   `2026-01-01`，於是「歷史回補」只補了 2026 年——月營收 15 期、
          #   財報 30 檔，看起來還跑得好好的。**歷史回補的整個重點是 2015，
          #   這種事不該靠「記得改欄位」。** 要補特定區間就改這一行。
          # kind=both：月營收 282 發 ＋ 財報 188 發，sleep 3 ≈ 25 分鐘。
          # 重跑是冪等的（同名檔覆蓋），失敗的期別直接整段重跑即可。
          # ★ `--fill`：只補**還沒有產出**的期別。修完失敗清單後用它，
          #   470 發整批重跑要 25 分鐘，補幾個洞只要幾十秒。
          #   要整批重來就把 --fill 拿掉。
          python mops_history.py --run --kind both --start 2015-01 --sleep 3 --fill

      # ★★ 拿**獨立來源**核對交易日曆。目前的日曆＝`data/universe/daily/` 的檔名，
      #   那是用自己的產出當自己的判準：某天整批漏抓的話，七個 feed 會
      #   **一致地缺同一天**，覆蓋率算出來反而是 100%。
      #   獨立來源是 TWSE `FMTQIK`（大盤成交資訊），與建 daily 的個股端點不同條路。
      #   ⚠ 它會回音 `date`、沒有 strDate/endDate，**只能看標題核對**。
      #   加 --write 才會寫出 data/meta/calendar_twse.csv；有月份沒問到就不寫。
      - name: 核對交易日曆
        if: inputs.mode == 'calendar-audit'
        run: python calendar_audit.py --start 2015-01 --sleep 5 --write --replace

      # ★★ 每一天的**內容**齊不齊。`calendar-audit` 只證明「那一天有檔案」，
      #   沒有證明「那一天該有的股票都在檔案裡」。上櫃端點掛掉的那天，
      #   日檔照樣產生、照樣進 git、檔名集合照樣完整——只是裡面少了 983 檔，
      #   而半年後回測會把它讀成「上櫃股全部沒交易」。
      #   ⚠ 判準**不可以**用 `_coverage_*.csv`：那是抓取程式自己記的「我抓到幾列」，
      #     漏抓時它就記漏抓後的數字，永遠是對的。證據取自**時間軸上的鄰居**。
      #   ★ 這一步會先跑 selftest：稽核程式算錯時不會報錯，只會給一份很合理的報告，
      #     所以 2,845 天跑下去之前，先在**知道正確答案**的假資料上跑一次。
      #   只讀本地檔、不連外，幾分鐘就跑完。
      - name: 核對每一天的內容
        if: inputs.mode == 'content-audit'
        run: |
          python selftest_content.py
          python content_audit.py --write

      # ★ 只讀本地檔、不連外。要先跑過 feed=exright **與 feed=reduce** 才有事件可算。
      #   只跑 exright 的話 data/adj/ 會少掉全部減資，而那**看起來完全正常**——
      #   摘要不會抱怨，只是每一檔跨過減資日的還原都是錯的。
      - name: 算還原因子
        if: inputs.mode == 'adjust'
        run: python adjust.py

      # probe 不寫資料，所以 commit 步驟只對 run 與 adjust 有意義。
      # ⛔⛔ 2026-09-09：這裡本來是一份**寫死的「會寫資料的 mode」白名單**。
      #   我加了新 mode `official-stats`、卻沒加進這份清單
      #   ⇒ 腳本跑了 **22 分鐘、抓了 400 檔**，然後 commit 那一步 `skipped`，
      #     **資料全部丟掉，而整趟是綠的**（run 34364668441）。
      #   ⚠ `probe.yml` 檔頭記過一模一樣的坑（守門清單加了、`git add` 忘了加），
      #     我今天還讀過那段——**兩份清單分開維護就會這樣**。
      #
      # ⇒ 結構性修法：**把條件反過來**。
      #   列的不再是「會寫的」，而是**「唯讀的」**（探針、診斷、乾跑）。
      #   ⭐ 這樣新增一個會寫資料的 mode 時，**預設就會被 commit**；
      #     忘了改這裡的代價從「資料靜默消失」變成「commit 了一個沒有變動的空 diff」
      #     ——後者會印「沒有變動，不 commit」，**無害**。
      #   ⛔ 失敗的方向要選會吵的那一邊，不是安靜的那一邊。
      - name: Commit 回 repo
        if: >-
          always() && !contains(fromJSON('["diag","probe","industry-probe","mops-probe","otc-adj-probe","mops-history-probe","mops-history-dry"]'), inputs.mode)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 用 -A：`git add <路徑>` 在舊版 git 不會把「檔案被刪掉」記進暫存區。
          #   purge 模式產出的**就是刪除**，漏掉的話會 commit 不到任何東西、
          #   印出「沒有變動」，而那批錯的日檔原封不動留在 repo 裡——
          #   看起來成功、其實什麼都沒清掉。
          git add -A data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "feeds(${{ inputs.mode }}/${{ inputs.feed }}): ${{ inputs.start }}~${{ inputs.end }}"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            LASTRUN="data/meta/_last_run.md"
            REGEN=" data/meta/_db_status.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_holiday_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt data/meta/_breakpoint_scan.md data/meta/_holes_scan.csv data/meta/_data_audit.md "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  [ "$f" = "$LASTRUN" ] && continue
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是可自動處理的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，可自動處理：$CONF"
                MERGED=1
                for f in $CONF; do
                  if [ "$f" = "$LASTRUN" ]; then
                    # ⛔ _last_run.md **不可以整份取一邊**：runlog 只覆蓋自己那一個區塊，
                    #   所以這一份是跨 workflow 累積的。整份取一邊 ⇒ 另一支剛報的 ✗
                    #   會被安靜換回上一輪的 ✓——檔案在、格式對、只有狀態悄悄變綠。
                    #   逐區塊合併，每塊留「最後執行」較新的那一份。
                    git show :3:"$f" > /tmp/lr_ours.md \
                      && git show :2:"$f" > /tmp/lr_theirs.md \
                      && python3 merge_last_run.py /tmp/lr_ours.md /tmp/lr_theirs.md > "$f" \
                      && git add -- "$f" || MERGED=0
                  else
                    git checkout --theirs -- "$f" && git add -- "$f" || MERGED=0
                  fi
                done
                if [ "$MERGED" != "1" ]; then
                  echo "⛔ 自動處理失敗，不硬推" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
