name: 虛擬貨幣（前 15 大市值）日K 收集

# 使用者 2026-09-20 裁定的規格：前 15 大＝市值排名、排除穩定幣、
# 幣安沒有交易對的跳過往後遞補、日K、回補到 2017 年。見 crypto.py 檔頭。
#
# ⛔ 這個開發容器對外部金融站台一律 403（我方閘道擋的，不是對方擋，
#   跟 CLAUDE.md 第六點記的 TW 交易所同一個問題）⇒ 這支只能在 Actions 上跑。
#
# 四個模式：
#   universe          重新排前 15 大市值（⚠ 只能手動派，⛔ cron 只跑 daily ⇒ 名單不會自己更新）
#   backfill          回補歷史月檔（第一次跑、或有新幣種加入時用；冪等，續跑安全）
#   daily             補當月與最近幾天的缺口（每天排程用，量很小）
#   bitstamp-backfill 補 Binance 開始之前（2013~2017）的歷史，⛔ 一次性、
#                     不掛進每天排程（過去的資料不會變）——只接了 BTC，
#                     見 crypto.py 的 BITSTAMP_PAIRS。
#
# ⛔ `data/crypto/` 與 `data/meta/crypto_universe.csv`／
#   `_crypto_months_done.csv` 只有這支 workflow 會寫——跟 CLAUDE.md
#   四點六同一個道理：分支上的這些檔永遠比 main 舊，跑之前要先取
#   main 的版本，⛔ 不能讓分支那份過期的資料蓋掉 main 上更新的。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "universe 重排前15大｜backfill 回補歷史月檔｜daily 補當月缺口｜bitstamp-backfill 補2013~2017（一次性）｜funding 永續資金費率全期（C2 六幣）｜perp 永續日K全期（C5 複核）｜mark 永續標記價日K（C5 描述臂，BTC／ETH）"
        type: choice
        options: [universe, backfill, daily, bitstamp-backfill, funding, perp, mark]
        default: daily
      reset_months_done:
        description: "backfill 專用，⛔ 平常不要勾：續跑台帳被污染時才用（例如 URL bug 讓整批誤記成官方沒有）"
        type: boolean
        default: false
  schedule:
    # ⭐ 每天台北時間 08:10（UTC 00:10）補一次當月缺口——量很小
    #   （15 個幣種、近期缺口通常 0~1 天），⛔ 不需要跟 TW 那邊的
    #   daily.yml 搶時段，錯開純粹是避免同時佔用 concurrency group。
    # ⛔⛔ 2026-09-24 從 "10 0 * * *" 挪到 "0 3 * * *"（UTC 03:00 ＝ 台北 11:00）
    #   原本 UTC 00:10 ＝ 收盤後 10 分鐘就跑 ⇒ 跟 data.binance.vision 上傳昨天那個檔【賽跑】
    #   ⭐ 資料自己的 asof 欄把它量出來了（開始每日排程之後）：
    #     09-20 ⇒ 09-22 才寫（晚 2 天）　09-21 ⇒ 09-22（晚 1 天）
    #     09-22 ⇒ 09-24 才寫（晚 2 天）　09-23 ⇒ 09-24（晚 1 天）
    #   ⇒ 隔一天就空跑一次：準時跑的那天檔還沒上傳 ⇒ +0；GitHub 誤點幾小時的那天
    #     （09-24 是 04:36Z 才跑）就一次補兩天 ⇒ ⚠ 結果看 GitHub 誤點多少，不是看我們
    #   ⚠ 而空跑那一趟 runlog 報的是 ✓：唯一一條檢查「本趟不是全失敗」
    #     在「成功 0／失敗 0」時也會過 ⇒ 所以另外把幣市加進 freshness_check（見那邊）
    #   ⭐ 03:00 UTC：離收盤 3 小時，而且沒有別支排程在這個時段；
    #     併發鎖是 crypto-${{ github.ref }}，跟 daily-fetch／probe-only 都不同組 ⇒ 不會互卡
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 自測（零相依，不連網）
        run: python selftest_crypto.py

      # ⛔⛔ 2026-09-22 訂正：這一步原本排在「執行」之後，跟 daily.yml／
      #   probe.yml 的慣例（「趁 checkout 還新」）相反——結果 run
      #   35709086864 真的踩到：「執行」那一步呼叫 runlog.Run() 會在
      #   本機寫出未 commit 的 data/meta/_last_run.md，sync_code.sh 的
      #   `git checkout -B _sync origin/main` 因此被 git 拒絕（本機有
      #   未 commit 的變更），列印「⚠ 切不過去」後優雅跳過（⛔ 不算
      #   失敗，run 顯示綠燈）——但代價是**那一趟的程式改動完全沒有
      #   同步到 main**，而使用者看到的是全綠。⇒ 搬到最前面，
      #   趁 checkout 剛做完、工作區還乾淨的時候同步，四點二⑤那一族：
      #   「這一步是綠的」不代表「它做了它該做的事」。
      - name: 把程式同步到 main（趁 checkout 還新）
        run: bash sync_code.sh

      # ⛔ schedule／push 觸發的一律是 main（GitHub 的規則），
      #   而這支 workflow 本來就只該在 main 上動這三個檔——
      #   跟 official-months 那一族用的是同一套理由（四點六③）。
      - name: 取 main 現有的虛擬貨幣資料（⛔ 分支那份比 main 舊）
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- data/crypto data/meta/crypto_universe.csv \
              data/meta/_crypto_months_done.csv \
            || echo "⚠ main 上可能還沒有這些檔（第一次跑），略過" >&2
          # ⭐ 資金費率另外取（⛔ 放在 data/crypto_funding，不放 data/crypto：
          #   那個目錄程式常整個掃，多一個檔就多一個「幣」而且不報錯 —— 裁定線 seq97 §三）
          git checkout origin/main -- data/crypto_funding data/meta/crypto_funding_manifest.csv \n            || echo "⚠ main 上可能還沒有這些檔（第一次跑），略過" >&2
          git checkout origin/main -- data/crypto_perp data/meta/crypto_perp_manifest.csv \
            || echo "⚠ main 上可能還沒有這些檔（第一次跑），略過" >&2
          git checkout origin/main -- data/crypto_mark data/meta/crypto_mark_manifest.csv \
            || echo "⚠ main 上可能還沒有這些檔（第一次跑），略過" >&2

      - name: 執行
        run: |
          MODE="${{ inputs.mode }}"; [ -n "$MODE" ] || MODE=daily
          echo "[crypto] mode=$MODE"
          EXTRA=""
          if [ "${{ inputs.reset_months_done }}" = "true" ]; then
            EXTRA="--reset-months-done"
            echo "[crypto] ⚠ 帶 --reset-months-done（續跑台帳會被刪掉重問）"
          fi
          RC=0
          # ⭐ funding／perp 兩個模式共用一道判準自測閘門（⛔ 紅了就不抓）
          #   ⚠ 閘門只能在【最前面】：selftest_workflows 認的是「開頭連續的自測」，
          #     放在分支裡面會被算成沒守門的裸跑
          if [ "$MODE" = "funding" ] || [ "$MODE" = "perp" ] || [ "$MODE" = "mark" ]; then
            python selftest_crypto_funding.py || exit 1
          fi
          # ⭐ funding 模式：C2 的六幣資金費率全期（裁定線 seq97 §三）；抓完當場跑三項交件驗收
          if [ "$MODE" = "funding" ]; then
            python crypto_funding.py || RC=$?
            python funding_audit.py || RC=$?
            exit $RC
          fi
          # ⭐ perp 模式：C5 永續日 K 全期（裁定線 seq124 §三）；⛔ 放 data/crypto_perp，不放 data/crypto
          if [ "$MODE" = "perp" ]; then
            python crypto_perp.py || RC=$?
            exit $RC
          fi
          # ⭐ mark 模式：C5 描述臂的標記價日 K（裁定線 seq155 §二；回測線 1519 只要 1d、BTC／ETH）
          if [ "$MODE" = "mark" ]; then
            python crypto_perp.py --kind mark || RC=$?
            exit $RC
          fi
          python crypto.py --mode "$MODE" $EXTRA || RC=$?
          exit $RC

      - name: Commit 回 repo
        run: bash push_data.sh "crypto(${{ inputs.mode || 'daily' }})"
