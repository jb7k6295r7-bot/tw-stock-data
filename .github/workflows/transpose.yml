name: 個股庫轉置（手動重建）

# 把「按日切」的全市場資料轉成「按股票切」的個股庫。
#
# 為什麼要：日檔是一天一檔、每檔約 2,700 列。要看單一檔股票就得掃過全部 2,844 個
# 日檔（實測 17.6 秒、整批 0.55 GB）。分析環境用完就丟，每次都要重付一次下載成本。
# 轉置後看一檔只要抓 data/stocks/<代號>.csv，約 230 KB、一個請求。
#
# ★ 一律全量重建，**不寫增量**。實測全量 1～3 分鐘，每天跑也划算，沒必要為了省這幾分鐘
#   去養一套增量邏輯——增量的 bug 是靜默的（2026-09-04 實測 capital.py 的 cmd_run
#   只補「還沒有的」，1,400 多檔從第一次抓到之後就凍住，連程式改了都沒反應）。
# ★ 沒有 schedule：日常轉置已經併進 `daily.yml`（抓資料之後、commit 之前），
#   一支工作一次 push，不會有兩個程式同時 push 造成的 git 衝突。
#   這一支只留手動，用在「改了 transpose.py 要立刻重建」或「懷疑內容不對要重跑」。
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "price 價格｜inst 三大法人｜both 兩個都做"
        type: choice
        options: [both, price, inst]
        default: both

permissions:
  contents: write

concurrency:
  group: transpose          # 不要兩趟同時跑，會互相蓋掉輸出
  cancel-in-progress: false

jobs:
  transpose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 轉置
        run: python transpose.py --kind "${{ inputs.kind || 'both' }}"

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "transpose: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              # rebase 卡在衝突時工作區會留在 unmerged 狀態，不先 abort 的話三次全白重試
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
