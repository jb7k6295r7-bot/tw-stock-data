name: 個股庫轉置（手動重建）

# 把「按日切」的全市場資料轉成「按股票切」的個股庫。
#
# 為什麼要：日檔是一天一檔、每檔約 2,700 列。要看單一檔股票就得掃過全部 2,844 個
# 日檔（實測 17.6 秒、整批 0.55 GB）。分析環境用完就丟，每次都要重付一次下載成本。
# 轉置後看一檔只要抓 data/stocks/<代號>.csv，約 230 KB、一個請求。
#
# ★ 一律全量重建，**不寫增量**。實測全量 1～3 分鐘，每天跑也划算，沒必要為了省這幾分鐘
#   去養一套增量邏輯——增量的 bug 是靜默的（2026-09-04 實測 capital.py 的 cmd_run
#   只補「還沒有的」，1,400 多檔從第一次抓到之後就凍住，連程式改了都沒反應）。
# ★ 沒有 schedule：日常轉置已經併進 `daily.yml`（抓資料之後、commit 之前），
#   一支工作一次 push，不會有兩個程式同時 push 造成的 git 衝突。
#   這一支只留手動，用在「改了 transpose.py 要立刻重建」或「懷疑內容不對要重跑」。
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "all 四層全做（建議）｜price 價格｜inst 三大法人｜margin 融資融券｜per 本益比｜both 只做 price+inst"
        type: choice
        # all＝四層全做；both＝price+inst（舊行為，保留給既有呼叫端）
        options: [all, both, price, inst, margin, per]
        default: all

permissions:
  contents: write

concurrency:
  group: transpose          # 不要兩趟同時跑，會互相蓋掉輸出
  cancel-in-progress: false

jobs:
  transpose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 轉置
        # ⚠ 不要寫 `${{ inputs.kind || 'all' }}`：這個 input 有預設值、永遠不是空字串，
        #   `||` 的右邊從來不會生效（2026-09-06 在 feeds.yml 上實測過同樣的寫法）。
        run: python transpose.py --kind "${{ inputs.kind }}"

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 用 -A：`git add <路徑>` 在舊版 git 不把「檔案被刪掉」記進暫存區。
          #   transpose 是**全量重建**，會先清空 data/stocks 再寫——
          #   某個代號如果不再出現（下市清乾淨、代號改過），它的檔案就該消失。
          #   漏掉刪除的話那個檔會永遠留著，看起來像一檔還在交易的股票。
          git add -A data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "transpose: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            REGEN=" data/meta/_db_status.md data/meta/_last_run.md data/meta/_content_audit.csv data/meta/_breadth_audit.csv data/meta/_parvalue_scan.md data/meta/_capital_missing.txt data/meta/_suspend_skipped.txt data/meta/_study_inst.md data/meta/_tdcc_probe.txt data/meta/_tpex_probe.txt data/meta/_twsthr_probe.txt data/meta/_parvalue_probe.txt data/meta/_capital_probe.txt data/meta/_suspend_probe.txt "
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              CONF=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$CONF" ]; then
                BAD=""
                for f in $CONF; do
                  case "$REGEN" in *" $f "*) ;; *) BAD="$BAD $f";; esac
                done
                if [ -n "$BAD" ]; then
                  echo "⛔ rebase 衝突，而且不只是每趟重生的報告檔：$BAD" >&2
                  echo "   真資料的衝突不自動挑一邊，請人工處理。" >&2
                  git rebase --abort 2>/dev/null || true
                  break
                fi
                echo "rebase 衝突，全部是每趟重生的報告檔，取本趟的版本：$CONF"
                for f in $CONF; do git checkout --theirs -- "$f" && git add -- "$f"; done
                if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                  ok=1; break
                fi
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"; sleep 5
            done
            [ "$ok" = "1" ] || { echo "連續三次 push 失敗" >&2; exit 1; }
          fi
