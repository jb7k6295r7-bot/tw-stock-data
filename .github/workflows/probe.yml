name: 端點探針（只跑探針，約 1 分鐘）

# ★ 為什麼要把探針從 daily.yml 拆出來（2026-09-09）
#
#   daily.yml 一趟要 **20 分鐘**，其中漲跌家數回補就佔約 10 分鐘。
#   而在探針還在收斂的這段期間，每改一行探針就要等 22 分鐘才看得到結果——
#   **等的是資料管線，不是探針。**
#
#   ⇒ 拆出來單獨跑：只跑七支探針、只寫 `data/meta/_*probe.txt`，約 1 分鐘。
#     改一版、按一次、兩三分鐘就知道結果。
#
# ⛔ **只測不寫資料**：這支不碰 `data/universe/`、不碰 `data/stocks/`、
#   不碰任何真資料。探針的規矩本來就是「只測不寫」。
#
# ⚠ 不排 cron，只手動觸發。探針是「改了才要跑」的東西，
#   排成每天跑只會製造每天一筆沒人看的 commit。
#
# ⛔ **這一支是 `data/meta/_*probe.txt` 的唯一寫入者。**
#   2026-09-09 一開始我讓 daily.yml 那一步也留著，結果 2 分鐘後就出事：
#     04:13  這一支用**修好的**程式寫出 `_tpex_probe.txt`
#     04:15  daily 用**舊的**程式寫同一個檔並推上去 ⇒ 把新的蓋掉
#   而那四個檔在 commit 段的 REGEN 白名單裡（衝突取本趟版本），
#   **所以完全不會報錯**：檔案在、格式對，只是內容退回舊版。
#   ⇒ 已把 daily.yml 那一步移除。**兩支寫同一批檔＝後推的贏，跟程式新舊無關。**
#
# ⚠ 代價：「探針程式改了會自動重跑」的自癒條件沒有了。
#   **改探針的人要自己按一次這支**（約 1 分鐘）。

on:
  workflow_dispatch:
  # ★ 2026-09-09 補回「自癒」：這一支變成唯一寫入者之後，
  #   「改了探針會自動重跑」那個條件就沒了——**改了探針沒人按，等於沒改**，
  #   而且外表完全正常（檔案在、格式對，只是內容是上一版的）。
  #   ⇒ 每天排一趟，但**只在需要時才真的打對方的伺服器**（條件見下面那一步）。
  #     不需要時整趟不寫檔、不 commit，所以不會製造每天一筆沒人看的 commit。
  # ⚠ 08:30 台北 ＝ 00:30 UTC：避開 daily.yml（11:00／15:59 UTC）。
  schedule:
    - cron: "30 0 * * 1-5"

permissions:
  contents: write

# ⚠ **不要**跟 daily.yml 同一個 concurrency group：
#   同組的話這支會排在 20 分鐘的 daily 後面，那就完全失去意義。
#   七支探針寫的 `_*probe.txt` 都在 commit 那段的 REGEN 白名單裡，
#   撞在一起會自動取本趟版本，不需要靠排隊避開。
concurrency:
  group: probe-only
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⭐ 2026-09-10：Commit 那一步改成「只搬 data」之後，
      #   **程式就不會再經由它進 main**——而排程跑的是 main 上的程式
      #   ⇒ 不同步的話 main 會永遠停在舊版，而且完全看不出來。
      #   ⇒ 在這裡同步：此刻 checkout 還是新的，rebase 幾乎不可能撞
      #     （分支上多的是程式 commit，main 上多的是資料 commit，兩邊不重疊）。
      #   ⭐ 順帶好處：rebase 之後這一趟手上的 `data/` 也是 main 的最新版。
      #   ⛔ 失敗不擋後面：撞到就跳過，資料照抓，程式下一趟再同步。
      # ⛔ 這一步**不設 `continue-on-error`**。
      #   2026-09-10 的第一版設了，於是它 abort 之後顯示成 **success**，
      #   而 main 上的程式一個字都沒更新——**綠燈，但什麼都沒做**。
      #   ⭐ 現在的做法不 rebase ⇒ 不可能衝突 ⇒ 走到 push 還失敗就是**真的有問題**，
      #     該紅。可以跳過的情形（本來就在 main、fetch 不到）自己 `exit 0`。
      - name: 把程式同步到 main（趁 checkout 還新）
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          if [ "$BR" = "main" ]; then echo "本來就在 main，不必同步"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔⛔ 2026-09-10：這一步的第一版寫成 `git rebase origin/main`，
          #   而它**跟那個丟掉 5 小時的 bug 是同一個病**：rebase 會重放分支上
          #   所有還沒進 main 的 commit，包括**很舊的那幾個**，撞上 main 現在的內容。
          #   ⇒ 實測（run 34426373917）：它 abort 了、`continue-on-error` 讓它顯示成功，
          #     而 **main 上的程式一個字都沒更新**——而排程跑的正是 main 上的程式。
          #   ⚠ 失敗的樣子：這一步是**綠的**，只是什麼都沒做。
          #
          # ⇒ 改成跟「Commit 回 repo」**對稱**的做法：
          #   把**程式路徑**（`data/` 以外的一切）搬到 main 的頭上，不 rebase。
          #   ① 不重放任何 commit ⇒ 永遠不會衝突
          #   ② `data/` 完全不碰 ⇒ 別人剛寫的資料原封不動
          #   離線模擬（scratchpad/gitsim4）三項都驗過。
          SRC=$(git rev-parse HEAD)
          git fetch origin main || { echo "⚠ fetch main 失敗，跳過同步" >&2; exit 0; }
          git checkout -q -B _sync origin/main || { echo "⚠ 切不過去" >&2; exit 0; }
          git checkout "$SRC" -- . ':(exclude)data' || {
            echo "⚠ 取程式路徑失敗，跳過同步" >&2; exit 0; }
          git add -A
          if git diff --staged --quiet; then
            echo "程式已經跟 main 一致，沒有要同步的"
          else
            git commit -q -m "sync: 把分支的程式同步到 main"
            git push origin HEAD:main && echo "✓ 程式已同步到 main"
          fi
          # ⛔ 一定要切回原本的分支：後面的步驟（回補、Commit）都靠它。
          git checkout -q "$BR" 2>/dev/null || git checkout -q "$SRC"


      # ★ 先離線驗四支跑不跑得完（假回應整條走一遍）。
      #   ⚠ 這一步**不加 continue-on-error**：這支的唯一產出就是探針輸出，
      #     連跑都跑不完就沒有必要往下打對方的伺服器。
      - name: 驗七支探針跑得完（離線）
        run: python selftest_probes.py

      - name: 跑七支探針（這支一律全跑）
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # 兩支都是「只測不寫資料」，輸出進 data/meta/_*_probe.txt 並 commit，
          # 這樣結論會進 repo，不必有人去翻 Actions log。
          # 重跑條件三選一：
          #   ① 檔不存在
          #   ② 上次結果有 ✗——只看①的話，一次暫時性失敗會讓它永遠不再重試，
          #      而那個失敗結果會一直留著
          #   ③ **探針程式比輸出新**——改了探針卻不重跑，等於改了個寂寞，
          #      而且外表完全正常（2026-09-08 加第 5 節時就差點這樣）
          # ⚠ 比的是 git commit 時間，不是 mtime：Actions 每次都是全新 checkout，
          #   mtime 永遠是「剛剛」，用它永遠比不出新舊。
          for pair in "tdcc_probe.py:_tdcc_probe.txt" "tpex_probe.py:_tpex_probe.txt" \
                      "parvalue_probe.py:_parvalue_probe.txt" \
                      "twsthr_probe.py:_twsthr_probe.txt" \
                      "holiday_probe.py:_holiday_probe.txt" \
                      "otccal_probe.py:_otccal_probe.txt" \
                      "hist_probe.py:_hist_probe.txt"; do
            SCRIPT=${pair%%:*}; F=data/meta/${pair##*:}
            # ⚠ **手動按下去就是要跑**（條件會讓「我剛按了卻沒跑」變成可能）；
            #   排程觸發時才套三選一的重跑條件：
            #     ① 檔不存在
            #     ② 上一趟非 0 結束（輸出檔裡有那行「非 0 結束」的痕跡）
            #     ③ **探針程式比輸出新**——這一條就是自癒的本體
            #   ⛔ ② 比對的是 workflow 自己寫進去的那句話，**不是 grep '✗'**：
            #     探針的正常輸出裡本來就有一堆 ✗（那是「這條路試過了、不通」的記錄），
            #     用 ✗ 當條件會變成每天都重跑，等於沒有條件。
            #   ⚠ ③ 比的是 **git commit 時間**不是 mtime：Actions 每次都是全新 checkout，
            #     mtime 永遠是「剛剛」，用它永遠比不出新舊。
            NEED=1
            if [ "${{ github.event_name }}" = "schedule" ]; then
              NEED=0
              [ -f "$F" ] || NEED=1
              grep -q "非 0 結束" "$F" 2>/dev/null && NEED=1
              SC=$(git log -1 --format=%ct -- "$SCRIPT" 2>/dev/null || echo 0)
              OT=$(git log -1 --format=%ct -- "$F" 2>/dev/null || echo 0)
              if [ "${SC:-0}" -gt "${OT:-0}" ]; then
                NEED=1
                echo "→ $SCRIPT 比 $F 新（$SC > $OT）⇒ 要重跑"
              fi
              [ "$NEED" = "0" ] && echo "→ 跳過 $SCRIPT（輸出是最新的）"
            fi
            if [ "$NEED" = "1" ]; then
              echo "→ 跑 $SCRIPT"
              # ⚠ 2026-09-09：這裡本來是 `python "$SCRIPT" || true`。
              #   tdcc_probe.py 炸在 NameError、`_write` 一次都沒跑到、輸出檔原封不動，
              #   而 `|| true` 把它吞掉 ⇒ **步驟是綠的、探針改了兩趟一個字都沒寫出來**。
              #   ⇒ 非 0 結束要留痕：把 ✗ 寫進輸出檔。
              #   這樣做有兩個效果——結論進 repo 看得見，而且下一趟的 `grep ✗`
              #   條件會自動重試，不必有人記得。
              # ⚠ shell 是 `bash -e`：`python …; RC=$?` 會直接中斷整個步驟，
              #   而 `if ! python …; then RC=$?` 拿到的 $? 是**被 `!` 反轉後的 0**。
              #   兩種寫法都不對。用 `|| RC=$?`：既被 `-e` 放行，又拿得到真的碼。
              RC=0
              python "$SCRIPT" || RC=$?
              if [ "$RC" -ne 0 ]; then
                echo "⛔ $SCRIPT 非 0 結束（rc=$RC）——見上面的 traceback"
                # ⛔ **先把上一版還原回來。** 2026-09-09 實測：tpex 探針在第一節就
                #   403，`_write()` 照樣覆蓋，**458 行的好結果被 13 行的殘骸換掉**，
                #   而附加的那句話寫著「這一份是上一次成功的內容」——**那句是假的**。
                #   ⇒ 還原之後那句話才成立，而且不會因為一次限流就失去整份結果。
                git checkout -- "$F" 2>/dev/null || true
                {
                  echo ""
                  echo "✗ $(date -u '+%Y-%m-%dT%H:%M:%SZ') $SCRIPT 非 0 結束（rc=$RC），"
                  echo "  這一份是上一次成功的內容，不是這一趟的。traceback 在 Actions log。"
                } >> "$F"
              fi
            fi
          done

      # ★ 長期停止買賣（第六輪）。⛔ 不放進上面那個迴圈：它要帶 `--set`，
      #   而那個迴圈的契約是「腳本:輸出檔」對、不帶參數。
      #   ⚠ 它寫的 `_suspend_probe.txt` 也是「只測不寫資料」，
      #     所以下面的白名單要一起加，否則整趟會被那個守門的檢查擋掉。
      - name: 長期停止買賣探針
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          RC=0
          python suspend_probe.py --set longhalt --sleep 2 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "⛔ suspend_probe --set longhalt 非 0 結束（rc=$RC）"
            {
              echo ""
              echo "✗ $(date -u '+%Y-%m-%dT%H:%M:%SZ') suspend_probe.py --set longhalt 非 0 結束（rc=$RC），"
              echo "  這一份是上一次成功的內容，不是這一趟的。traceback 在 Actions log。"
            } >> data/meta/_suspend_probe.txt
          fi

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 要加整個 data/：v3 之後歷史在 data/history、日曆在 data/calendar.csv、
          #   變更紀錄在 data/_changes.log，只 add data/latest 的話**歷史永遠不會被保存**。
          # 用 -A，刪除也要進暫存區（全量重建可能刪檔）
          # ⛔ 這支的契約是「只測不寫資料」。與其相信它，不如**讓它被檢查**：
          #   只 add 四個探針輸出；若 `data/` 底下**還有別的**變動，
          #   代表某支探針動了不該動的東西 ⇒ **整趟紅掉並印出來**，
          #   而不是安靜地把它一起 commit（那就等於契約不存在）。
          # ⛔ **這裡只能有一份清單。** 2026-09-09 實測：守門的排除清單加了
          #   `_suspend_probe.txt`，但下面的 `git add` **忘了加** ⇒
          #   探針寫了檔、守門放行、然後**沒有被 commit**——
          #   整趟綠燈、輸出憑空消失。兩份清單分開維護就會這樣。
          PROBE_OUTS="data/meta/_tdcc_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_tpex_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_parvalue_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_twsthr_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_holiday_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_suspend_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_otccal_probe.txt"
          PROBE_OUTS="$PROBE_OUTS data/meta/_hist_probe.txt"
          OTHER=$(git status --porcelain data | awk '{print $NF}')
          for f in $PROBE_OUTS; do
            OTHER=$(printf '%s\n' "$OTHER" | grep -vx "$f" || true)
          done
          if [ -n "$OTHER" ]; then
            echo "⛔ 探針動到了探針輸出以外的檔案——這支說好只測不寫資料：" >&2
            echo "$OTHER" >&2
            exit 1
          fi
          git add -- $PROBE_OUTS
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ★ push 前一定要先把遠端的變更 rebase 進來（2026-08-31 實測失敗）。
            #   runner 是在 job 開始時 checkout 的，如果這段期間你在網頁上改了檔案，
            #   遠端就比 runner 手上的新，push 會被拒（fetch first）。
            # ⚠ 2026-09-09 實測：原本這裡假設「資料是 append-only，rebase 不會有內容衝突」，
            #   **那句是錯的**。data/meta/ 底下 `_` 開頭的報告檔是每一趟**整份重寫**的，
            #   七支 workflow 都會 push 同一個 repo，加上人手動改，同一份就會逐字衝突。
            #   而重試同一個 rebase 只會一模一樣地再撞一次——三次全白費。
            #   ⚠ 失敗的樣子：log 印「push 失敗」，看起來像網路問題，其實一次都不可能成功。
            #   run 34296206882 就是這樣掛的，那一趟抓到的資料一列都沒推上去。
            #
            # → 衝突時分兩種處置：
            #   ① 衝突的檔案**全部**在 REGEN 裡 → 取本趟的版本續做（rebase 裡 --theirs
            #      才是「正在重放的那個 commit」，也就是本趟；--ours 是遠端，別挑錯邊）。
            #      那些檔完全由當下的 repo 資料重新推導，誰贏都一樣，下一趟會再寫一次。
            #   ② 只要有**一個**不在 REGEN 裡 → **不自作主張**：abort、印出檔名、整趟紅掉。
            #      真資料的衝突要人來看，不可以自動挑一邊。
            #   ⛔ REGEN 只放「每趟重生」的。不放帳本——_otcadj_done.csv 是續跑進度，
            #      自動取一邊會把另一趟做過的進度吃掉；也不放任何不帶 `_` 前綴的真資料。
            # ⛔⛔ 2026-09-09 花了 **5 小時**的學費，2026-09-10 又用離線 git 模擬
            #   證明「先 rebase 到分支頭」那個補丁**擋不住**，才換成現在這個做法。
            #
            #   原本：`git pull --rebase origin main && git push origin HEAD:main`
            #   ⇒ 它會把**分支上還沒進 main 的 commit 全部重放**，包括**程式 commit**。
            #     那趟融資融券回補跑完了、資料 commit 也做好了，最後撞在
            #     `.github/workflows/daily.yml`——衝突的是程式，跟抓到的資料無關，
            #     但整趟 2,846 天的資料就這樣丟掉。
            #   ⚠ 失敗的樣子最毒：回補那一步是**綠的**，只有最後一步紅。
            #
            # ⭐ 現在的做法：**只把「本趟真的改到的 data 路徑」搬到 main 的頭上。**
            #   ① 程式 commit 一個都不重放 ⇒ workflow／程式檔**永遠不會衝突**
            #   ② 別的 workflow 在這幾小時裡寫的資料**原封不動**（我們只碰自己改的檔）
            #   ③ 沒有 rebase ⇒ 沒有「衝突要挑哪一邊」的問題
            #   離線模擬三項都驗過（scratchpad/gitsim3）。
            #
            # ⚠ 唯一的例外是 `_last_run.md`：它是**跨 workflow 累積**的，
            #   `runlog` 只覆蓋自己那一區塊 ⇒ ⛔ **不可以整份取本趟的**，
            #   否則另一支剛報的 ✗ 會被安靜換回上一輪的 ✓。⇒ 逐區塊合併。
            DC=$(git rev-parse HEAD)
            BASE=$(git rev-parse HEAD~1)
            LASTRUN="data/meta/_last_run.md"
            CHANGED=$(git diff --name-only "$BASE" "$DC" -- data)
            DELETED=$(git diff --diff-filter=D --name-only "$BASE" "$DC" -- data)
            echo "本趟改到 $(printf '%s\n' "$CHANGED" | grep -cv '^$') 個 data 檔"
            ok=0
            for i in 1 2 3; do
              git fetch origin main || { sleep $((i * 5)); continue; }
              git checkout -q -B _push origin/main || break
              printf '%s\n' "$CHANGED" | grep -v '^$' | grep -vx "$LASTRUN" \
                | xargs -r git checkout "$DC" --
              printf '%s\n' "$DELETED" | grep -v '^$' \
                | xargs -r git rm -q -f --ignore-unmatch
              if printf '%s\n' "$CHANGED" | grep -qx "$LASTRUN"; then
                git show "$DC:$LASTRUN" > /tmp/lr_mine.md
                git show "origin/main:$LASTRUN" > /tmp/lr_main.md 2>/dev/null \
                  || : > /tmp/lr_main.md
                if python3 merge_last_run.py /tmp/lr_mine.md /tmp/lr_main.md > "$LASTRUN"; then
                  git add -- "$LASTRUN"
                else
                  echo "⛔ _last_run.md 逐區塊合併失敗，取本趟的（⚠ 另一支的區塊可能被回退）" >&2
                  git checkout "$DC" -- "$LASTRUN" && git add -- "$LASTRUN"
                fi
              fi
              git add -A data
              if git diff --staged --quiet; then
                echo "搬到 main 之後沒有差異（多半是別的 workflow 已經推過同樣的內容）"
                ok=1; break
              fi
              git commit -q -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
              if git push origin HEAD:main; then ok=1; break; fi
              echo "push 失敗（第 $i 次），多半是這幾秒又有人推了 main，重來" >&2
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "連續三次 push 失敗" >&2
              exit 1
            fi
