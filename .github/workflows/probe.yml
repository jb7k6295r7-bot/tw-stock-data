name: 端點探針（只跑探針，約 1 分鐘）

# ★ 為什麼要把探針從 daily.yml 拆出來（2026-09-09）
#
#   daily.yml 一趟要 **20 分鐘**，其中漲跌家數回補就佔約 10 分鐘。
#   而在探針還在收斂的這段期間，每改一行探針就要等 22 分鐘才看得到結果——
#   **等的是資料管線，不是探針。**
#
#   ⇒ 拆出來單獨跑：只跑九支探針、只寫 `data/meta/_*probe.txt`，約 1 分鐘。
#     改一版、按一次、兩三分鐘就知道結果。
#
# ⛔ **只測不寫資料**：這支不碰 `data/universe/`、不碰 `data/stocks/`、
#   不碰任何真資料。探針的規矩本來就是「只測不寫」。
#
# ⚠ 不排 cron，只手動觸發。探針是「改了才要跑」的東西，
#   排成每天跑只會製造每天一筆沒人看的 commit。
#
# ⛔ **這一支是 `data/meta/_*probe.txt` 的唯一寫入者。**
#   2026-09-09 一開始我讓 daily.yml 那一步也留著，結果 2 分鐘後就出事：
#     04:13  這一支用**修好的**程式寫出 `_tpex_probe.txt`
#     04:15  daily 用**舊的**程式寫同一個檔並推上去 ⇒ 把新的蓋掉
#   而那四個檔在 commit 段的 REGEN 白名單裡（衝突取本趟版本），
#   **所以完全不會報錯**：檔案在、格式對，只是內容退回舊版。
#   ⇒ 已把 daily.yml 那一步移除。**兩支寫同一批檔＝後推的贏，跟程式新舊無關。**
#
# ⚠ 代價：「探針程式改了會自動重跑」的自癒條件沒有了。
#   **改探針的人要自己按一次這支**（約 1 分鐘）。
#
# ⛔⛔ 2026-09-11：下面那個「自癒」**只看 `main`**。
#   `schedule` 觸發的 run 一律跑 `main`（GitHub 的規則）⇒ 在**分支**上改好的探針，
#   排程**永遠不會跑到**，⚠ 而它照樣成功、照樣寫出檔、照樣推上 main
#   ⇒ 輸出裡**少了新那一節**，而「少了那一節」跟「那一節查無結果」長得一模一樣。
#   實例：00:25 在分支上給 `delist_probe.py` 加了雙向比對，00:41 排程跑的是舊的。
#   ⇒ ⭐ 分支上剛改的探針，要自己 `workflow_dispatch` **指定分支**跑一趟，
#     ⛔ 判準是「輸出裡有沒有那一節」，不是「這一趟成功了沒」。

on:
  workflow_dispatch:
    inputs:
      # ⭐⭐ 分支上產生的**資料**要怎麼進 main：`sync_code.sh` 排除 `data`
      #   （四點六：main 是 data/ 的唯一寫入者），⛔ 所以它不會自己過去。
      #   ⚠ 而 `push_data.sh` 問的是「**本趟**改了什麼」——分支上**早就 commit**
      #     的檔它問不到（四點六那個鏡像①）。
      #   ⇒ `push_data.sh` 的第二個參數起就是為這種情況留的「強制搬」。
      # ⛔⛔ 只可以在**分支**上派這一支（它不讀 `data/` 來重算，只搬）。
      #   ⚠ 在 main 上派沒有意義：main 上那些路徑本來就是 main 的。
      force_paths:
        description: "強制搬到 main 的 data/ 路徑（空白分隔）｜⛔ 只在分支上派"
        required: false
        default: ""
  # ★ 2026-09-09 補回「自癒」：這一支變成唯一寫入者之後，
  #   「改了探針會自動重跑」那個條件就沒了——**改了探針沒人按，等於沒改**，
  #   而且外表完全正常（檔案在、格式對，只是內容是上一版的）。
  #   ⇒ 每天排一趟，但**只在需要時才真的打對方的伺服器**（條件見下面那一步）。
  #     不需要時整趟不寫檔、不 commit，所以不會製造每天一筆沒人看的 commit。
  # ⚠ 08:30 台北 ＝ 00:30 UTC：避開 daily.yml（11:00／15:59 UTC）。
  schedule:
    - cron: "30 0 * * 1-5"

permissions:
  contents: write

# ⚠ **不要**跟 daily.yml 同一個 concurrency group：
#   同組的話這支會排在 20 分鐘的 daily 後面，那就完全失去意義。
#   七支探針寫的 `_*probe.txt` 都在 commit 那段的 REGEN 白名單裡，
#   撞在一起會自動取本趟版本，不需要靠排隊避開。
concurrency:
  group: probe-only
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # ⛔⛔ 2026-09-15 付過代價：這裡本來是 **15**，而底下「跑十四支探針」
    #   那一步**自己就是 15** ⇒ 探針一跑滿，整個 job 先被 job-level timeout 砍掉
    #   ⇒ 畫面上是 `cancelled`，⚠ 而真正的後果是**後面四步一步都沒跑**：
    #     「MOPS 橋接」「長期停止買賣探針」「Commit 回 repo」全部沒有
    #   ⇒ ⭐ **那一趟什麼都沒推**，而 run 的樣子只是「被取消」。
    # ⚠ 實測今天吃掉四趟（run 86／87／97／98，都在開始後約 15 分被砍）
    #   ——⛔ 而我一度把它讀成「基礎設施問題」。
    # ⇒ job 的 timeout 必須**大於任何單一步驟**的 timeout，這裡留足餘裕。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⭐ 2026-09-10：Commit 那一步改成「只搬 data」之後，
      #   **程式就不會再經由它進 main**——而排程跑的是 main 上的程式
      #   ⇒ 不同步的話 main 會永遠停在舊版，而且完全看不出來。
      #   ⇒ 在這裡同步：此刻 checkout 還是新的，rebase 幾乎不可能撞
      #     （分支上多的是程式 commit，main 上多的是資料 commit，兩邊不重疊）。
      #   ⭐ 順帶好處：rebase 之後這一趟手上的 `data/` 也是 main 的最新版。
      #   ⛔ 失敗不擋後面：撞到就跳過，資料照抓，程式下一趟再同步。
      # ⛔ 這一步**不設 `continue-on-error`**。
      #   2026-09-10 的第一版設了，於是它 abort 之後顯示成 **success**，
      #   而 main 上的程式一個字都沒更新——**綠燈，但什麼都沒做**。
      #   ⭐ 現在的做法不 rebase ⇒ 不可能衝突 ⇒ 走到 push 還失敗就是**真的有問題**，
      #     該紅。可以跳過的情形（本來就在 main、fetch 不到）自己 `exit 0`。
      # ⛔ 1 小時 50 分鐘換來的一步（run 34426373917）：
      #   「回補」那一步 success 跑了 1h50m，「Commit」1 秒失敗——
      #   `syntax error: unexpected end of file`，**我的 shell 少了一個 `fi`**。
      #   ⚠ 我當時「驗過」了，但我驗的是 `yaml.safe_load()`——
      #     **YAML 合法不代表裡面的 shell 合法**（對 YAML 來說 run: 只是字串）。
      #   ⇒ 那一步從寫出來就是壞的，任何一趟都會失敗，而我讓它帶著 1h50m 去撞。
      - name: 驗 workflow 自己（每一段 shell 的語法，零相依）
        run: python selftest_workflows.py

      # ⛔ 同一件事只准有一份實作。這一族 2026-09-10 掃出**十份**，
      #   其中 `_same_day` 那一份會讓每日抓取憑空造出一個交易日。
      #   ⚠ 本機 pre-commit 也有同一道——⛔ 兩個地方都要有：
      #     hook 可以被 `--no-verify` 跳過，而這裡跳不掉。
      - name: 掃有沒有第二份實作（零相依）
        run: python selftest_no_dup.py

      # ⛔⛔ 2026-09-15 probe run 115 的代價：`selftest_tdcc.py` 走到了
      #   `write_hist` ⇒ `import pyarrow`，⚠ 而 **probe runner 沒裝**
      #   ⇒ 那一步 failure ⇒ 後面三步（含**把程式同步到 main**）全部 skipped
      #   ⇒ 那一趟什麼都沒搬過去。⭐ 六點五：一條在某個環境下必然不成立的
      #     斷言，等於把那個環境的整條線關掉。
      # ⚠ 而既有三道守門**一道都抓不到**：`selftest_workflows` 只驗語法與存在、
      #   `selftest_no_dup` 比函式本體、AST 掃 import 抓不到「別的模組的函式裡
      #   的 import」⇒ ⭐ 唯一抓得到的方式是**真的在那個環境跑一次**。
      - name: 驗「零相依」那幾步在缺套件時真的跑得完（零相依）
        run: python selftest_zero_dep.py

      # ⛔⛔ 低水位檔這一族 `selftest_no_dup.py` **抓不到**：八份的函式本體長得
      #   都不一樣（讀的檔名不同、回傳的形狀不同）⇒ 那道守門比的是 AST 函式本體。
      #   ⚠ 而這一族有**兩種相反的語意**（有的只准往上、有的只准往下）
      #   ⇒ 抄錯方向 = 那道閘門在反方向守門，**而畫面上永遠是 ✓**。
      #   ⇒ ⭐ 它要自己的守門（CLAUDE.md 四點五第九次）。零相依。
      - name: 掃低水位檔有沒有第九份實作（零相依）
        run: python selftest_lowwater.py

      # ⛔⛔ 這一道擋的是「程式刪掉**被 git 追蹤**的 `data/` 檔」——
      #   ⚠ 而傷害是兩段的：① 程式刪掉工作區那個檔
      #   ② `push_data.sh` 看到一個刪除 ⇒ 把那個刪除**搬到 main**。
      #   ⭐ K線分析線 2026-09-15 §5-3：`otc_adj.py --fresh` 那條路一直通著，
      #     沒觸發的唯一原因是「沒有人按過那個旗標」⇒ 是時間問題，不是保護。零相依。
      - name: 掃有沒有程式會刪掉被追蹤的 data/ 檔（零相依）
        run: python selftest_no_data_delete.py

      # ⛔⛔ `continue-on-error: true` 的自測紅了，run 的 conclusion 仍然是
      #   **success** ⇒ 沒有任何地方會說（daily.yml 有 62 個這種步驟）。
      #   ⚠ 抓資料那些自己會寫 runlog ⇒ 看得到；⛔ **自測沒有** ⇒ 看不到。
      #   ⇒ `ci_step.py` 記下來、`ci_report.py` 寫成 runlog 區塊。
      #   ⭐ 這一道釘的是那兩支本身（⛔ 尺壞掉 ⇒ 它會說「全綠」）。零相依。
      - name: 驗「紅掉的自測會被說出來」（零相依）
        run: python selftest_ci_steps.py

      # ⛔⛔ 這一道釘的不是那個判準，是**呼叫點**：2026-09-14 我把集保週檔的
      #   「累積週數只准往上」寫在 `main()` 最後面，⚠ 而 `main()` 在
      #   「這一週的檔已經存在」時早就 return 了——⭐ 而那是**每天都會走的**那條路
      #   ⇒ 那道閘門一週只跑一天，而它要擋的事每天都可能發生。零相依、不連外。
      - name: 驗集保週檔的閘門真的每天都跑（零相依）
        run: python selftest_tdcc.py

      # ⛔ `push_data.sh` 的累積型 CSV 逐鍵合併。這一支擋的是**已經發生過**的
      #   資料遺失：分支上的 `data/` 比 main 舊，整檔搬過去會刪掉別人剛寫的列，
      #   ⚠ 而 `git diff` 看起來只是「這一趟重算過」。
      - name: 驗累積型 CSV 的逐鍵合併（零相依）
        run: python selftest_merge_ledger.py

      # ⛔⛔ 補鏈這種東西最糟的壞法**不是「沒補到」**（那會抓不到資料，很吵），
      #   ⭐ 是**「順手把驗證關掉」**——⚠ 那會安靜地成功，成功得跟對的一模一樣。
      - name: 驗補鏈沒有降低驗證（零相依）
        run: python selftest_ca_chain.py

      - name: 把程式同步到 main（趁 checkout 還新）
        # ⛔ 只有一份實作（CLAUDE.md 四點五）。⚠ 這一段本來八支各抄一份、
        #   逐字相同——而 2026-09-13 要在裡面加一份**排除清單**，
        #   八份各改一次就是「改一邊、另一邊沒跟上」的完美條件。
        run: bash sync_code.sh

      # ★ 先離線驗十四支跑不跑得完（假回應整條走一遍）。
      #
      # ⛔⛔ 2026-09-15 付過代價：這一步本來寫 `run: python selftest_probes.py`，
      #   而註解說「不加 continue-on-error ⇒ 連跑都跑不完就不必往下打」。
      #   ⚠ **那句話是假的**：下面「取 main 上的判準檔」與「跑十四支探針」
      #   兩步都是 `if: always()` ⇒ 這一步紅了，**後面照樣全跑**。
      #   ⇒ run 100 實測：step 12 failure，而整趟照樣往下走、照樣 commit，
      #     ⛔ 而 `_last_run.md` 裡**沒有任何一塊**提到它紅了。
      #
      # ⇒ ⭐ 改成走 `ci_step.py`（記下 rc、⛔ 一律 exit 0），
      #   下面加一步 `ci_report.py` 把它寫成 runlog 區塊 ⇒ 進 commit ⇒ 四條線讀得到。
      #   ⚠ 這不是「把紅的藏起來」——⭐ 反過來：原本那個紅**只有 run 畫面看得到**，
      #     現在它會進到**資料**裡（四點二⑤：可見性要由資料承擔，⛔ 不是由 log）。
      - name: 驗十四支探針跑得完（離線）
        run: python ci_step.py selftest_probes.py

      # ⭐⭐ `probe_step.sh`（探針壞掉時留痕跡的那一份）自己的自測。
      #   ⛔ 它守的兩件事都在 2026-09-16 run 131 真的發生過：
      #     ① 還原要從 `origin/main` 取（舊寫法還原**分支**那份
      #        ⇒ main 上的 `_keys_probe.txt` 被砍掉 533 行）
      #     ② 撞到時間預算要**講出來**（舊寫法整個 shell 被砍 ⇒ 一個字都沒留，
      #        ⚠ 而 `continue-on-error` 讓那一步顯示 success）
      #   ⚠ 走 `ci_step.py` 的理由跟上一步一樣：它紅了要進**資料**，⛔ 不是只在 log。
      # ⭐ `feed_hosts.py` 的自測（條款分族那一支；離線、不連網）。
      - name: 驗 feed_hosts（我方哪一支打哪一族主機）
        if: always()
        continue-on-error: true
        run: python ci_step.py selftest_feed_hosts.py

      - name: 驗 probe_step.sh（探針壞掉時留不留得下痕跡）
        run: python ci_step.py selftest_probe_step.py

      # ⛔⛔ `delist_probe.py` 的雙向比對要讀 `data/meta/delisted.csv`，
      #   而那個檔**只在 main 上**（`delisted.py` 是 daily 跑的、推到 main）。
      #   ⇒ 這支 checkout 的是分支 ⇒ 讀到「檔不存在」⇒ 那一節整節不做。
      #   ⚠ 2026-09-11 run 42 實測就是這樣：探針**成功**、輸出裡那一節
      #     只寫著「我方那份不在這個 ref 上」——⭐ 幸好程式端有那句，
      #     ⛔ 沒有那句的話它會靜靜比出「A 265 筆、B 0 筆」那種假結論。
      #   ⇒ CLAUDE.md 第四點六鏡像的落地條①：讀 main 才有的檔就先取下來。
      # ⭐ `tls_probe` 要用它回答「是不是我方 CA 太舊」。
      #   ⚠ 裝不起來不該讓整趟紅（其他十三支不需要它）⇒ `continue-on-error`，
      #   ⛔ 而 `tls_probe` 自己會在報告第一行寫「certifi：**無**」並說它答不出那一格。
      - name: 裝 certifi（只有 tls_probe 要用）
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pip install --quiet --disable-pip-version-check certifi

      - name: 取 main 上的判準檔（雙向比對要用）
        if: always()
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- data/meta/delisted.csv || \
            echo "⚠ main 上也沒有 delisted.csv（⛔ 那才是真的沒有）"
          ls -l data/meta/delisted.csv || true

      # ⛔⛔ 2026-09-16 run 133：這一步 **10:17:54 → 10:33:06 ＝ 15 分 12 秒**
      #   ⇒ 撞到 `timeout-minutes: 15` 被砍，而排在 `hist_probe` 後面的
      #   `keys_probe` 以後那幾支**一支都沒跑到**。
      #   ⚠ 而畫面上：step **success**（`continue-on-error: true`）、
      #     輸出檔跟上一趟逐位元相同、沒有任何 ✗
      #   ⇒ ⛔ 「它沒跑到」與「它跑了而且結果沒變」**長得一模一樣**。
      #   ⭐ 而這一步的註解早就警告過同一件事（見下面「丁級 11」那一段：
      #     「排在最後的一定被砍，而且被砍的樣子是『這一支沒有輸出』」）
      #     ——⚠ 那時是 9 支共用 15 分鐘，現在是 **18 支**。
      #
      # ⇒ ⭐ 兩層，⛔ 缺一層都會再犯：
      #   ① 迴圈**自己**有 wall-clock 預算（`PROBE_LOOP_BUDGET_SEC`），
      #      用完就**不再跑**，並把剩下那幾支**逐支寫一行 ✗ 進它自己的輸出檔**
      #      ⇒ ⭐ 可見性由**資料**承擔（四點二⑤），⛔ 不是由 log（log 會捲掉）
      #   ② 步驟的 `timeout-minutes` 要比①大（①才有機會跑到）
      - name: 跑十四支探針（這支一律全跑）
        if: always()
        continue-on-error: true
        timeout-minutes: 26
        env:
          # ⭐ `finmind_probe.py` 要回答「免費層夠不夠、還是一定要付費」
          #   ⇒ ⛔ 沒有 token 的話它只答得出免費層那一半（它會自己講出來）
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          # ⭐ 迴圈的 wall-clock 預算（⛔ 要比步驟的 `timeout-minutes` 小）
          PROBE_LOOP_BUDGET_SEC=${PROBE_LOOP_BUDGET_SEC:-1440}
          LOOP_DEADLINE=$(( $(date +%s) + PROBE_LOOP_BUDGET_SEC ))
          echo "⏳ 這一輪的迴圈預算：${PROBE_LOOP_BUDGET_SEC} 秒"
          # 兩支都是「只測不寫資料」，輸出進 data/meta/_*_probe.txt 並 commit，
          # 這樣結論會進 repo，不必有人去翻 Actions log。
          # 重跑條件三選一：
          #   ① 檔不存在
          #   ② 上次結果有 ✗——只看①的話，一次暫時性失敗會讓它永遠不再重試，
          #      而那個失敗結果會一直留著
          #   ③ **探針程式比輸出新**——改了探針卻不重跑，等於改了個寂寞，
          #      而且外表完全正常（2026-09-08 加第 5 節時就差點這樣）
          # ⚠ 比的是 git commit 時間，不是 mtime：Actions 每次都是全新 checkout，
          #   mtime 永遠是「剛剛」，用它永遠比不出新舊。
          for pair in "tdcc_probe.py:_tdcc_probe.txt" "tpex_probe.py:_tpex_probe.txt" \
                      "parvalue_probe.py:_parvalue_probe.txt" \
                      "twsthr_probe.py:_twsthr_probe.txt" \
                      "holiday_probe.py:_holiday_probe.txt" \
                      "otccal_probe.py:_otccal_probe.txt" \
                      "hist_probe.py:_hist_probe.txt" \
                      "keys_probe.py:_keys_probe.txt" \
                      "site_inventory.py:_site_inventory.txt" \
                      "sbl_probe.py:_sbl_probe.txt" \
                      "delist_probe.py:_delist_probe.txt" \
                      "esb_day_probe.py:_esb_day_probe.txt" \
                      "chtm_probe.py:_chtm_probe.txt" \
                      "tls_probe.py:_tls_probe.txt" \
                      "finmind_probe.py:_finmind_probe.txt" \
                      "bsr_probe.py:_bsr_probe.txt" \
                      "broker_probe.py:_broker_probe.txt" \
                      "reduce_ratio_probe.py:_reduce_ratio_probe.txt" \
                      "feed_hosts.py:_feed_hosts.txt"; do
            SCRIPT=${pair%%:*}; F=data/meta/${pair##*:}
            # ① ⭐ 迴圈自己的 wall-clock 預算：用完就**不再跑**，
            #    ⛔ 而且**不是安靜跳過**——逐支在它自己的輸出檔留一行 ✗。
            if [ "$(date +%s)" -ge "$LOOP_DEADLINE" ]; then
              echo "⛔ 迴圈預算用完（${PROBE_LOOP_BUDGET_SEC} 秒）⇒ 沒跑到 $SCRIPT"
              {
                echo ""
                echo "✗ $(date -u '+%Y-%m-%dT%H:%M:%SZ') **這一趟沒有跑到 $SCRIPT**"
                echo "  （迴圈的時間預算 ${PROBE_LOOP_BUDGET_SEC} 秒用完了）"
                echo "  ⛔ 這一份是上一趟的內容 ⇒ ⚠ 不要當成「這一趟結果沒變」。"
              } >> "$F" 2>/dev/null || true
              continue
            fi
            # ⚠ **手動按下去就是要跑**（條件會讓「我剛按了卻沒跑」變成可能）；
            #   排程觸發時才套三選一的重跑條件：
            #     ① 檔不存在
            #     ② 上一趟非 0 結束（輸出檔裡有那行「非 0 結束」的痕跡）
            #     ③ **探針程式比輸出新**——這一條就是自癒的本體
            #   ⛔ ② 比對的是 workflow 自己寫進去的那句話，**不是 grep '✗'**：
            #     探針的正常輸出裡本來就有一堆 ✗（那是「這條路試過了、不通」的記錄），
            #     用 ✗ 當條件會變成每天都重跑，等於沒有條件。
            #   ⚠ ③ 比的是 **git commit 時間**不是 mtime：Actions 每次都是全新 checkout，
            #     mtime 永遠是「剛剛」，用它永遠比不出新舊。
            NEED=1
            if [ "${{ github.event_name }}" = "schedule" ]; then
              NEED=0
              [ -f "$F" ] || NEED=1
              grep -q "非 0 結束" "$F" 2>/dev/null && NEED=1
              SC=$(git log -1 --format=%ct -- "$SCRIPT" 2>/dev/null || echo 0)
              OT=$(git log -1 --format=%ct -- "$F" 2>/dev/null || echo 0)
              if [ "${SC:-0}" -gt "${OT:-0}" ]; then
                NEED=1
                echo "→ $SCRIPT 比 $F 新（$SC > $OT）⇒ 要重跑"
              fi
              [ "$NEED" = "0" ] && echo "→ 跳過 $SCRIPT（輸出是最新的）"
            fi
            if [ "$NEED" = "1" ]; then
              echo "→ 跑 $SCRIPT"
              # ⚠ 2026-09-09：這裡本來是 `python "$SCRIPT" || true`。
              #   tdcc_probe.py 炸在 NameError、`_write` 一次都沒跑到、輸出檔原封不動，
              #   而 `|| true` 把它吞掉 ⇒ **步驟是綠的、探針改了兩趟一個字都沒寫出來**。
              #   ⇒ 非 0 結束要留痕：把 ✗ 寫進輸出檔。
              #   這樣做有兩個效果——結論進 repo 看得見，而且下一趟的 `grep ✗`
              #   條件會自動重試，不必有人記得。
              # ⚠ shell 是 `bash -e`：`python …; RC=$?` 會直接中斷整個步驟，
              #   而 `if ! python …; then RC=$?` 拿到的 $? 是**被 `!` 反轉後的 0**。
              #   兩種寫法都不對。用 `|| RC=$?`：既被 `-e` 放行，又拿得到真的碼。
              # ⭐ 收成一份（四點五）：`probe_step.sh` 負責「壞掉要留得下痕跡」。
              #   ⛔ 這裡本來是抄三份的 `RC=0 / python … / git checkout -- "$F"`，
              #   ⚠ 而那個 `git checkout --` 還原的是**分支**那一份
              #   ⇒ 2026-09-16 run 131 把 main 上的 `_keys_probe.txt` 砍掉 533 行。
              #   ⇒ 還原改從 `origin/main` 取，理由見 probe_step.sh 檔頭。
              bash probe_step.sh "$F" 780 python "$SCRIPT"
            fi
          done

      # ⭐ 丁級 11 的終點驗證。⛔ **不放進上面那個迴圈**，理由是時間預算：
      #   那個迴圈九支共用 15 分鐘，而 `hist_probe` 一支就會吃掉大半
      #   ⇒ 排在最後的一定被砍，⚠ **而且被砍的樣子是「這一支沒有輸出」**，
      #     跟「它跑了但什麼都沒找到」長得一樣。
      #   ⚠ 我第一版就是這樣寫的，run 34444805963 當場示範了一次。
      #   ⇒ 有待答問題的探針要有自己的時間預算。
      - name: MOPS 橋接與 OpenAPI（丁級 11 終點驗證）
        if: always()
        continue-on-error: true
        # ⛔⛔ 12 分鐘（原本 8）：2026-09-16 run 131 的 mops_probe **撞到 8 分鐘被砍**，
        #   ⇒ 整個 shell 死掉 ⇒ 寫 ✗ 那段一行都沒跑 ⇒ 輸出停在上一趟，
        #   ⚠ 而 `continue-on-error: true` 讓那一步顯示 **success**
        #   ⇒ 「它被砍了」與「它跑完沒有新發現」在畫面上一模一樣。
        #   ⇒ ⭐ 真正的修法是**內層自己有預算**（probe_step.sh 的 600 秒），
        #     外層只是安全網 ⇒ ⛔ 外層一定要比內層大。
        # ⚠ 2026-09-16 又動了一次：run 132 實測 **502 秒**，而 D2 那三支前面
        #   要**先停 60 秒**等限流（七發全部 Connection reset by peer）
        #   ⇒ 600 秒只剩 38 秒餘裕 ⇒ 內層 780、外層 15 分。
        #   ⛔ 外層一定要比內層大（`selftest_probe_step.py` ⑥ 釘著）。
        timeout-minutes: 15
        run: bash probe_step.sh data/meta/_mops_probe.txt 780 python mops_probe.py

      # ★ 長期停止買賣（第六輪）。⛔ 不放進上面那個迴圈：它要帶 `--set`，
      #   而那個迴圈的契約是「腳本:輸出檔」對、不帶參數。
      #   ⚠ 它寫的 `_suspend_probe.txt` 也是「只測不寫資料」，
      #     所以下面的白名單要一起加，否則整趟會被那個守門的檢查擋掉。
      - name: 長期停止買賣探針
        if: always()
        continue-on-error: true
        # ⚠ 這一份原本連「還原」那一行都沒有（三份已經走岔了）⇒ 收成一份之後自動補上。
        timeout-minutes: 8
        run: bash probe_step.sh data/meta/_suspend_probe.txt 300 python suspend_probe.py --set longhalt --sleep 2

      # ⛔ 這一步**故意沒有** `continue-on-error`（跟 daily.yml 那一步同一個理由）：
      #   它只負責「說」。自己炸掉的話要大聲，⚠ 而下面 Commit 是 `if: always()`
      #   ⇒ 這一趟的探針輸出照樣進 commit。
      - name: 這一輪有沒有自測紅著（⛔ continue-on-error 會把它藏起來）
        if: always()
        run: python ci_report.py

      - name: Commit 回 repo
        if: always()
        run: |
          # ⛔ 這一段本來在**八支 workflow 各抄一份**。同一段邏輯抄兩份，
          #   今晚已經害過一次（`limit` 的 bug 在 fetch/backfill 各一份，
          #   修好的那份天天跑、沒修的那份只有回補才跑）。⇒ 只留一份。
          # ⚠ `force_paths` 只在 `workflow_dispatch` 才有值；排程那趟是空的。
          bash push_data.sh "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北" ${{ inputs.force_paths }}
