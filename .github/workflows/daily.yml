name: 每日台股資料

on:
  schedule:
    # ── 每天跑兩次（cron 一律用 UTC，台北 = UTC+8）──
    # 第一次：UTC 11:00 = 台北 19:00（週一至週五）
    #   台股 13:30 收盤，證交所三大法人（T86）約 16:00 前後才齊，19:00 抓通常已完整。
    - cron: "0 11 * * 1-5"
    # 第二次：UTC 15:59 = 台北 23:59（週一至週五）
    #   補 19:00 時還沒出來或事後被更正的資料；fetch.py 是冪等合併，
    #   同一天重跑不會重複，只會補齊或修正（被改的列會寫進 data/_changes.log）。
    - cron: "59 15 * * 1-5"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一次

permissions:
  contents: write           # 要把抓到的檔案 commit 回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25    # 15 → 25：多了轉置那一步，留餘裕給 commit

    steps:
      - uses: actions/checkout@v4
        with:
          # rebase 需要完整歷史；預設的淺層 clone（depth 1）會讓 git pull --rebase 失敗
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★ 先驗 runlog 本身（離線、約 1 秒）。
      #   fetch／mops／adjust／transpose／suspend／capital 六支都靠它寫
      #   `data/meta/_last_run.md`，它壞掉最貴的形狀是**某一支蓋掉別支的區塊**——
      #   那一頁會看起來完整、其實只剩最後跑的那一支。
      #   `continue-on-error`：驗不過也不能擋住當天的資料落檔。
      - name: 驗 runlog（離線）
        continue-on-error: true
        run: python selftest_runlog.py

      # ★ 順便驗 mops 的差異紀錄（離線、約 1 秒）。
      #   `data/mops/_changes.log` 存在的唯一理由是「財報更正不可以被靜默覆蓋」，
      #   它壞掉的方式不是不寫而是**寫太多**：按位置比對時欄序改一次就產生
      #   上百筆鬼影，真的更正被淹掉。**比沒有還糟，因為它看起來在運作。**
      - name: 驗 mops 差異紀錄（離線）
        continue-on-error: true
        run: python selftest_mops.py

      - name: 驗交易日曆的寫檔（離線）
        continue-on-error: true
        run: python selftest_calendar.py

      - name: 抓資料
        id: fetch
        run: python fetch.py

      # ★★ 全市場三大法人日檔：**轉置的上游，2026-09-05 才補上**。
      #
      #   踩過的坑：`fetch.py` 每天有抓 T86 全市場，但只把原始回應存進
      #   `data/latest/market.json`，再抽出**大盤合計**四個數字寫成 `market_inst.csv`。
      #   它**從來沒有寫 `data/universe/inst/<日期>.csv`**——而那正是
      #   `transpose.py` 產生個股法人庫的來源。
      #
      #   後果是**每天落後一天，而且看不出來**：檔案都在、數字都對，
      #   只有「最後一天」永遠停在上次手動回補那天。
      #   2026-09-05 實測：上櫃到 09-04、上市只到 09-03，就是這樣來的。
      #
      #   兩支都是「已存在就略過」，所以指定當天等於只抓一天、一個請求。
      #   `continue-on-error`：這是衍生資料，失敗不該讓當天的原始資料無法落檔。
      #   ⚠ **日期用 `fetch.py` 算好的 `target_trading_day`，不要自己 `date +%F`。**
      #     這支排程在台北時間凌晨跑，`date` 給的是**隔天**——
      #     用它會去抓一個還沒收盤的日子，然後把真正該抓的那天永遠跳過。
      #     `fetch.py` 已經算過目標交易日並寫進 manifest，沿用即可。
      - name: 全市場三大法人（上市 T86）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          echo "目標交易日：$DAY"
          python backfill.py --inst --start "$DAY" --end "$DAY" --sleep 0

      - name: 全市場三大法人（上櫃 TPEx）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          echo "目標交易日：$DAY"
          python feeds.py --run --feed otcinst --start "$DAY" --end "$DAY" --sleep 0

      # ★ 全市場月營收與財報（MOPS）。
      #   ⚠ 這些端點**沒有日期參數，只給最新一期**——所以不是「每天抓一天」，
      #     而是「每天看有沒有換期」。月營收每月約 10 號公告一次、財報一季一次，
      #     絕大多數日子會印 unchanged、不產生任何 commit。
      #   ⚠ 已存在的期別若內容變了＝**財報更正**，逐欄差異寫進
      #     `data/mops/_changes.log`。**那是要看的東西，不是雜訊。**
      #   成本：每天約 22 個請求（11 個表 × 2 個市場）。
      - name: 全市場月營收與財報
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python mops.py --run --sleep 2

      # 個股庫轉置：把今天寫進 daily/ 的那一天一併轉成按股票切的檔。
      #
      # ★ 為什麼併在這一支、不另開每日排程：兩支各自 push 同一個 repo，
      #   就是 2026-09-04 白跑兩趟（各 35 分鐘）的那個 git 衝突。
      #   併進來之後是一支工作、一次 commit，race 不存在。
      # ★ 位置在抓資料之後、commit 之前：早一步就會漏掉今天這一天。
      # ★★ 事件型 feed：除權息與減資。**原本完全不在每日排程裡**（2026-09-06 發現），
      #   也就是說新的除權息／減資事件只有手動跑才會進 `data/adj/`——
      #   而漏掉**看起來完全正常**：沒有錯誤、沒有缺檔，只是還原因子少了幾筆，
      #   跨過那些日子的長期報酬率、均線與扣抵值全部悄悄變錯。
      #
      #   只抓**當月**：兩支都是區間型，一個月一發，成本近乎零。
      #   已存在的日檔會被覆蓋，所以每天重抓當月也不會重複累積。
      #   ★ 減資是事前公告表，未來日期的列不會寫入（見 feeds.py 的 announce_ahead）。
      #   `continue-on-error`：它們是衍生資料，失敗不該讓當天的價格無法落檔。
      - name: 除權息與減資（當月）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          M0=$(TZ=Asia/Taipei date '+%Y-%m-01')
          M1=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          echo "當月區間 $M0 ~ $M1（台北時間）"
          python feeds.py --run --feed exright --start "$M0" --end "$M1" --sleep 5
          python feeds.py --run --feed reduce  --start "$M0" --end "$M1" --sleep 5

      # ★ 只讀本地檔、不連外。**一定要排在上一步後面**，否則新事件不會進因子。
      #   全量重建，資料沒變就不會 commit。
      - name: 算還原因子
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python adjust.py

      # ★ `continue-on-error`：轉置是**衍生檔**，它失敗不該讓當天的原始資料無法落檔。
      #   失敗會在 Actions 顯示為該步驟紅字，但 commit 照常進行。
      # ★ 步驟層級也要設 timeout。`continue-on-error` 只讓「步驟失敗」不中斷流程，
      #   **擋不住 job 層級的逾時**——job 被砍時後面的 Commit 步驟會一起死，
      #   那天的原始資料就沒落檔。這一步吃掉的時間必須有上限。
      # ★ 第一次全新建立**不要走這裡**，請先手動跑一次「個股庫轉置（手動重建）」
      #   （那支 timeout 60 分）。之後每天只是把有變動的檔重寫，時間很短。
      # ★★ 2026-09-07：`--kind both` 改成 `--kind all`（多了 margin 與 per 兩層）。
      #   融資融券與本益比原本只有日期軸，要一檔的長序列得掃 2,845 個日檔、數百 MB。
      #   ⚠ **這兩層第一次建立會 commit 約 490 MB，一定要先用手動那支跑**，
      #     不要讓這個 15 分鐘的步驟去扛。之後每天只有變動的檔會進 commit。
      #   ⚠ transpose 是**全量重建**，四層一起跑比兩層久，timeout 由 8 分提到 15 分。
      # ★★ 2026-09-07 新增。放在轉置**之前**，因為它跟個股庫無關而且很快。
      #   ⚠ **上櫃停牌（bulletin/sprc）沒有歷史，只有當日。**
      #     這一步每晚一天上線，就永久少掉那一天的上櫃停牌——回補補不回來。
      #     上市那三條與上櫃的處置、注意都有 2015 起的歷史，可以事後回補；
      #     只有這一項不行。
      #   ⚠ TWSE 限流回的是 **307**（不是 429），`suspend.py` 內部會退避重試。
      #     sleep 給 8：這一步只打十幾發，慢一點無所謂，被擋掉才麻煩。
      - name: 停牌／處置／注意
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: python suspend.py --daily --sleep 8

      # ★ 被防護擋下來的請求要印出來。這一支所有的失效模式都是「跑起來完全正常」，
      #   log 裡沒印、又沒人去讀 data/meta/_suspend_skipped.txt 的話，
      #   少收一整塊資料跟「今天真的沒有」長得一模一樣（2026-09-07 實際發生過兩次）。
      - name: 停牌抓取有沒有被擋下來
        if: always()
        continue-on-error: true
        run: |
          if [ -s data/meta/_suspend_skipped.txt ]; then
            n=$(grep -vc '^#' data/meta/_suspend_skipped.txt || true)
            [ "$n" -gt 0 ] && { echo "★ 被擋下來 $n 筆："; grep -v '^#' data/meta/_suspend_skipped.txt | head -20; }
          fi

      - name: 個股庫轉置
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: python transpose.py --kind all

      # ★ 就算抓失敗也要 commit：_manifest.json 裡有每一項的失敗原因，
      #   那正是失敗時最需要看到的東西。原本失敗就整個 job 停掉，
      #   結果 repo 裡什麼都沒有，只能去翻 Actions log（2026-08-31 實測）。
      # ★ 資料庫現況總表。放在轉置之後，這樣各層檔數是最新的。
      #   它不抓網路、不改資料，只讀 data/ 然後寫一頁 _db_status.md。
      #   有了它，「資料庫還缺啥」是跑一支腳本、讀一頁，不是臨時拼十幾次查詢。
      - name: 資料庫現況
        if: always()
        continue-on-error: true
        run: python db_status.py --write

      # ★ 交易日曆（只補當月，一個請求）。
      #   `data/meta/calendar_twse.csv` 是「哪一天該有資料」的**唯一外部判準**——
      #   來自 TWSE FMTQIK（大盤層級），與建日檔的個股端點不同條路，
      #   所以它不是循環自證。但它**自己會落後**：2026-09-08 之前只有手動跑過，
      #   當時就落後一天，而任何拿它當閘門的檢查都會把最新那天判成非交易日。
      #   ⛔ 一定要用預設的「併入」，**不可以加 --replace**——
      #      只跑當月又整份覆蓋的話，2,845 天會被截成那個月的幾天，
      #      而且不會報錯（selftest_calendar.py 第 1 節就是釘這件事）。
      - name: 交易日曆（當月）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          M=$(TZ=Asia/Taipei date '+%Y-%m')
          echo "當月 $M（台北時間）"
          python calendar_audit.py --start "$M" --end "$M" --sleep 5 --write

      # ★ 產業別（約每月一次，自癒式）。
      #   類股集中度是選股的硬條件，而新上市的公司在對照表更新之前查不到類股——
      #   查不到就等於那條規則對它沒生效，**而且不會報錯**。
      #   ⛔ 判斷「多久沒更新」一定要用 **git 的 commit 時間**，不可以用檔案 mtime：
      #      Actions 每次都是全新 checkout，mtime 永遠是「剛剛」，
      #      用它的話這一步**永遠不會跑**，而且看起來完全正常。
      - name: 產業別（超過 28 天沒更新才跑）
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          TS=$(git log -1 --format=%ct -- data/meta/industry.csv || true)
          TS=${TS:-0}
          AGE=$(( ( $(date +%s) - TS ) / 86400 ))
          echo "industry.csv 上次更新：$AGE 天前（commit 時間）"
          if [ "$TS" = "0" ] || [ "$AGE" -ge 28 ]; then
            DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
            echo "→ 重建（掃類股成員用 $DAY）"
            python industry.py --run --date "$DAY" --sleep 3
          else
            echo "→ 還新，跳過（未滿 28 天）"
          fi

      # ★ 集保股權分散的端點探針（一次性、自癒）。
      #   籌碼集中度目前沒有歷史序列（db_status 把它列在「沒有來源」那一節），
      #   FinMind 的 HoldingSharesPer 回 400，所以要走集保官方。
      #   端點來自 WebSearch 結果、不是自行生成（tw-data-sources 3-4 的規矩）。
      #   ⚠ **只測不寫資料**，輸出進 data/meta/_tdcc_probe.txt。
      #   ⚠ 條件是「檔不存在**或**上次結果有 ✗」——只看存不存在的話，
      #     一次暫時性失敗會讓它永遠不再重試，而那個失敗結果會一直留著。
      #   ⚠ 端點結論一律以 Actions 為準：開發容器對外 403 是環境差異，不是端點狀態。
      - name: 集保股權分散探針（沒跑過或上次失敗才跑）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          F=data/meta/_tdcc_probe.txt
          if [ ! -f "$F" ] || grep -q '✗' "$F"; then
            echo "→ 跑探針"
            python tdcc_probe.py || true
          else
            echo "→ 已經探過而且沒有 ✗，跳過"
          fi

      # ★ 拿大盤漲跌家數（MI_INDEX）當日檔的外部判準。離線、只讀。
      #   日曆只證明「那一天存不存在」，不證明「那天收到幾檔」；
      #   content_audit 的家數檢查是拿前後交易日比，那是同一條管線不同趟次。
      #   MI_INDEX 是大盤層級彙總表，與建日檔的個股端點不同條路——整批漏抓時
      #   日檔家數會掉、它不會，差值就會翻負。
      #   ⚠ 目前**只驗方向不驗大小**：樣本只有五天，事後看資料再訂帶寬
      #     等於沒有門檻。等 ≥30 天再把數字寫死。
      - name: 漲跌家數對日檔（離線）
        if: always()
        continue-on-error: true
        run: python breadth_audit.py

      # ★ 一次讀完整個資料庫最近一輪的狀況，不必逐檔去翻。
      #   ⚠ **一定要排在最後一支會寫 `_last_run.md` 的腳本後面。**
      #     2026-09-08 之前它排在轉置與還原因子前面，印出來的永遠是上一輪的內容——
      #     一份**看起來完整、其實過期**的摘要，比沒有摘要更糟。
      #   任何一塊是 ✗ 就去看該支腳本那一步的 log；步驟本身照樣綠的，
      #   因為 `continue-on-error`，紅字在檔案裡不在 job 狀態上。
      - name: 這一輪的摘要
        if: always()
        continue-on-error: true
        run: |
          cat data/meta/_last_run.md || true
          if grep -q '✗' data/meta/_last_run.md 2>/dev/null; then
            echo "::warning::_last_run.md 有 ✗ 的區塊，見上面內容"
          fi

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ★ 要加整個 data/：v3 之後歷史在 data/history、日曆在 data/calendar.csv、
          #   變更紀錄在 data/_changes.log，只 add data/latest 的話**歷史永遠不會被保存**。
          # 用 -A，刪除也要進暫存區（全量重建可能刪檔）
          git add -A data
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            # ★ push 前一定要先把遠端的變更 rebase 進來（2026-08-31 實測失敗）。
            #   runner 是在 job 開始時 checkout 的，如果這段期間你在網頁上改了檔案，
            #   遠端就比 runner 手上的新，push 會被拒（fetch first）。
            #   資料是 append-only、每天不同檔名或不同列，rebase 不會有內容衝突。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                ok=1; break
              fi
              # ★ rebase 卡在衝突時工作區會留在 unmerged 狀態，下一輪 git pull 會直接
              #   說 "Pulling is not possible"，三次全白重試。先 abort 回到乾淨狀態。
              git rebase --abort 2>/dev/null || true
              echo "push 失敗（第 $i 次），5 秒後重試"
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "連續三次 push 失敗" >&2
              exit 1
            fi
          fi

      # 抓取失敗時讓整個 run 標成紅色，但上面的 commit 已經做完了
      - name: 回報抓取結果
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "抓資料失敗，詳細原因看 data/latest/_manifest.json 的 errors 欄位"
          exit 1
