name: 每日台股資料

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料
        id: fetch
        run: python fetch.py

      - name: Commit 回 repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            git push
          fi

      - name: 回報抓取結果
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "抓資料失敗，原因看 data/latest/_manifest.json"
          exit 1
