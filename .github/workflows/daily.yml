name: 每日台股資料

on:
  schedule:
    # ── 每天跑兩次（cron 一律用 UTC，台北 = UTC+8）──
    # 第一次：UTC 11:00 = 台北 19:00（週一至週五）
    #   台股 13:30 收盤，證交所三大法人（T86）約 16:00 前後才齊，19:00 抓通常已完整。
    - cron: "0 11 * * 1-5"
    # 第二次：UTC 15:59 = 台北 23:59（週一至週五）
    #   補 19:00 時還沒出來或事後被更正的資料；fetch.py 是冪等合併，
    #   同一天重跑不會重複，只會補齊或修正（被改的列會寫進 data/_changes.log）。
    - cron: "59 15 * * 1-5"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一次

permissions:
  contents: write           # 要把抓到的檔案 commit 回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ⛔⛔ 25 → 45（2026-09-10）。25 那個數字是**在資料庫比較小的時候**訂的，
    #   而 job 裡有幾步的成本**跟著資料庫一起長**：
    #   `selftest_adj_gap.py` 會掃全部 `data/adj/`（2,212 檔）＋ 全部 `data/stocks/`
    #   ——本機 75 秒、Actions 上超過 11 分鐘，⚠ 而它只是第 16 步（全部 57 步）。
    #   ⇒ 那一趟會在跑到「Commit 回 repo」之前就被砍掉，**整趟白跑**，
    #     而外表是「job 逾時」，看不出是哪一步把時間吃光的。
    #   ⭐ 同一輪也把那支自測的重複掃描拿掉了（4 次 → 2 次），
    #     ⛔ 但**時間上限本身也要有餘裕**：只做其中一件，下個月還是會撞。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # rebase 需要完整歷史；預設的淺層 clone（depth 1）會讓 git pull --rebase 失敗
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⭐ 2026-09-10：Commit 那一步改成「只搬 data」之後，
      #   **程式就不會再經由它進 main**——而排程跑的是 main 上的程式
      #   ⇒ 不同步的話 main 會永遠停在舊版，而且完全看不出來。
      #   ⇒ 在這裡同步：此刻 checkout 還是新的，rebase 幾乎不可能撞
      #     （分支上多的是程式 commit，main 上多的是資料 commit，兩邊不重疊）。
      #   ⭐ 順帶好處：rebase 之後這一趟手上的 `data/` 也是 main 的最新版。
      #   ⛔ 失敗不擋後面：撞到就跳過，資料照抓，程式下一趟再同步。
      # ⛔ 這一步**不設 `continue-on-error`**。
      #   2026-09-10 的第一版設了，於是它 abort 之後顯示成 **success**，
      #   而 main 上的程式一個字都沒更新——**綠燈，但什麼都沒做**。
      #   ⭐ 現在的做法不 rebase ⇒ 不可能衝突 ⇒ 走到 push 還失敗就是**真的有問題**，
      #     該紅。可以跳過的情形（本來就在 main、fetch 不到）自己 `exit 0`。
      # ⛔ 1 小時 50 分鐘換來的一步（run 34426373917）：
      #   「回補」那一步 success 跑了 1h50m，「Commit」1 秒失敗——
      #   `syntax error: unexpected end of file`，**我的 shell 少了一個 `fi`**。
      #   ⚠ 我當時「驗過」了，但我驗的是 `yaml.safe_load()`——
      #     **YAML 合法不代表裡面的 shell 合法**（對 YAML 來說 run: 只是字串）。
      #   ⇒ 那一步從寫出來就是壞的，任何一趟都會失敗，而我讓它帶著 1h50m 去撞。
      - name: 驗 workflow 自己（每一段 shell 的語法，零相依）
        run: python selftest_workflows.py

      # ⛔ 同一件事只准有一份實作。這一族 2026-09-10 掃出**十份**，
      #   其中 `_same_day` 那一份會讓每日抓取憑空造出一個交易日。
      #   ⚠ 本機 pre-commit 也有同一道——⛔ 兩個地方都要有：
      #     hook 可以被 `--no-verify` 跳過，而這裡跳不掉。
      - name: 掃有沒有第二份實作（零相依）
        run: python selftest_no_dup.py

      - name: 把程式同步到 main（趁 checkout 還新）
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          if [ "$BR" = "main" ]; then echo "本來就在 main，不必同步"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔⛔ 2026-09-10：這一步的第一版寫成 `git rebase origin/main`，
          #   而它**跟那個丟掉 5 小時的 bug 是同一個病**：rebase 會重放分支上
          #   所有還沒進 main 的 commit，包括**很舊的那幾個**，撞上 main 現在的內容。
          #   ⇒ 實測（run 34426373917）：它 abort 了、`continue-on-error` 讓它顯示成功，
          #     而 **main 上的程式一個字都沒更新**——而排程跑的正是 main 上的程式。
          #   ⚠ 失敗的樣子：這一步是**綠的**，只是什麼都沒做。
          #
          # ⇒ 改成跟「Commit 回 repo」**對稱**的做法：
          #   把**程式路徑**（`data/` 以外的一切）搬到 main 的頭上，不 rebase。
          #   ① 不重放任何 commit ⇒ 永遠不會衝突
          #   ② `data/` 完全不碰 ⇒ 別人剛寫的資料原封不動
          #   離線模擬（scratchpad/gitsim4）三項都驗過。
          SRC=$(git rev-parse HEAD)
          git fetch origin main || { echo "⚠ fetch main 失敗，跳過同步" >&2; exit 0; }
          git checkout -q -B _sync origin/main || { echo "⚠ 切不過去" >&2; exit 0; }
          git checkout "$SRC" -- . ':(exclude)data' || {
            echo "⚠ 取程式路徑失敗，跳過同步" >&2; exit 0; }
          git add -A
          if git diff --staged --quiet; then
            echo "程式已經跟 main 一致，沒有要同步的"
          else
            git commit -q -m "sync: 把分支的程式同步到 main"
            git push origin HEAD:main && echo "✓ 程式已同步到 main"
          fi
          # ⛔ 一定要切回原本的分支：後面的步驟（回補、Commit）都靠它。
          git checkout -q "$BR" 2>/dev/null || git checkout -q "$SRC"


      # ★ 先驗 runlog 本身（離線、約 1 秒）。
      #   fetch／mops／adjust／transpose／suspend／capital 六支都靠它寫
      #   `data/meta/_last_run.md`，它壞掉最貴的形狀是**某一支蓋掉別支的區塊**——
      #   那一頁會看起來完整、其實只剩最後跑的那一支。
      #   `continue-on-error`：驗不過也不能擋住當天的資料落檔。
      - name: 驗 runlog（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_runlog.py

      # ★ 順便驗 mops 的差異紀錄（離線、約 1 秒）。
      #   `data/mops/_changes.log` 存在的唯一理由是「財報更正不可以被靜默覆蓋」，
      #   它壞掉的方式不是不寫而是**寫太多**：按位置比對時欄序改一次就產生
      #   上百筆鬼影，真的更正被淹掉。**比沒有還糟，因為它看起來在運作。**
      - name: 驗 mops 差異紀錄（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_mops.py

      # ★ 把四支探針的 main() 整條走一遍（網路換成假回應）。
      #   ⚠ 開發容器對 tdcc／tpex 是 403 ⇒ main() 在第 30 行就 return，
      #     後面幾百行**本地永遠跑不到**；compileall 與 ast.parse 只抓語法、
      #     抓不到 NameError。2026-09-09 就是這樣讓 `SAMPLE` 未定義上了線。
      - name: 驗四支探針跑得完（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_probes.py

      # ★ 釘住漲跌停方向：`"0.0"` 是 truthy，寫成 `if chg` 會把平盤鎖死判成跌停。
      #   2026-09-09 全庫 50,382 列中招（佔所有 down 的 47.7%）。
      - name: 驗漲跌停方向（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_lock_dir.py

      - name: 驗交易日曆的寫檔（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_calendar.py

      - name: 驗颱風休市判讀（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_holiday.py

      - name: 驗上櫃日曆判準的累積（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_otccal.py

      - name: 驗上市短期暫停交易的守門（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_suspend_twse.py

      - name: 驗上櫃除權息判準會紅也會綠（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_otcexright.py

      - name: 驗缺還原因子的斷言會紅也會綠（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_adj_gap.py

      # ⛔ 這三支是 2026-09-09 清理時發現的**孤兒測試**：程式在 repo 裡、
      #   一支 workflow 都沒有在跑。⇒ **有測試但沒人跑，比沒有測試更糟**——
      #   它讓人以為那三塊有防護，而它從來沒有執行過。
      #   ⚠ 接進來之前先在本機跑過，三支都通過（接一支會紅的進管線比不接更糟）。
      - name: 驗資料庫現況頁（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_db_status.py

      - name: 驗基本面歷史的解析（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_mops_history.py

      - name: 驗上市發行股數的補值（離線）
        timeout-minutes: 10
        run: python selftest_shares_twse.py

      # ⭐ 2026-09-10：官方的空值不是一種寫法是一族——TWSE `--`、TPEx `----`。
      #   兩份 `_num()` 原本是靠 `float()` 失敗**順便**擋掉的，沒有人測過。
      #   ⇒ 規則寫成明示的，並且**每天驗一次兩份有沒有走岔**（`limit` 就是抄兩份只修一份）。
      - name: 驗空值寫法（破折號族，離線）
        run: python selftest_num.py

      - name: 驗無成交列的解析（離線）
        timeout-minutes: 10
        run: python selftest_parse_daily.py

      - name: 驗個股庫轉置（離線）
        continue-on-error: true
        timeout-minutes: 10
        run: python selftest_transpose.py

      # ★ 天然災害停止上班 ⇒ 台股全日休市。**交易日曆天生沒有的前瞻那一半。**
      #   ⛔ 判定是**單向**的：預設開盤，只有正面比對到「台北市＋停止上班」才標休市
      #   （理由見 holiday.py 檔頭：兩種錯的代價不對稱）。
      #   ⚠ 排在 fetch 之前，是因為它同時**每天存一份原始頁面**——
      #     第一個颱風天才會有真正的樣本，而那一天沒存就永遠沒有。
      #   continue-on-error：抓不到公告頁會寫成 unknown 並報 ✗，
      #   但那不該讓整條資料管線停下來。
      - name: 颱風休市（前瞻）
        continue-on-error: true
        run: python holiday.py

      - name: 抓資料
        id: fetch
        run: python fetch.py

      # ★★ 全市場三大法人日檔：**轉置的上游，2026-09-05 才補上**。
      #
      #   踩過的坑：`fetch.py` 每天有抓 T86 全市場，但只把原始回應存進
      #   `data/latest/market.json`，再抽出**大盤合計**四個數字寫成 `market_inst.csv`。
      #   它**從來沒有寫 `data/universe/inst/<日期>.csv`**——而那正是
      #   `transpose.py` 產生個股法人庫的來源。
      #
      #   後果是**每天落後一天，而且看不出來**：檔案都在、數字都對，
      #   只有「最後一天」永遠停在上次手動回補那天。
      #   2026-09-05 實測：上櫃到 09-04、上市只到 09-03，就是這樣來的。
      #
      #   兩支都是「已存在就略過」，所以指定當天等於只抓一天、一個請求。
      #   `continue-on-error`：這是衍生資料，失敗不該讓當天的原始資料無法落檔。
      #   ⚠ **日期用 `fetch.py` 算好的 `target_trading_day`，不要自己 `date +%F`。**
      #     這支排程在台北時間凌晨跑，`date` 給的是**隔天**——
      #     用它會去抓一個還沒收盤的日子，然後把真正該抓的那天永遠跳過。
      #     `fetch.py` 已經算過目標交易日並寫進 manifest，沿用即可。
      - name: 全市場三大法人（上市 T86）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          echo "目標交易日：$DAY"
          python backfill.py --inst --start "$DAY" --end "$DAY" --sleep 0

      - name: 全市場三大法人（上櫃 TPEx）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          echo "目標交易日：$DAY"
          python feeds.py --run --feed otcinst --start "$DAY" --end "$DAY" --sleep 0
          # ★ 同「融資融券與本益比」那一步的理由：只問當天 ⇒ 漏掉的日子永遠不重試。
          #   目前 otcinst 剛好 0 個洞，⛔ 但「現在沒有洞」不是「不會有洞」。
          #   已存在就跳過，所以沒洞時這一段是 0 個請求。
          TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          python feeds.py --run --feed otcinst --start 2015-01-01 --end "$TODAY" \
                          --limit 20 --sleep 1

      # ★★ 2026-09-09 新增：**官方會事後修訂三大法人的投信欄，而我方 T 日抓完就定版。**
      #   市場情報分析線 23:55 用櫃買個股層端點逐檔比對，量到 09-07/08/09 投信對不上；
      #   我把那三天重抓，⭐ **git diff 就是實驗結果**：
      #     29 筆改動，逐欄看 → trust 29、total 29（total 是導出的），
      #     foreign 與 dealer **一筆都沒動**。例：1815 投信 7,190,000 → 4,741,000。
      #   ⇒ 「官方事後修訂投信欄」不再是假說。
      #   ⚠ 而我方原本永遠不會發現：`--run` 已存在就跳過，那三天的錯值會**永久留著**，
      #     而且檔案在、列數對、內部 total 也自洽——**看起來完全正常**。
      #
      #   ⛔ N=5 個交易日是**選的**，不是量出來的：已知 T~T-2 會改、T-3 那天當時是乾淨的。
      #     ⇒ 下面印出「這一趟哪幾天變了」：**如果最舊的那一天也變了，代表 5 天不夠**，
      #       要把 N 調大。⚠ 沒有這一行的話，N 太小會安靜地留下錯值。
      - name: 三大法人回補最近 5 個交易日（官方會事後修訂投信欄）
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          # ⛔ 用**交易日曆**回推 5 天，不是日曆天：連假時日曆天會少算好幾天。
          # ⛔ 不用 heredoc：YAML 縮排下的 `PY` 不在行首，heredoc 收不掉。
          FROM=$(python -c "import csv,io,os;p='data/meta/calendar_twse.csv';ds=sorted(r['date'] for r in csv.DictReader(io.open(p,encoding='utf-8')) if r.get('date')) if os.path.exists(p) else [];print(ds[-5] if len(ds)>=5 else '')")
          if [ -z "$FROM" ]; then
            echo "⛔ 讀不到交易日曆，這一步跳過（⚠ 不要拿日曆天硬算）" >&2
            exit 0
          fi
          echo "回補區間：$FROM ~ $TODAY（5 個交易日）"
          python backfill.py --inst --start "$FROM" --end "$TODAY" --sleep 1 --force || true
          python feeds.py --run --feed otcinst --start "$FROM" --end "$TODAY" \
                          --sleep 1 --force || true
          CH=$(git diff --name-only -- data/universe/inst data/universe/otcinst \
               | sed 's|.*/||;s|\.csv$||' | sort -u)
          if [ -z "$CH" ]; then
            echo "這一趟沒有任何一天被修訂"
          else
            echo "⚠ 這一趟被修訂的日期：$CH"
            if echo "$CH" | grep -q "^$FROM$"; then
              echo "⛔⛔ **最舊的那一天（$FROM）也被改了 ⇒ 5 天不夠，要把 N 調大**" >&2
            fi
          fi

      # ★★ 融資融券與本益比日檔。**2026-09-08 之前完全不在每日排程裡**——
      #   transpose 的跨層檢查第一次跑就抓到：price 到 09-08，而 margin 與 per
      #   還停在 09-04。`data/stocks_margin/`（2,426 檔）與 `data/stocks_per/`
      #   （2,121 檔）是從這兩層轉出來的，等於跟著凍結四天。
      #   ⚠ **漏掉的樣子跟正常一模一樣**：檔案都在、數字都對，只有最後一天不動。
      #     2026-09-05 的 otcinst 就是同一個形狀。
      #   四個都是單日型 feed，已存在就跳過，所以指定當天等於四個請求。
      - name: 融資融券與本益比（上市＋上櫃）
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # ⛔ 自測擋在抓取前面。`note`（官方註記欄）2026-09-10 才加，
          #   而它的失效方式全部是安靜的：TWSE 靠位置取 ⇒ 取錯會存成
          #   「資券互抵」的數字，看起來只是「這一欄大部分是空的」。
          #   ⚠ 而那一欄錯掉的後果不是少一欄——K線線 13:10：
          #     `O`＝停止融資買進 ⇒ 那些股的「餘額低且下降」現在被讀成
          #     「槓桿已出清」（正面），實際上是負面。**方向相反。**
          python selftest_margin_note.py
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          echo "目標交易日：$DAY"
          for f in margin per otcmargin otcper; do
            python feeds.py --run --feed "$f" --start "$DAY" --end "$DAY" --sleep 2
          done
          # ★★ 2026-09-09 新增第二段：**回頭補漏掉的日子**。
          #   在這之前這一步**只問當天** ⇒ 某一天失敗，那一天就**永遠不會被重試**，
          #   而且外表完全正常：檔案都在、數字都對、只有那一天不存在。
          #   實測代價：四個 feed 全部缺 **2026-09-07**（星期一，真的交易日），
          #   而 `_last_run.md` 那幾塊當時都是「待處理 0 天 ✓ 正常」——
          #   因為它們被問的是「今天」，而今天已經有了。
          #   ⇒ 抄 breadth 那一步的兩段式寫法：先當天，再分批回補。
          #   ⚠ `--limit` 是**過濾掉已存在之後**才套用的（feeds.py `cmd_feed`），
          #     所以沒有洞的時候這一段是 0 個請求，不會每天多打 TWSE 幾千發。
          #   ⚠ 上限 20 天 × 4 個 feed × sleep 2 ＝ 最壞約 3 分鐘。
          TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          for f in margin per otcmargin otcper; do
            python feeds.py --run --feed "$f" --start 2015-01-01 --end "$TODAY" \
                            --limit 20 --sleep 2
          done

      # ⭐ 官方創新板成分清單（`STOCK_TIB`）。它取代的是一條**猜的**判準
      #   （名稱後綴 `-創`／`KY創`）——2026-09-09 兩者零差異，⚠ 但字串法是猜的：
      #   改名就失效，而且不會有人發現。
      # ⛔ 單獨一步、⛔ `--start 2021-06-28`：官方歷史下限就在那一天
      #   （越界時 `stat` 會**明說**下限，是大聲失敗）。
      #   ⚠ 混進上面那個 `--start 2015-01-01` 的迴圈的話，
      #     會每天對 1,600 個必定失敗的日子各打一發，然後那些失敗變成雜訊。
      - name: 官方創新板成分清單（逐日，回到 2021-06-28）
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python selftest_tib.py
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          python feeds.py --run --feed tib --start "$DAY" --end "$DAY" --sleep 2
          TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          python feeds.py --run --feed tib --start 2021-06-28 --end "$TODAY" \
                          --limit 40 --sleep 2

      # ★ 集保戶股權分散（大戶持股的來源）。每週一份，週六 09:00 後產生。
      #   ⛔ **端點不吃日期參數，只回最新一週——漏掉一週就永久少一週**
      #     （與上櫃停牌同一種性質）。所以每天都跑：已經有那一週的檔就跳過，
      #     等於一週只真的寫一次，但任何一天跑成功都補得到，不會因為某一天
      #     失敗就整週消失。
      #   ⛔ 三道恆等式任一沒過就**整批不寫**——抓錯期別或欄位錯位時，
      #     寫進去的數字看起來完全正常。
      - name: 集保股權分散（每週一份）
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python tdcc.py --run

      # ★ 全市場月營收與財報（MOPS）。
      #   ⚠ 這些端點**沒有日期參數，只給最新一期**——所以不是「每天抓一天」，
      #     而是「每天看有沒有換期」。月營收每月約 10 號公告一次、財報一季一次，
      #     絕大多數日子會印 unchanged、不產生任何 commit。
      #   ⚠ 已存在的期別若內容變了＝**財報更正**，逐欄差異寫進
      #     `data/mops/_changes.log`。**那是要看的東西，不是雜訊。**
      #   成本：每天約 22 個請求（11 個表 × 2 個市場）。
      - name: 全市場月營收與財報
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python mops.py --run --sleep 2

      # 個股庫轉置：把今天寫進 daily/ 的那一天一併轉成按股票切的檔。
      #
      # ★ 為什麼併在這一支、不另開每日排程：兩支各自 push 同一個 repo，
      #   就是 2026-09-04 白跑兩趟（各 35 分鐘）的那個 git 衝突。
      #   併進來之後是一支工作、一次 commit，race 不存在。
      # ★ 位置在抓資料之後、commit 之前：早一步就會漏掉今天這一天。
      # ★★ 事件型 feed：除權息與減資。**原本完全不在每日排程裡**（2026-09-06 發現），
      #   也就是說新的除權息／減資事件只有手動跑才會進 `data/adj/`——
      #   而漏掉**看起來完全正常**：沒有錯誤、沒有缺檔，只是還原因子少了幾筆，
      #   跨過那些日子的長期報酬率、均線與扣抵值全部悄悄變錯。
      #
      #   只抓**當月**：兩支都是區間型，一個月一發，成本近乎零。
      #   已存在的日檔會被覆蓋，所以每天重抓當月也不會重複累積。
      #   ★ 減資是事前公告表，未來日期的列不會寫入（見 feeds.py 的 announce_ahead）。
      #   `continue-on-error`：它們是衍生資料，失敗不該讓當天的價格無法落檔。
      - name: 除權息與減資（當月）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          M0=$(TZ=Asia/Taipei date '+%Y-%m-01')
          M1=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          echo "當月區間 $M0 ~ $M1（台北時間）"
          python feeds.py --run --feed exright --start "$M0" --end "$M1" --sleep 5
          python feeds.py --run --feed reduce  --start "$M0" --end "$M1" --sleep 5
          # ★★ 變更股票面額（TWSE change/TWTB8U）。2026-09-09 驗到來源才接上。
          #   ⚠ **只有上市**：全庫 24 筆裡 14 筆是上櫃，TPEx 沒有對應端點，
          #     那 14 筆到今天為止仍然沒有還原。見 adjust.py 的 BOUNDS 旁註。
          #   一年通常 0~2 件，多數月份回「查無資料」＝無事件，不是失敗。
          python feeds.py --run --feed parvalue --start "$M0" --end "$M1" --sleep 5
          # ★ ETF 分割／反分割（TWSE split/TWTCAU）。端點由使用者 2026-09-09 提供，
          #   資料庫線以全庫掃描交叉核對 11/11 全中才接。欄位待首趟實測。
          python feeds.py --run --feed etfsplit --start "$M0" --end "$M1" --sleep 5
          # ★ 上櫃面額變更：**只讀 repo、不連外**，用股數倍率推因子。
          #   TWTB8U 只涵蓋上市、TPEx 沒有對應端點，這 14 筆只能這樣算。
          #   四道閘門任一沒過就整批不寫（與 tdcc 同一個規矩）。
          python otcparvalue.py --run

      # ★★ 面額變更與 ETF 分割的**歷史回補**，分批做。
      #   2015-01 ~ 今天是 141 個月 × 2 支 ≈ 282 發，配 --sleep 5 要 24 分鐘，
      #   塞不進上面那一步（整個 job 上限 25 分鐘）。所以每趟只補 30 個月，
      #   靠台帳 `data/universe/<feed>/_fetched.json` 記住問到哪，
      #   幾趟之後自然補完，補完之後這一步就變成 no-op。
      #   ⛔ 台帳記的是「**問過、結果是什麼**」，不是「有沒有檔案」——
      #     這三支沒有事件的月份不寫檔，拿檔案存在與否當進度會永遠補不完。
      #   ⚠ 失敗的月份**不記台帳**，下一趟會再問（限流那種會自己好）。
      # ⛔ 這兩支**必須拆成兩步**，不可以放在同一個 for 迴圈裡。
      #   2026-09-09 01:47 實測：兩支共用一個 timeout-minutes: 12，
      #   parvalue 跑完 30 個月就把預算用光，**etfsplit 一個月都沒輪到**
      #   （台帳 parvalue 31 個月 vs etfsplit 1 個月，而那 1 個月是當月那一步寫的）。
      #   ⚠ 失敗的樣子是「看起來成功」：兩支的 runlog 都是 ✓，因為 etfsplit
      #     那一步根本沒跑、不會留下失敗紀錄。分開才看得出誰沒跑完。
      - name: 面額變更（歷史回補，每趟 30 個月）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python feeds.py --run --feed parvalue --start 2015-01 --end 2026-09 \
            --limit 30 --sleep 5

      - name: ETF 分割（歷史回補，每趟 30 個月）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python feeds.py --run --feed etfsplit --start 2015-01 --end 2026-09 \
            --limit 30 --sleep 5

      # ★ 只讀本地檔、不連外。**一定要排在上一步後面**，否則新事件不會進因子。
      #   全量重建，資料沒變就不會 commit。
      - name: 算還原因子
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python adjust.py

      # ★ 上櫃減資：拿官方參考價逐筆對我方因子。**只讀 repo，不連外。**
      #   ⛔ 一定要排在 `adjust.py` **之後**——它比的是 `data/adj/` 的內容，
      #     排前面就是拿上一趟的因子去對這一趟的表。
      #   ⚠ 對照表是**人工匯出**的，所以「官方有我方沒有」那一項同時會在
      #     ① 我方漏抓 ② 匯出檔過期 兩種情況下吵。兩種都需要人處理，故不分開。
      # ★ 「不累積就永久失去」的那幾份，有沒有真的在累積。
      #   ⛔ **一定要排在 `holiday.py` 之後**：它檢查的 `data/holiday/` 與
      #     `holiday_schedule.csv` 就是那一步產生的，排前面會在第一趟誤報。
      #   ⚠ 這一步**不加 continue-on-error 的理由**：這幾份的共同點是
      #     「壞掉時整條管線是綠的」，而且**補不回來**——
      #     集保官方只留一年、行事曆只給當年。紅了要當天處理。
      # ★ 資料稽核：報「憑什麼說它是對的」，⛔ 不報「對不對」。
      #   刻意**不設 check**——它報的是證據等級，硬要它紅會逼人把等級寫高，
      #   那正好毀掉這份報告的用處。
      # ★ 三份原本只有自我一致的資料，各自的第二判準。
      #   ⚠ 融資那條的相等率崩掉，最常見的原因是**前一個交易日的檔案不存在**
      #   ⇒ 它同時在驗數字與涵蓋率。
      - name: 交叉判準（三大法人／融資融券／本益比）
        if: always()
        continue-on-error: true
        run: python crosscheck.py

      - name: 資料稽核（憑什麼說它是對的）
        if: always()
        continue-on-error: true
        run: python data_audit.py

      # ★★ 上櫃交易日曆的**外部判準**（2026-09-09 新增）。
      #   上櫃日曆一直是 `_data_audit.md` 裡唯一一列 C 級：只有自我一致
      #   （日曆＝日檔裡有上櫃成交的日期集合，拿自己的產出當自己的判準）。
      #   上市那半有 FMTQIK，⛔ 但 FMTQIK 只有上市。
      #   `otccal_probe.py` 在 Actions 上量到櫃買 openapi 的
      #   `tpex_daily_trading_index`（大盤層級，跟我方逐檔行情不同條路）。
      #   ⛔ **它只給最近 7 個交易日**——swagger 標題寫「歷史」是誤導，
      #     8 個「歷史指數」端點實測每一個都只回 7 列。
      #   ⇒ 跟集保同一族：**不累積就永久失去**，所以每天跑，
      #     而且下面的 freshness_check 有一條在盯它。
      #   ⚠ 一定要排在 `fetch.py` 之後（它要讀當天的日檔）
      #     與 `freshness_check.py` 之前（否則第一趟會誤報檔案不存在）。
      - name: 上櫃交易日曆判準（櫃買大盤，只給 7 天 ⇒ 每天累積）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python otc_calendar.py

      - name: 累積型資料的新舊檢查
        if: always()
        run: python freshness_check.py

      # ⛔⛔ 2026-09-10 才發現的結構性缺口：**上櫃的除權息／減資事件，
      #   在每日排程裡根本不會更新**——只有人手動跑那個幾小時的 FinMind
      #   全掃（`feeds.yml mode=otc-adj`，971 檔 × 2）才會動。
      #   ⇒ 一筆新的上櫃減資發生之後，`data/adj/` 可能好幾天甚至更久沒有它，
      #     ⚠ 而那段期間那一檔的還原序列就是**假報酬**，沒有任何東西會叫。
      #
      # ⭐ 而官方那條 `bulletin/revivt` **一發請求就回 283 列、回到 2013**。
      #   ⇒ 每天打一發，讓「官方有、我方 data/adj 沒有」變成**每天會叫的斷言**。
      #   ⛔ 這兩支**不寫 `data/adj/`**（單一寫入者是 `adjust.py`／`otc_adj.py`），
      #     它們只出判準——⚠ 這正是要的：**大聲報缺口**，而不是偷偷補上去。
      #
      # ⚠ 判準只對**涵蓋期內**（≥ 首個日檔）的缺口設 check：
      #   涵蓋期外那些是真的歷史欠帳，天天紅會被學會忽略。
      - name: 上櫃減資／除權息的官方判準（各一發請求）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python selftest_twparse.py
          python selftest_otc_reduce_history.py
          python otc_reduce_history.py
          python selftest_otc_exright_history.py
          python otc_exright_history.py

      - name: 上櫃減資對帳
        if: always()
        continue-on-error: true
        run: python reduce_check.py

      # ★ 全母體斷點掃描＋與 par_change.csv 對帳（市場情報分析線 2026-09-09 08:45 裁定要排）。
      #   規則屬回測線／K線線（backtest/breakpoint_scan.py），這裡只是薄殼接進管線——
      #   ⛔ 不在這邊複製一份規則，兩份會各自演化而且不會有人發現。
      #   位置在 adjust 之後：它讀 data/adj/ 的事件，早跑會對到舊的因子。
      #   實測 2,129 檔約 21 秒，加上 pandas 安裝約 30 秒，不會排擠別支。
      #
      # ⚠ 這是整條管線**第一個**需要第三方套件的步驟（其餘全是標準庫）。
      #   所以裝不起來時 breakpoint_check.py 會報 ✗，**不是安靜跳過**——
      #   安靜跳過就會天天回報「沒問題」，那正是這道檢查要防的失敗形狀。
      - name: 裝 pandas（只有斷點掃描要用）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pip install --quiet --disable-pip-version-check pandas

      - name: 斷點掃描與面額變更對帳
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python breakpoint_check.py

      # ★ `continue-on-error`：轉置是**衍生檔**，它失敗不該讓當天的原始資料無法落檔。
      #   失敗會在 Actions 顯示為該步驟紅字，但 commit 照常進行。
      # ★ 步驟層級也要設 timeout。`continue-on-error` 只讓「步驟失敗」不中斷流程，
      #   **擋不住 job 層級的逾時**——job 被砍時後面的 Commit 步驟會一起死，
      #   那天的原始資料就沒落檔。這一步吃掉的時間必須有上限。
      # ★ 第一次全新建立**不要走這裡**，請先手動跑一次「個股庫轉置（手動重建）」
      #   （那支 timeout 60 分）。之後每天只是把有變動的檔重寫，時間很短。
      # ★★ 2026-09-07：`--kind both` 改成 `--kind all`（多了 margin 與 per 兩層）。
      #   融資融券與本益比原本只有日期軸，要一檔的長序列得掃 2,845 個日檔、數百 MB。
      #   ⚠ **這兩層第一次建立會 commit 約 490 MB，一定要先用手動那支跑**，
      #     不要讓這個 15 分鐘的步驟去扛。之後每天只有變動的檔會進 commit。
      #   ⚠ transpose 是**全量重建**，四層一起跑比兩層久，timeout 由 8 分提到 15 分。
      # ★★ 2026-09-07 新增。放在轉置**之前**，因為它跟個股庫無關而且很快。
      #   ⚠ **上櫃停牌（bulletin/sprc）沒有歷史，只有當日。**
      #     這一步每晚一天上線，就永久少掉那一天的上櫃停牌——回補補不回來。
      #     上市那三條與上櫃的處置、注意都有 2015 起的歷史，可以事後回補；
      #     只有這一項不行。
      #   ⚠ TWSE 限流回的是 **307**（不是 429），`suspend.py` 內部會退避重試。
      #     sleep 給 8：這一步只打十幾發，慢一點無所謂，被擋掉才麻煩。
      - name: 停牌／處置／注意
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: python suspend.py --daily --sleep 8

      # ★ 被防護擋下來的請求要印出來。這一支所有的失效模式都是「跑起來完全正常」，
      #   log 裡沒印、又沒人去讀 data/meta/_suspend_skipped.txt 的話，
      #   少收一整塊資料跟「今天真的沒有」長得一模一樣（2026-09-07 實際發生過兩次）。
      # ★★ 上市**短期**暫停交易的完整歷史（TWSE TWTAWU，使用者 2026-09-09 提供）。
      #   我方原有的 `suspend.csv` 10,034 列裡 **9,594 列是權證**，普通股只有 409 列
      #   ⇒ **上市普通股的暫停交易，我方幾乎沒有紀錄**。這一支補那一塊，
      #     而且 `startDate`/`endDate` 一次拿得到 11 年（7,215 筆／6,656 檔）。
      #   ⛔ **它不是「長期停止買賣」的來源**，這是實測不是推測：
      #     停牌長度 p50 = 1 天、≥30 天只有 1 筆（0.0%）；
      #     4414 如興那段 203 個交易日不在裡面，而它在這個端點裡有 3 筆全是一天
      #     ⇒ 不是「這檔沒收錄」，是**收錄範圍就是短期**。
      #   ⚠ `date=` 單日**完全沒生效**（兩個不同日期回同一份），只有區間有效。
      # ★★ 上櫃除權息的**外部判準**（櫃買 `/tpex_exright_daily`，
      #   市場情報分析線 2026-09-09 20:45 找到）。
      #   ⛔ 為什麼十一年來都沒有：上櫃除權息走 `otc_adj.py` ← FinMind，
      #     而它當初的驗證是「抽 **60 檔上市**逐筆對官方，只有我方有＝0」。
      #     **那個驗證套不到上櫃**，而且方向只有一個（FinMind ⊇ 我方）；
      #     「官方有而我方沒有」從來沒被驗過——因為上櫃當時沒有官方來源可比。
      #   ⇒ 這一支就是那個反方向的斷言。實測 2026-09-09 當天至少 2 筆沒落地
      #     （4160 訊聯基因：未還原看起來跌 1.63%，實際是漲 3.24%，**符號相反**）。
      #   ⛔ 它**不寫** `data/universe/otcexright/`：那個目錄的唯一寫入者是
      #     `otc_adj.py`，多一個寫入者＝後寫的贏、跟新舊無關（probe.yml 檔頭記過）。
      #     要不要改由官方供料，是「換維護者」的決定，不是順手加一行。
      #   ⚠ 端點只給**當日** ⇒ 跟集保同一族，不累積就永久失去。
      # ★★ 缺還原因子的每日清單（K線線 2026-09-09 21:55 的判準 ＋ 情報分析線的裁定）。
      #   判準三條件：change ∈ {'', '0.0'}（**兩市寫法不同**）／close ≠ 前收／
      #   前一列是緊鄰交易日。⛔ 第三條是關鍵：沒有它偽陽性差 289 倍。
      #   ⛔ 不設絕對門檻——歷史欠帳一開就是 80 筆，絕對門檻會天天紅，
      #     而天天紅的檢查會被學會忽略。⇒ 判準是「**未歸因的筆數有沒有比上一趟多**」。
      #   ⚠ 並且同時印總數與本輪變化量：只印總數的話，
      #     「補了 100 筆」與「新增 100 筆」會互相抵銷成 0。
      # ⛔ 2026-09-09 清理時發現：`n1_history.py` **沒有排進任何 workflow**，
      #   最後一次執行是當天 17:26 我手動跑的。
      #   而 `_n1_history.csv` 是市場情報分析線訂 N₁ 門檻的依據，他們每天在引用
      #   ⇒ **一份每天被引用、卻只在有人想到時才更新的檔**，是最容易悄悄過期的那種。
      #   ⚠ 它是純本地計算（讀 data/stocks/），不打任何端點，成本只有幾十秒。
      - name: N₁ 歷史序列（情報分析線訂門檻的依據）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python n1_history.py

      # ★★ `shares`（發行股數）的**第一條外部判準**。市場情報分析線 2026-09-10 00:20
      #   找到櫃買「個股市值排行」`afterTrading/dailyMarktVal`，欄位含發行股數與收盤價，
      #   他們比 2026-09-09 是 868/868 零誤差。
      #   ⚠ 涵蓋範圍**只有上櫃**——上市那一半仍然是 C 級，
      #     ⛔ 不可以在任何文件裡寫成「shares 已有外部判準」。
      #   ⛔ 這一支只寫判準檔，不碰 stocks.csv 也不碰 universe/daily（單一寫入者）。
      - name: 發行股數對帳（上櫃，官方個股市值排行）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python selftest_shares.py
          python shares_check.py

      # ★★ 母體日檔**整列漏掉**的規模。市場情報分析線 2026-09-10 00:20
      #   拿到官方直接證據（6904 伯鑫 9 月官方 7 天、我方 3 天，而且成交張數 0 的
      #   日子還有零股成交金額）⇒ 官方確實發布那一列，是我方不寫。
      #   ⭐ 這一支不連外：拿**我方自己已經存著的六張官方清單**做差集，
      #     所以它每天都算得起，修好之後數字會自己降下來。
      #   ⛔ 排在所有 feed 之後：早跑會拿到今天還沒抓的清單，算出假的漏列。
      - name: 母體漏列規模（六張官方清單差集，不連外）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python selftest_missing_rows.py
          python missing_rows.py

      # ⭐ K線線 2026-09-10 13:00 要的那個判準：回補期間，「沒有那一列」有兩個意思
      #   （A 真的沒成交／B 還沒補到），⛔ 而它們在檔案上長得一模一樣。
      #   ⇒ 這一支從資料自己算出「哪幾天已經是新語意」，讓他們的閘門
      #     對還沒補到的日子標**不可判定**，而不是**不通過**。
      #   ⚠ 誤擋不會有人抱怨（少推薦幾檔而已）⇒ 沒有這支就會安靜地錯整段回補期。
      #   ⛔ 排在漏列之後：兩支都是量測，要看同一批檔。
      - name: 無成交列水位（哪幾天已是新語意，不連外）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python selftest_notrade_watermark.py
          python notrade_watermark.py

      - name: 缺還原因子清單（只看有沒有變多）
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python adj_gap.py

      - name: 上櫃除權息判準（官方當日，逐日累積）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python otc_exright_check.py

      - name: 上市短期暫停交易（TWTAWU，一次一個請求拿 11 年）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python suspend_twse.py

      - name: 停牌抓取有沒有被擋下來
        if: always()
        continue-on-error: true
        run: |
          if [ -s data/meta/_suspend_skipped.txt ]; then
            n=$(grep -vc '^#' data/meta/_suspend_skipped.txt || true)
            [ "$n" -gt 0 ] && { echo "★ 被擋下來 $n 筆："; grep -v '^#' data/meta/_suspend_skipped.txt | head -20; }
          fi

      - name: 個股庫轉置
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: python transpose.py --kind all

      # ★ 就算抓失敗也要 commit：_manifest.json 裡有每一項的失敗原因，
      #   那正是失敗時最需要看到的東西。原本失敗就整個 job 停掉，
      #   結果 repo 裡什麼都沒有，只能去翻 Actions log（2026-08-31 實測）。
      # ★ 資料庫現況總表。放在轉置之後，這樣各層檔數是最新的。
      #   它不抓網路、不改資料，只讀 data/ 然後寫一頁 _db_status.md。
      #   有了它，「資料庫還缺啥」是跑一支腳本、讀一頁，不是臨時拼十幾次查詢。
      - name: 資料庫現況
        if: always()
        continue-on-error: true
        run: python db_status.py --write

      # ★ 交易日曆（只補當月，一個請求）。
      #   `data/meta/calendar_twse.csv` 是「哪一天該有資料」的**唯一外部判準**——
      #   來自 TWSE FMTQIK（大盤層級），與建日檔的個股端點不同條路，
      #   所以它不是循環自證。但它**自己會落後**：2026-09-08 之前只有手動跑過，
      #   當時就落後一天，而任何拿它當閘門的檢查都會把最新那天判成非交易日。
      #   ⛔ 一定要用預設的「併入」，**不可以加 --replace**——
      #      只跑當月又整份覆蓋的話，2,845 天會被截成那個月的幾天，
      #      而且不會報錯（selftest_calendar.py 第 1 節就是釘這件事）。
      - name: 交易日曆（當月）
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          M=$(TZ=Asia/Taipei date '+%Y-%m')
          echo "當月 $M（台北時間）"
          python calendar_audit.py --start "$M" --end "$M" --sleep 5 --write

      # ★ 產業別（約每月一次，自癒式）。
      #   類股集中度是選股的硬條件，而新上市的公司在對照表更新之前查不到類股——
      #   查不到就等於那條規則對它沒生效，**而且不會報錯**。
      #   ⛔ 判斷「多久沒更新」一定要用 **git 的 commit 時間**，不可以用檔案 mtime：
      #      Actions 每次都是全新 checkout，mtime 永遠是「剛剛」，
      #      用它的話這一步**永遠不會跑**，而且看起來完全正常。
      - name: 產業別（超過 28 天沒更新才跑）
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          TS=$(git log -1 --format=%ct -- data/meta/industry.csv || true)
          TS=${TS:-0}
          AGE=$(( ( $(date +%s) - TS ) / 86400 ))
          echo "industry.csv 上次更新：$AGE 天前（commit 時間）"
          if [ "$TS" = "0" ] || [ "$AGE" -ge 28 ]; then
            DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
            echo "→ 重建（掃類股成員用 $DAY）"
            python industry.py --run --date "$DAY" --sleep 3
          else
            echo "→ 還新，跳過（未滿 28 天）"
          fi

      # ⛔ 端點探針**已移出這一支**，改由 `.github/workflows/probe.yml` 單獨跑。
      #
      # ⚠ 2026-09-09 實測到的問題（**兩支寫同一批檔，後推的贏，跟程式新舊無關**）：
      #     04:13  probe.yml 用**修好的** tpex_probe.py 寫出 `_tpex_probe.txt`（ee717791）
      #     04:15  daily.yml 用**舊的**（它 checkout 的是更早的 commit）
      #            寫出同一個檔並推上去（421ba137）⇒ **把新的蓋掉了**
      #   而 `_*probe.txt` 在 commit 那段的 REGEN 白名單裡（衝突時取本趟版本），
      #   所以這件事**完全不會報錯**：檔案在、格式對，只是內容退回舊版。
      #   ⇒ 這正是這個專案一直在防的形狀，而我自己在 40 分鐘前造了一個。
      #
      # → 探針改成**單一寫入者**：只有 `probe.yml` 寫 `data/meta/_*probe.txt`。
      #   代價是「探針程式改了會自動重跑」這個自癒條件沒有了——
      #   ⚠ **改探針的人要自己按一次 probe.yml**（一趟約 1 分鐘）。
      #   寫在這裡，不要靠記得。

      # ★ 漲跌家數：先抓當天，再分批回補歷史。
      #   `MI_INDEX` **吃 date 參數**，所以 2015 起都抓得到——
      #   `market_breadth.csv` 只有 2026-09-01 起是因為那是 v6 才開始存的，
      #   **不是端點沒有歷史**。有了歷史才訂得出差值帶寬（事後看資料再訂門檻
      #   等於沒有門檻）。
      #   ⚠ 兩段分開跑：feeds 的日期順序是由舊到新，只跑一段的話今天會排在
      #     最後面，等回補跑完才輪到——那要好幾天。所以先單獨抓當天。
      #   ⚠ `--limit 200`：一趟只補 200 天（sleep 1 約 4 分鐘），
      #     已存在的日檔會自動跳過，跑十幾趟就補完，不必有人按按鈕。
      - name: 漲跌家數（當天 ＋ 分批回補）
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          DAY=$(python -c "import json;print(json.load(open('data/latest/_manifest.json'))['target_trading_day'])")
          python feeds.py --run --feed breadth --start "$DAY" --end "$DAY" --sleep 0
          TODAY=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          python feeds.py --run --feed breadth --start 2015-01-01 --end "$TODAY" \
                          --limit 200 --sleep 1

      # ★ 拿大盤漲跌家數（MI_INDEX）當日檔的外部判準。離線、只讀。
      #   日曆只證明「那一天存不存在」，不證明「那天收到幾檔」；
      #   content_audit 的家數檢查是拿前後交易日比，那是同一條管線不同趟次。
      #   MI_INDEX 是大盤層級彙總表，與建日檔的個股端點不同條路——整批漏抓時
      #   日檔家數會掉、它不會，差值就會翻負。
      #   ⚠ 目前**只驗方向不驗大小**：樣本只有五天，事後看資料再訂帶寬
      #     等於沒有門檻。等 ≥30 天再把數字寫死。
      - name: 漲跌家數對日檔（離線）
        if: always()
        continue-on-error: true
        run: python breadth_audit.py

      # ★ 一次讀完整個資料庫最近一輪的狀況，不必逐檔去翻。
      #   ⚠ **一定要排在最後一支會寫 `_last_run.md` 的腳本後面。**
      #     2026-09-08 之前它排在轉置與還原因子前面，印出來的永遠是上一輪的內容——
      #     一份**看起來完整、其實過期**的摘要，比沒有摘要更糟。
      #   任何一塊是 ✗ 就去看該支腳本那一步的 log；步驟本身照樣綠的，
      #   因為 `continue-on-error`，紅字在檔案裡不在 job 狀態上。
      - name: 這一輪的摘要
        if: always()
        continue-on-error: true
        run: |
          cat data/meta/_last_run.md || true
          # ⚠ 2026-09-09：這裡本來是 `grep -q '✗'`，掃整份檔。
          #   而檔頭的說明文字就有一句「任何一塊標成 ✗ 就要去看該支的 log」
          #   ⇒ **這道警告從第一天起每一趟都亮，一次都沒有正確過**。
          #   天天亮的紅字沒有人會看——它想抓的東西反而被自己蓋掉了。
          #   （另外各區塊的說明文字也可能提到 ✗，例如「⛔ 不設 ✗」。）
          #   ⇒ 只認**區塊標題那一行**的狀態：runlog 寫的是 `## <名字>　✗ 有問題`。
          if grep -qE '^## .*✗' data/meta/_last_run.md 2>/dev/null; then
            echo "::warning::_last_run.md 有 ✗ 的區塊，見上面內容"
            grep -nE '^## .*✗' data/meta/_last_run.md
          fi

      - name: Commit 回 repo
        if: always()
        run: |
          # ⛔ 這一段本來在**八支 workflow 各抄一份**。同一段邏輯抄兩份，
          #   今晚已經害過一次（`limit` 的 bug 在 fetch/backfill 各一份，
          #   修好的那份天天跑、沒修的那份只有回補才跑）。⇒ 只留一份。
          bash push_data.sh "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
      - name: 回報抓取結果
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "抓資料失敗，詳細原因看 data/latest/_manifest.json 的 errors 欄位"
          exit 1
