name: 前瞻紀錄（每月，回測線的 forward_and）

# ⭐ 回測線 2026-09-13 01:30 來信要的：`backtest/forward_and.py` 每月跑一次、
#   把 `backtest/forward/` 推上 main。
#
# ## ⛔⛔ 為什麼這件事**必須**排程，不可以靠人記得手動跑
#
# 前瞻紀錄漏跑一個月，那個月的訊號只能**用後來的資料重算**
# ——⚠ 而重算出來的東西**就不是前瞻了**。
# ⇒ 它屬於「不累積就永久失去」那一族（跟 `stophalt` 同一族），
#   ⛔ 而那一族已經證實不可以掛在「有人會記得」上面。
#
# ## ⛔⛔ 而它**只准在 main 上跑**（CLAUDE.md 四點六那個會刪資料的例外）
#
# 它讀 `data/stocks/`、`data/universe/`——⚠ 而分支上的 `data/` 永遠比 main 舊
# ⇒ 在分支上跑＝拿過期的輸入算訊號，⛔ 而算出來的東西長得跟對的一模一樣。

on:
  schedule:
    # 每月 13 日 20:00 台北（＝ 12:00 UTC）。⚠ 月營收 10 日公布 ⇒ 13 日跑得到。
    - cron: "0 12 13 * *"
    # ⭐⭐ P4 四型（回測線 2026-09-15 01:41 來信要的）。
    #   量測日 ＝ 每月**第一個交易日**，而進場價要拿**次日開盤** ⇒ 要等次一交易日收盤。
    #   ⚠ 而「第一個交易日是哪天」會被元旦、農曆年、颱風推移
    #   ⇒ ⛔ 不可以寫死某一天。⭐ 2~7 日**每天跑一次**，靠程式自己認：
    #     同一量測日已有紀錄就不寫（冪等、回 0）；次日開盤還沒進日檔就紅掉不寫。
    #   ⇒ 六次機會裡只有對的那一次會寫進去。第一趟 2026-10-02。
    - cron: "0 12 2-7 * *"
  workflow_dispatch:
    inputs:
      which:
        description: "auto 照排程決定｜and 只跑 forward_and｜p4 只跑 forward_p4"
        type: choice
        options: [auto, and, p4]
        default: auto

permissions:
  contents: write

concurrency:
  group: forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⛔⛔ 回測線 2026-09-13 02:30 在我的分支上讀出來的：這一步原本**不存在**。
      #   `forward_and` import pandas 與 numpy ⇒ 會在「跑前瞻紀錄」那步 ImportError。
      # ⚠ 而失敗的樣子會是「那個月沒跑」——正是前瞻紀錄最怕的形狀。
      # ⛔ 這裡**不加 `continue-on-error`**（`daily.yml` 那一步有，因為斷點掃描是附帶的）：
      #   裝不起來就等於這一趟不能跑，要當場紅，⚠ 不可以往下走到「跑了但少一筆」。
      - name: 裝 pandas 與 numpy（forward_and 要用）
        timeout-minutes: 5
        run: python -m pip install --quiet --disable-pip-version-check pandas numpy

      - name: 驗 workflow 自己（每一段 shell 的語法，零相依）
        run: python selftest_workflows.py

      - name: 掃有沒有第二份實作（零相依）
        run: python selftest_no_dup.py

      # ⛔⛔ 低水位檔這一族 `selftest_no_dup.py` **抓不到**：八份的函式本體長得
      #   都不一樣（讀的檔名不同、回傳的形狀不同）⇒ 那道守門比的是 AST 函式本體。
      #   ⚠ 而這一族有**兩種相反的語意**（有的只准往上、有的只准往下）
      #   ⇒ 抄錯方向 = 那道閘門在反方向守門，**而畫面上永遠是 ✓**。
      #   ⇒ ⭐ 它要自己的守門（CLAUDE.md 四點五第九次）。零相依。
      - name: 掃低水位檔有沒有第九份實作（零相依）
        run: python selftest_lowwater.py

      # ⛔⛔ `continue-on-error: true` 的自測紅了，run 的 conclusion 仍然是
      #   **success** ⇒ 沒有任何地方會說（daily.yml 有 62 個這種步驟）。
      #   ⚠ 抓資料那些自己會寫 runlog ⇒ 看得到；⛔ **自測沒有** ⇒ 看不到。
      #   ⇒ `ci_step.py` 記下來、`ci_report.py` 寫成 runlog 區塊。
      #   ⭐ 這一道釘的是那兩支本身（⛔ 尺壞掉 ⇒ 它會說「全綠」）。零相依。
      - name: 驗「紅掉的自測會被說出來」（零相依）
        run: python selftest_ci_steps.py

      # ⛔⛔ 這一道釘的不是那個判準，是**呼叫點**：2026-09-14 我把集保週檔的
      #   「累積週數只准往上」寫在 `main()` 最後面，⚠ 而 `main()` 在
      #   「這一週的檔已經存在」時早就 return 了——⭐ 而那是**每天都會走的**那條路
      #   ⇒ 那道閘門一週只跑一天，而它要擋的事每天都可能發生。零相依、不連外。
      - name: 驗集保週檔的閘門真的每天都跑（零相依）
        run: python selftest_tdcc.py

      # ⛔⛔ 這一道擋的是 CLAUDE.md 四點六那個**會刪資料**的例外。
      #   ⚠ 在分支上跑會讀到過期的 `data/` ⇒ 訊號算錯，而且看不出來。
      - name: ⛔ 只准在 main 上跑（讀 data/）
        run: |
          BR="${GITHUB_REF_NAME:-}"
          if [ "$BR" != "main" ]; then
            echo "⛔ 這一支讀 data/，在分支（$BR）上跑會拿到過期的輸入" >&2
            echo "   ⇒ 算出來的訊號長得跟對的一模一樣。⛔ 不跑。" >&2
            exit 1
          fi
          echo "✓ 在 main 上"

      # ⭐⭐ 「這一趟跑哪一支」**只在這裡決定一次**（四點五）。
      #   ⚠ 兩條 cron 打進**同一支** workflow ⇒ 靠 `github.event.schedule` 分辨，
      #     ⛔ 不要分成兩支 workflow——那一整串守門步驟就會變成兩份。
      #   ⚠ 手動派工時 `github.event.schedule` 是空的 ⇒ 由 `which` 決定，
      #     而 `auto` 在手動派工下代表**兩支都跑**（各自冪等，跑到已有紀錄就不寫）。
      - name: ⭐ 決定這一趟跑哪一支
        id: pick
        run: |
          SCH="${{ github.event.schedule }}"
          WH="${{ inputs.which }}"
          RUN_AND=0
          RUN_P4=0
          if [ -n "$SCH" ]; then
            case "$SCH" in
              "0 12 13 * *")  RUN_AND=1 ;;
              "0 12 2-7 * *") RUN_P4=1 ;;
              *) echo "⛔ 不認得的排程字串：$SCH" >&2; exit 1 ;;
            esac
          else
            case "${WH:-auto}" in
              and)  RUN_AND=1 ;;
              p4)   RUN_P4=1 ;;
              *)    RUN_AND=1; RUN_P4=1 ;;
            esac
          fi
          echo "and=$RUN_AND" >> "$GITHUB_OUTPUT"
          echo "p4=$RUN_P4"   >> "$GITHUB_OUTPUT"
          echo "⇒ forward_and=$RUN_AND｜forward_p4=$RUN_P4（排程「$SCH」／which「$WH」）"

      # ⛔⛔ `forward_and` import 的三支判準模組（research11／13／34）
      #   若有任何一支不在 main 上，這一趟**要大聲失敗**，
      #   ⚠ 不可以讓它變成「跑了、但少了一個月」——那正是前瞻紀錄最怕的。
      #   ⚠ 2026-09-13 實測：main 上**只有 research34**，另外三支還在
      #     `claude/stock-analysis-backtest-iv9xji` 分支上 ⇒ 這一道現在是紅的，
      #     ⭐ 而它紅得對：排程跑的是 main（四點六③）。
      - name: ⭐ 判準模組真的在 main 上（⛔ 不是在分支上）
        run: |
          MISS=""
          for M in forward_and research11 research13 research34; do
            [ -f "backtest/$M.py" ] || MISS="$MISS $M"
          done
          if [ -n "$MISS" ]; then
            echo "⛔ main 上缺這幾支：$MISS" >&2
            echo "   ⇒ 排程跑的是 **main**（CLAUDE.md 四點六③）," >&2
            echo "     分支上有不算數。請回測線先把它們推上 main。" >&2
            exit 1
          fi
          echo "✓ 四支都在 main 上"

      - name: 跑前瞻紀錄
        if: steps.pick.outputs.and == '1'
        run: python3 -m backtest.forward_and

      # ⭐⭐ P4 四型（回測線 2026-09-15 01:41 §一）。
      # ⛔ 同一個道理：模組不在 **main** 上就要**當場紅**，
      #   ⚠ 不可以變成「跑了、但那個月沒有紀錄」——前瞻紀錄補不回來。
      #   ⚠ 2026-09-15 現況：`forward_p4.py`／`p4_features.py` 還在回測線的分支上
      #     ⇒ 這一道現在會紅，⭐ 而它紅得對（排程跑的是 main，四點六③）。
      - name: ⭐ P4 的模組真的在 main 上（⛔ 不是在分支上）
        if: steps.pick.outputs.p4 == '1'
        run: |
          MISS=""
          for M in forward_p4 p4_features; do
            [ -f "backtest/$M.py" ] || MISS="$MISS $M"
          done
          if [ -n "$MISS" ]; then
            echo "⛔ main 上缺這幾支：$MISS" >&2
            echo "   ⇒ 排程跑的是 **main**（CLAUDE.md 四點六③）," >&2
            echo "     分支上有不算數。請回測線先把它們推上 main。" >&2
            exit 1
          fi
          echo "✓ 兩支都在 main 上"

      # ⚠ 自測跟著跑（回測線 2026-09-15 §一末：請放進 selftest 清單）。
      #   ⛔ 不加 `continue-on-error`：這一支的產出補不回來，
      #     自測紅了就不該往下寫。
      # ⚠ 這裡用 **glob**，⛔ 不逐支寫死檔名——那兩支現在還在回測線的分支上，
      #   而 `selftest_workflows` 有一道「workflow 叫到的自測必須**存在**」
      #   ⇒ 寫死檔名會讓那一道紅，而它紅得沒有道理（這裡本來就擋了不存在的情況）。
      #   ⭐ 而 glob 有它自己的坑：**一個都沒配到時跟全部通過長得一樣**
      #   ⇒ 底下數出來、0 個就大聲說「這一層沒跑」。
      - name: 驗 P4 前瞻（回測線的自測，backtest/ 底下）
        if: steps.pick.outputs.p4 == '1'
        run: |
          N=0
          for T in backtest/selftest_*p4*.py; do
            [ -f "$T" ] || continue
            N=$((N + 1))
            echo "── $T ──"
            python3 "$T"
          done
          if [ "$N" -eq 0 ]; then
            echo "⚠⚠ **這一層沒跑**：main 的 backtest/ 底下一支 P4 自測都沒有"
            echo "   ⇒ ⛔ 不算失敗（下一步的模組檢查會擋），⛔ **也不算驗過**"
          else
            echo "✓ 跑了 $N 支"
          fi

      - name: 跑前瞻紀錄（P4 四型）
        if: steps.pick.outputs.p4 == '1'
        run: python3 -m backtest.forward_p4

      # ⭐⭐ 市場情報分析線 2026-09-13 01:50 §① 要的：
      #   「跑完請把**當次的輸入指紋**一起推進 forward/，不要只推結果。」
      #   理由：main 的回補是逐年分批推的 ⇒ **今天算出來的訊號，和一年後
      #   重算同一天的訊號可能不一樣**，⚠ 而前瞻紀錄的全部價值就在
      #   「這個數字是哪一版資料算的」這一句上。
      # ⛔ 累積型：**逐行追加**，不可以整份覆蓋（CLAUDE.md 四點六）。
      - name: ⭐ 把這一趟的輸入指紋追加進去（⛔ 不是覆蓋）
        run: |
          mkdir -p backtest/forward
          python3 - <<'PY' >> backtest/forward/_runs.jsonl
          import io, json, os, subprocess, sys
          sys.path.insert(0, ".")
          import runlog
          import transpose as T
          rec = {
              "asof": runlog.now_tpe().strftime("%Y-%m-%dT%H:%M:%S+08:00"),
              "data_sha": subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  capture_output=True, text=True).stdout.strip(),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              # ⭐ 日檔指紋：檔數／總位元組／最後一天。⛔ 不是只比最後一天
              #   ——2026-09-11 那次就是「最後一天一樣、中間少了幾萬列」。
              "daily": T.source_fingerprint("price"),
          }
          p = "data/stocks/_built.json"
          if os.path.exists(p):
              rec["stocks_built"] = json.load(io.open(p, encoding="utf-8"))
          print(json.dumps(rec, ensure_ascii=False, sort_keys=True))
          PY
          echo "── 這一趟追加的：──"
          tail -1 backtest/forward/_runs.jsonl
          echo "── 累計 $(wc -l < backtest/forward/_runs.jsonl) 趟 ──"

      # ⛔ 只有一份推檔實作（CLAUDE.md 四點五）。`PUSH_TREES` 換的是**要搬哪一棵樹**，
      #   重試、逐鍵合併那些都照舊——⚠ 另寫一支的話，漏掉的那幾道不會有人發現。
      - name: Commit 回 repo
        env:
          PUSH_TREES: backtest/forward
        # ⛔⛔ 這一行原本是**單行** `run:`，而它的值裡有 `forward: `（冒號＋空白）
        #   ⇒ YAML 把它讀成一個對映 ⇒ **整份 forward.yml 解析失敗**。
        #   ⚠ 而 GitHub 照樣把它**註冊成一支 workflow**（state: active），
        #     只是名字顯示成檔案路徑、而且 `workflow_dispatch` **靜靜不存在**
        #     ——派工時才回「Workflow does not have 'workflow_dispatch' trigger」。
        #   ⇒ 用區塊純量（`run: |`），冒號在裡面就沒有意義了。
        run: |
          bash push_data.sh "forward: 前瞻紀錄（$(TZ=Asia/Taipei date +%Y-%m-%d)）"
